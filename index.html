r"}, {"id": 95, "uz": "Aytib o‘tish kerak, qadrdonlikni, hurmat-izzatni toshirib yuboradigan diydorlashuvlar Navro‘zning bag‘rikenglik va ezgulik timsoli ekanining yana bir yorqin misoli bo‘la oladi.", "qq": "Aytıp ótiw kerek, qádirdanlıqtı, húrmet-izzetti tastırıp jiberetuǵın diydarlasıwlar Nawrızdıń keńpeyillik hám jaqsılıq tımsalı ekeniniń jáne bir ayqın mısalı bola aladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 96, "uz": "Navro‘zning dilbar kuyi yangrab, milliy liboslari bilan atrofga chiroy bergan yoshlar, oq fotihasi bilan doimo ularga to‘g‘ri yo‘lni ko‘rsatib turadigan nuroniylar, qadrli yurtdoshlarimiz mustahkam og‘izbirchilik bilan bayramni munosib nishonlamoqda.", "qq": "Nawrızdıń janǵa jaǵımlı naması shalınıp, milliy kiyimleri menen átirapqa sán bergen jaslar, aq pátiyası menen bárhama olarǵa tuwrı joldı kórsetip otıratuǵın nuranıylar, qádirli watanlaslarımız bekkem awızbirshilik penen bayramdı múnásip belgilemekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 97, "uz": "Ilohim, ko‘nglimizdagi barcha ezgu niyatlarimiz amalga oshsin!", "qq": "Ilayım, kewlimizdegi barlıq jaqsı niyetlerimiz ámelge assın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 98, "uz": "Yurtimiz tinch, xalqimiz omon, og‘izbirchiligimiz bardavom bo‘lsin!", "qq": "Elimiz tınısh, xalqımız aman, awızbirshiligimiz dawamlı bolsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 99, "uz": "Navro‘z bayrami barchamizga muborak bo‘lsin!", "qq": "Nawrız bayramı bárshemizge múbárek bolsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 100, "uz": "Navro‘z bayra aǵıshladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 106, "uz": "Yangilanish va yosharish, kun bilan tunning tenglashgan kuni 21-mart umumxalq Navro‘z bayrami bu yil Qonliko‘l tumanida keng tarzda yuqori muvaffaqiyat bilan bo‘lib o‘tdi.", "qq": "Janalanıw hám jasarıw, kún menen túnniń teńlesken kúni 21-mart ulıwmaxalıqlıq Nawrız bayramı bıyıl Qanlıkól rayonında keń túrde joqarı jetiskenlik penen bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 107, "uz": "keng jamoatchiligi uchun yutuqlarga boy, mo‘l yutuqlar yili bo‘lib keldi.", "qq": "keń jámiyetshiligi ushın tabıslarǵa bay, mol jetiskenlik jılı bolıp keldi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 108, "uz": "Qonliko‘l tumani Bo‘ston mahallasida umumxalq bayrami - Navro‘z keng va ko‘tarinki ruhda nishonlandi.", "qq": "Qanlıkól rayonı Bostan máhállesinde ulıwmaxalıqlıq bayram - Nawrız keń hám kóterińki ruwxta belgilendi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 109, "uz": "Bayram tadbirida mahalla ahli, nuroniylar, yoshlar va turli soha vakillari ishtirok etdi.", "qq": "Bayram ilajında máhálle xalqı, nuraniylar, jaslar hám túrli taraw wákilleri qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 110, "uz": "Tadbir davomida milliy qadriyatlarimiz, urf-odat va an’analarimiz namoyish etildi.", "qq": "Ilaj dawamında milliy qádiriyatlarımız, úrp-ádet hám dástúrlerimiz kórsetildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 111, "uz": "Milliy taomlar tayyorlanib, xalq o‘yin r", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 116, "uz": "Ushbu ulug‘ ayyom barchamizga tinchlik-osoyishtalik, fayzu baraka, mehr-oqibat va saxovat olib kelsin.", "qq": "Bul ullı áyyam bárshemizge tınıshlıq-paraxashılıq, qut-bereket, miyrim-shápáát hám saqawat alıp kelsin.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 117, "uz": "Muqaddas Ramazon oyi davomida xalqimiz sabr-qanoat, mehr-oqibat, bag‘rikenglik kabi yuksak insoniy fazilatlarni yanada mustahkamladi.", "qq": "Muqaddes Ramazan ayı dawamında xalqımız sabır-qanaat, miyrim-shápáát, keńpeyillik sıyaqlı joqarı insanıylıq pazıyletlerdi jáne de bekkemledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 118, "uz": "Bu oyda amalga oshirilgan ezgu amallar, savobli ishlar jamiyatimizda o‘zaro hurmat va hamjihatlik muhitini yanada mustahkamladi.", "qq": "Bul ayda ámelge asırılǵan iygilikli ámeller, sawaplı isler jámiyetimizde óz-ara húrmet hám awızbirshilik ortalıǵın jáne de kúsheytti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 119, "uz": "Bugun nishonlanayotgan Ramazon hayiti - insonparvarlik, kechirimlilik va mehr-muruvvat bayramidir.", "qq": "Búgin belgilenip atırǵan Ramazan hayıtı - insanıylıq, keshirimlilik hám miyrim-shápáát bayramı bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 120, "uz": "Shu kunlarda ehtiyojmandlarga yordam qo‘lini cho‘zish, keksalarning holidan xabar olish, yaqinlarimizni xursand qilish xalqimizning asriy qadriyatlariga aylangan.", "qq": "Bul kúnlerde mútájlerge járdem qolın sozıw, jası úlkenlerdiń halınan xabar alıw, jaqınlarımızdı quwandırıw xalqımızdıń ásirlik qádiriyatlarına aylanǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 121, "uz": "Aziz yurtdoshlar!", "qq": "Áziz watanlaslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 122, "uz": "Bugungi kunda mamlakatimizda olib borilayotgan keng ko‘lamli islohotlar, bunyodkorlik ishlari, aholi farovonligini oshirish yo‘lidagi sa’y-harakatlar barchamizni yagona maqsad - rivojlangan, obod va farovon jamiyat barpo etishga undamoqda.", "qq": "Búgingi kúnde elimizde alıp barılıp atırǵan keń kólemli reformalar, dóretiwshilik jumıslar, xalıqtıń abadanlıǵın arttırıw jolındaǵı háreketler bárshemizdi bir maqset - rawajlanǵan, abat hám abadan jámiyet qurıwǵa shaqırmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 123, "uz": "Bunday ezgu maqsadlarga erishishda sizlarning fidokorona mehnatingiz, hamjihatligingiz muhim ahamiyatga ega.", "qq": "Bunday iygilikli maqsetlerge erisiwde sizlerdiń pidákerlik miynetińiz, awızbirshiligińiz úlken áhmiyetke iye.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 124, "uz": "Fursatdan foydalanib, barcha soha xodimlariga, mehnatkash xalqimizga, yoshlarimizga o‘z minnatdorligimni bildiraman.", "qq": "Usı pursattan paydalanıp, barlıq taraw xızmetkerlerine, miynetkesh xalqımızǵa, jaslarımızǵa óz minnetdarshılıǵımdı bildiremen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 125, "uz": "Sizlarning halol mehnatingiz tufayli tumanimiz yanada rivojlanib bormoqda.", "qq": "Sizlerdiń hadal miynetińiz sebepli rayonımız jáne de rawajlanıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 126, "uz": "Yana bir bor barchangizni Ramazon hayiti bilan tabriklayman.", "qq": "Jáne bir márte bársheńizdi Ramazan hayıtı menen qutlıqlayman.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 127, "uz": "Har bir xonadonga tinchlik, sog‘lik, baxt va baraka tilayman.", "qq": "Hár bir shańaraqqa tınıshlıq, densawlıq, baxıt hám bereket tileymen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 128, "uz": "Qilayotgan barcha ezgu amallaringiz qabul bo‘lsin!", "qq": "Qılıp atırǵan barlıq iygilikli ámellerińiz qabıl bolsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 129, "uz": "Ramazon hayitingiz qutlug‘ bo‘lsin!", "qq": "Ramazan hayıtıńız qutlı-múbárek bolsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 130, "uz": "Poytaxtimiz Nukus shahrida umumxalq Navro‘z sayliga bag‘ishlangan teatrlashtirilgan va adabiy musiqali xoreografik bayram tomoshalari 21-mart kuni 10:30 da «Do‘stlik» kanali bo‘yidagi O‘zbekiston milliy, madaniy boyligi ko‘chasida bo‘lib o‘tadi.", "qq": "Paytaxtımız Nókis qalasında ulıwma xalıqlıq Nawrız seyiline baǵıshlanǵan teatrlastırılǵan hám ádebiy muzıkalı xoreografiyalıq bayram tamashaları 21-mart kúni 10:30 de «Doslıq» kanalı boyındaǵı Ózbekstan milliy, mádeniy baylıǵı kóshesinde bolıp ótedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 131, "uz": "Bayram sayillari yuqori kayfiyatda san’at ustalari ijrosidagi kuy-qo‘shiqlar, teatrlashtirilgan badiiy-adabiy chiqishlar, milliy xalq o‘yinlari va boshqa bayram tomoshalari bilan ko‘taringki ruhda o‘tkaziladi.", "qq": "Bayram seyilleri joqarı keypiyatta kórkem óner sheberleri atqarıwındaǵı saz-sáwbetler, teatrlastırılǵan kórkem-ádebiy shıǵıwlar, milliy xalıq oyınları hám basqa da bayram tamashaları menen kóterińki ruwxta ótkeriledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 132, "uz": "Insonparvarlik, sabr-toqat va qanoat, shukronalik timsoli bo‘lgan muborak Ramazon hayitini katta xursandchilik bilan kutib olayotgan siz azizlarni qutlug‘ ayyom bilan chin yurakdan tabriklaymiz.", "qq": "Insaniylıq, sabır hám qanaat, shúkirshilik tımsalı bolǵan múbárek Ramazan hayıtın úlken quwanısh penen kútip alıp atırǵan siz ázizlerdi qutlı áyyam menen shın júrekten qutlıqlaymız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 133, "uz": "Barchaning ko‘ngli quvonch va ezgulik nuriga to‘lib turgan ushbu quvonchli damlarda Ramazon hayitiga mehnatkash va bag‘rikeng xalqimiz bilan birga omonlikda yetkazgani uchun yaratgan egamizga cheksiz shukronalar aytamiz.", "qq": "Bársheniń kewli quwanısh hám jaqsılıq nurına tolıp turǵan usı quwanıshlı demlerde Ramazan hayıtına miynetkesh hám keńpeyil xalqımız benen birge amanlıqta jetkergeni ushın jaratqan iyemizge sheksiz shúkirshilik bildiremiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 134, "uz": "Bugungi tinch-osoyishta hayotimizning qadriga yetish, jamiyatimizda hukm surayotgan turli millat va diniy konfessiyalar o‘rtasidagi bag‘rikenglik, bir-biriga bo‘lgan o‘zaro hurmat muhitini yanada mustahkamlash barchamizning asosiy vazifamizdir.", "qq": "Búgingidey tınısh turmısımızdıń qádirine jetiw, jámiyetimizde húkim súrip atırǵan túrli millet hám diniy konfessiyalar arasındaǵı keńpeyillikti, bir-birewge bolǵan óz-ara húrmet ortalıǵın jáne de bekkemlew hámmemizdiń tiykarǵı wazıypamız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 135, "uz": "Qadrli vatandoshlar!", "qq": "Qádirli Watanlaslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 136, "uz": "Siz azizlarni Ramazon hayiti bilan yana bir bor tabriklab, oila, do‘st va yaqinlar bilan birga fayzli va mazmunli o‘tkazishingizni tilaymiz.", "qq": "Siz ázizlerdi Ramazan hayıtı menen jáne bir márte qutlıqlap, shańaraq, dos hám jaqınlar menen birge payızlı hám mazmunlı ótkeriwińizdi tileymiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 137, "uz": "Ilohim yurtimiz tinch, xalqimiz omon bo‘lsin.", "qq": "Iláyim elimiz tınısh, xalqımız aman bolsın.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 138, "uz": "Ayollar tadbirkorligini qo‘llab-quvvatlovchi \"Hamroh\" kompaniyasining Qoraqalpog‘iston filiali ochildi.", "qq": "Hayal-qızlar isbilermenligin qollap-quwatlawshı «Hamroh» kompaniyasınıń Qaraqalpaqstan filialı ashıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 139, "uz": "Bugun Nukus shahrida xotin-qizlar tadbirkorligini qo‘llab-quvvatlash borasida muhim hisoblangan \"Hamroh\" kompaniyasi Qoraqalpog‘iston filialining ochilishiga bag‘ishlangan tadbir o‘tkazildi.", "qq": "Búgin Nókis qalasında hayal-qızlar isbilermenligin qollap-quwatlaw baǵdarında áhmiyetli esaplanǵan «Hamroh» kompaniyası Qaraqalpaqstan filialınıń ashılıwına arnalǵan ilaj ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 140, "uz": "Unda Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesining Raisi Amanbay Orinbaev, O‘zbekiston Respublikasi Prezidenti Administratsiyasi rahbarining maslahatchisi N.Davletova ishtirok etdi.", "qq": "Onda Qaraqalpaqstan Respublikası Joqarǵı Keńesiniń Baslıǵı Amanbay Orınbaev, Ózbekstan Respublikası Prezidenti Adminstraciyası baslıǵınıń konsultantı N.Davletova qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 141, "uz": "Ta’kidlanganidek, so‘nggi yillarda hurmatli Prezidentimiz rahbarligida xotin-qizlarni qo‘llab-quvvatlash davlat siyosatining ustuvor yo‘nalishlaridan biriga aylandi.", "qq": "Atap ótilgenindey, sońǵı jılları húrmetli Prezidentimizdiń basshılıǵında hayal-qızlardı qollap-quwatlaw mámleketlik siyasattıń baslı baǵdarlarınan birine aylandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 142, "uz": "Yurtimizda ularga tadbirkorlik yo‘nalishida ko‘plab imtiyozlar berilmoqda.", "qq": "Elimizde olarǵa isbilermenlik baǵdarında kóplegen jeńillikler berilmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 143, "uz": "Shu qatorda, Prezidentimizning 240-sonli farmoni bilan \"Hamroh\" kompaniyasi tomonidan 2026-2027 yillarda 6 ming nafar xotin-qizlarning tadbirkorlik loyihalarini moliyaviy qo‘llab-quvvatlash uchun 2 trillion so‘m yo‘naltirish, 3 mingga yaqin xotin-qizlarni tadbirkorlikka o‘qitish hamda 2 ming nafar xotin-qizning tadbirkorlik faoliyatiga ko‘maklashish belgilangan.", "qq": "Usı qatarda, Prezidentimizdiń 240-sanlı pármanı menen «Hamroh» kompaniyası tárepinen 2026-2027-jıllarda 6 mıń hayal-qızlardıń isbilermenlik joybarların finanslıq qollap-quwatlaw ushın 2 trillion sum qaratıw, 3 mıńǵa jaqın hayal-qızlardı isbilermenlikke oqıtıw hámde 2 mıń hayal-qızdıń isbilermenlik jumısına járdemlesiw belgilengen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 144, "uz": "Ana shunday ezgu ishlar qatorida kompaniya filialining ochilishi xotin-qizlarimizni tadbirkorlikka keng jalb etishga, ularning o‘z biznesini yanada rivojlantirishiga ko‘maklashishga asos bo‘lib xizmat qiladi.", "qq": "Mine usınday iygilikli jumıslardıń qatarında kompaniya filialınıń ashılıwı hayal-qızlarımızdı isbilermenlikke keńnen tartıwǵa, olardıń óz biznesin ele de rawajlandırıwına kómeklesiwge tiykar bolıp xızmet etedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 145, "uz": "Navro‘z bayrami kunlari turli madaniy va sport tadbirlari ham keng o‘tkaziladi.", "qq": "Nawrız bayramı kúnleri túrli mádeniy hám sport ilajları da keńnen ótkeriledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 146, "uz": "Milliy kurash, ot sporti, xalq o‘yinlari kabi musobaqalar yoshlarda sportga qiziqishni oshirib, ularni sog‘lom turmush tarziga chorlaydi.", "qq": "Milliy gúres, at sportı, xalıq oyınları sıyaqlı jarıslar jaslarda sportqa qızıǵıwshılıqtı arttırıp, olardı salamat turmıs tárizine shaqıradı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 147, "uz": "Bunday tadbirlar milliy merosimizni asrab-avaylashda muhim o‘rin tutadi.", "qq": "Bunday ilajlar milliy miyrasımızdı qásterlep saqlawda áhmiyetli orın iyeleydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 148, "uz": "Navro‘z bayrami tinchlik va farovonlik ramzi sifatida ham alohida qadrlanadi.", "qq": "Nawrız bayramı tınıshlıq hám abadanlıq tımsalı sıpatında da ayrıqsha qádirlenedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 149, "uz": "Tinch elga - bayramlar yarashadi.", "qq": "Tınısh elge – bayramlar jarasadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 150, "uz": "Shu bois xalqimiz bu bayramni katta shodu xurramlik bilan kutib olib, uni ko‘tarinki ruhda nishonlaydi.", "qq": "Sonıń ushın xalqımız bul bayramdı úlken quwanısh penen kútip alıp, onı kóterińki ruwxta belgileydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 151, "uz": "Navro‘z - bu yangilanish, poklanish va ezgulik bayramidir.", "qq": "Nawrız - bul jańalanıw, pákleniw hám jaqsılıq bayramı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 152, "uz": "U har bir inson qalbiga quvonch bag‘ishlab, kelajakka bo‘lgan ishonchni mustahkamlaydi.", "qq": "Ol hár bir insannıń qálbine quwanısh baǵıshlap, keleshekke bolǵan isenimdi bekkemleydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 153, "uz": "Har doimgidek bayram munosabati bilan ot sporti maydoni ot sporti ixlosmandlari bilan gavjum bo‘ldi.", "qq": "Hár qashanǵıday bayram múnásibeti menen at sportı maydanı at sportı ıshqıpazları menen tolı boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 154, "uz": "Respublikamizning turli joylaridan kelgan chavandozlar 1, 2, 3, 5, aylanalardan boshlab, bir aylana va havaskor chavandozlar uchun musobaqalar o‘tkazilib, g‘oliblar munosib taqdirlandi.", "qq": "Respublikamızdıń túrli orınlarınan kelgen shabandozlar 1, 2, 3, 5, 7 aylawlardan baslap, bir aylaw hám háwesker shabandozlar ushında jarıslar ótkerilip, jeńimpazlar múnásip sıylıqlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 155, "uz": "Prezident Shavkat Mirziyoyev Samarqand shahrida jamoat transporti uchun olib kelingan zamonaviy elektrobuslar va quvvatlash stansiyasi faoliyati bilan tanishdi.", "qq": "Prezident Shavkat Mirziyoev Samarqand qalasında jámiyetlik transport ushın alıp kelingen zamanagóy elektrobuslar hám quwatlaw stanciyasınıń jumısı menen tanıstı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 156, "uz": "Davlatimiz rahbarining 2023-yil 17-fevralda qabul qilingan “Jamoat transporti tizimini isloh qilish chora-tadbirlari to‘g‘risida”gi qarori asosida hududlarda ham avtotransport xizmatlari yaxshilanib, jamoat transporti yo‘nalishlari kengaytirilmoqda.", "qq": "Mámleketimiz basshısınıń 2023-jıl 17-fevralda qabıl etilgen “Jámiyetlik transport sistemasın reformalaw ilajları haqqında”ǵı qararı tiykarında aymaqlarda da avtotransport xızmetleri jaqsılanıp, jámiyetlik transport jónelisleri keńeytilmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 157, "uz": "Bunda avtobus parklarini zamonaviy talablar asosida modernizatsiya qilish, yo‘nalishlar bo‘ylab ekologik toza avtotransport qatnovini tashkil etishga alohida e’tibor qaratilmoqda.", "qq": "Onda avtobus parklerin zamanagóy talaplar tiykarında modernizaciyalaw, jónelisler boylap ekologiyalıq taza avtotransport qatnawın shólkemlestiriwge ayrıqsha itibar qaratılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 158, "uz": "Ayni maqsadlarda Samarqand shahriga birinchi bosqichda 49 million dollar hisobiga 100 ta zamonaviy elektrobus olib kelindi.", "qq": "Mine, usı maqsetlerde Samarqand qalasına birinshi basqıshta 49 million dollar esabınan 100 zamanagóy elektrobus alıp kelindi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_q ikulnews", "genre": "Xabar"}, {"id": 238, "uz": "Poyezd yetti vagondan iborat, soatiga 260 kilometrgacha tezlikda harakatlana oladi.", "qq": "Poezd jeti vagonnan ibarat, saatına 260 kilometrge shekem tezlikte háreketlene aladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 239, "uz": "Oynalari qoraytirilgan oq rangli tarkib O‘zbekiston bayrog‘ini eslatuvchi moviy, yashil va qizil rangli chiziqlar hamda “Jaloliddin Manguberdi” yozuviga ega.", "qq": "Aynaları qaraytılǵan aq reńli quram Ózbekstan bayraǵın esletiwshi kók, jasıl hám qızıl reńli sızıqlar jáne “Jaloliddin Manguberdi” jazıwına iye.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 240, "uz": "Poyezdning uzunligi 175 metrni, sig‘imi esa uchta – VIP, biznes va ekonom toifalarida 390 nafarga yaqin yo‘lovchini tashkil etadi.", "qq": "Poezdıń uzınlıǵı 175 metrdi, sıyımı bolsa úsh – VIP, biznes hám ekonom kategoriyalarında 390 ǵa shamalas jolawshını quraydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 241, "uz": "Poyezd O‘zbekiston iqlimi uchun maxsus ishlab chiqilgan bo‘lib, changga, juda yuqori va juda past haroratlarga hamda qum bo‘ronlariga chidamli tizimlar bilan jihozlangan, uzoq masofalarga mo‘ljallangan.", "qq": "Poezd Ózbekstan klimatı ushın arnawlı islep shıǵılǵan bolıp, shańǵa, júdá joqarı hám júdá tómen temperaturalarǵa jáne qum boranlarına shıdamlı sistemalar menen úskenelengen, uzaq aralıqlarǵa mólsherlengen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 242, "uz": "Yaqin orada “Jaloliddin Manguberdi” poyezdi Toshkent – Urganch – Xiva yo‘nalishi bo‘ylab qatnay boshlaydi.", "qq": "Jaqın arada “Jaloliddin Manguberdi” poezdı Tashkent – Úrgensh – Xiywa jónelis : "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 300, "uz": "Har bir amalga oshirilayotgan loyiha – yurtimizdagi ulkan o‘zgarishlarning bir qismi.", "qq": "Ámelge asırılıp atırǵan hár bir joybar – elimizdegi úlken ózgerislerdiń bir bólegi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 301, "uz": "Albatta, ish o‘rinlariga talab oshib bormoqda.", "qq": "Álbette, jumıs orınlarına talap artıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 302, "uz": "Shuning uchun biz yanada faol ishlayapmiz, har bir hududda yangi imkoniyatlar yaratishga harakat qilyapmiz, – dedi davlatimiz rahbari.", "qq": "Sonıń ushın biz jáne de jedel islep atırmız, hár bir aymaqta jańa imkaniyatlar jaratıwǵa háreket etip atırmız, – dedi mámleketimiz basshısı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 303, "uz": "Prezident Shavkat Mirziyoyev viloyatga tashrifi doirasida hududda yirik loyihalarni ishga tushirish va qurilishini boshlashga bag‘ishlangan marosimda ishtirok etdi.", "qq": "Prezident Shavkat Mirziyoev wálayatqa saparı sheńberinde aymaqta iri joybarlardı iske qosıw hám qurılısın baslawǵa baǵıshlanǵan máresimde qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 304, "uz": "Tadbir doirasida viloyatda oziq-ovqat, yengil sanoat, kimyo va farmatsevtika, qurilish materiallari, metall va mebel sanoati sohalarida ishlab chiqarilayotgan mahsulotlar ko‘rgazmasi tashkil etildi.", "qq": "Ilaj sheńberinde wálayatta azıq-awqat, jeńil sanaat, ximiya hám farmacevtika, qurılıs materialları, metall hám mebel sanaatı tarawlarında islep shıǵarılıp atırǵan ónimler kórgizbesi shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 305, "uz": "Davlatimiz rahbari hududning zamonaviy ishlab chiqarish quvvatlari, ilg‘or texnika va texnologiyalari, sanoat mahsulotlari bilan tanishdi.", "qq": "Mámleketimiz basshısı aymaqtıń zamanagóy óndirislik quwatlıqları, aldınǵı texnika hám texnologiyaları, sanaat ónimleri menen tanıstı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 306, "uz": "Samarqand viloyati mamlakatimiz iqtisodiyotida strategik o‘ringa ega hudud sifatida barqaror rivojlanib bormoqda.", "qq": "Samarqand wálayatı mámleketimiz ekonomikasında strategiyalıq orınǵa iye aymaq sıpatında turaqlı rawajlanıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 307, "uz": "So‘nggi yillarda bu yerda sanoat hajmi izchil o‘sib, qulay ishbilarmonlik va investitsiya muhiti mahalliy hamda xorijiy sarmoyalarni keng jalb etishga mustahkam zamin yaratdi.", "qq": "Keyingi jılları bul jerde sanaat kólemi izbe-iz ósip, qolaylı isbilermenlik hám investiciyalıq ortalıq jergilikli hám sırt el investiciyaların keńnen tartıwǵa bekkem tiykar jarattı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 308, "uz": "Chet el kapitali ishtirokidagi korxonalarning soni yildan-yilga ortib borayotgani bu boradagi ijobiy dinamikani yaqqol tasdiqlaydi.", "qq": "Sırt el kapitalınıń qatnasıwındaǵı kárxanalardıń sanı jıldan-jılǵa artıp baratırǵanı bul baǵdardaǵı unamlı dinamikanı anıq tastıyıqlaydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 309, "uz": "Marosimda shahar va tumanlarda qariyb 7 milliard dollar investitsiya hisobiga 106 ta yangi loyiha ishga tushirish va qurilishga tayyor ekani haqida axborot berildi.", "qq": "Máresimde qala hám rayonlarda derlik 7 milliard dollar investiciya esabınan 106 jańa joybardı iske qosıw hám qurıwǵa tayar ekeni haqqında málimleme berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 310, "uz": "Tadbirga videoaloqa orqali yangi qurilayotgan hamda ishga tushirilayotgan loyihalarning mas’ullari ham ulandi.", "qq": "Ilajǵa videobaylanıs arqalı jańadan qurılıp atırǵan hám iske qosılıp atırǵan joybarlardıń juwapkerleri de jalǵandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 311, "uz": "Ushbu loyihalar viloyat iqtisodiyotining turli tarmoqlarini qamrab olgan.", "qq": "Bul joybarlar wálayat ekonomikasınıń túrli tarmaqların qamtıp alǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 312, "uz": "Jumladan, tog‘-kon sanoati va geologiya, qurilish materiallari, avtosanoat, kimyo sanoati, elektrotexnika, qishloq xo‘jaligi, ta’lim, sog‘liqni saqlash, xizmat ko‘rsatish va turizm sohalarida yangi quvvatlarni ishga tushirish hamda istiqbolli obyektlar qurilishini boshlash nazarda tutilgan.", "qq": "Sonıń ishinde, taw-kán sanaatı hám geologiya, qurılıs materialları, avtosanaat, ximiya sanaatı, elektrotexnika, awıl xojalıǵı, bilimlendiriw, densawlıqtı saqlaw, xızmet kórsetiw hám turizm tarawlarında jańa quwatlıqlardı iske qosıw jáne perspektivalı obektlerdiń qurılısın baslaw názerde tutılǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 313, "uz": "Marosimda Prezident Shavkat Mirziyoyev loyihalar ijrochilari, mahalliy va xorijiy kompaniyalar vakillari bilan suhbatlashdi, ularning taklif hamda tashabbuslarini tingladi.", "qq": "Máresimde Prezident Sh a loyiha bo‘yicha qurilish ishlari boshlandi.", "qq": "Sonday-aq, Niderlandiya, Yaponiya, Qubla Koreya, Qıtay, Birlesken Arab Ámirlikleri, Túrkiya, Rossiya hám Iran menen birgelikte 4 milliard 600 million dollarlıq 53 joybar boyınsha qurılıs jumısları baslandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 318, "uz": "Ushbu loyihalarning amalga oshirilishi hisobiga 18 mingta yangi ish o‘rni yaratish, 13 trillion so‘mlik sanoat mahsulotlarini ishlab chiqarish va buning natijasida 700 million dollarlik eksport salohiyatini ta’minlash imkoniyati paydo bo‘ladi.", "qq": "Bul joybarlardıń ámelge asırılıwı esabınan 18 mıń jańa jumıs ornın jaratıw, 13 trillion sumlıq sanaat ónimlerin islep shıǵarıw hám sonıń nátiyjesinde 700 million dollarlıq eksport potencialın támiyinlew imkaniyatı payda boladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 319, "uz": "Bu esa viloyat sanoatini diversifikatsiya qilish, zamonaviy ishlab chiqarish zanjirlarini kengaytirish va eksport geografiyasini yanada oshirishga xizmat qiladi.", "qq": "Bul bolsa wálayat sanaatın diversifikaciyalaw, zamanagóy óndiris shınjırların keńeytiw hám eksport geografiyasın jáne de arttırıwǵa xızmet etedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 320, "uz": "Shu yerning o‘zida Prezidentimizga Narpay tumanida suv resurslaridan foydalanish samaradorligini oshirish va nasos stansiyalarini davlat-xususiy sheriklik asosida boshqaruvga berish bo‘yicha amalga oshirilgan ishlar hamda istiqboldagi rejalar taqdimot qilindi.", "qq": "Usı jerdiń ózinde Prezidentimizge Narpay rayonında suw resurslarınan paydalanıw nátiyjeliligin arttırıw hám nasos stanciyaların mámleketlik-jeke menshik sheriklik tiykarında basqarıwǵa beriw boyınsha ámelge asırılǵan jumıslar hám ke a yo‘nalishlarida 6 oylik uzluksiz amaliyoti yo‘lga qo‘yiladi.", "qq": "Sonday-aq, tarawda dual bilimlendiriw jolǵa qoyılıp, 72 studenttiń suw xojalıǵı, awıl xojalıǵın mexanizaciyalaw, gidrotexnika hám gidroenergetika, kadastr hám ekologiya baǵdarlarında 6 aylıq úzliksiz ámeliyatı jolǵa qoyıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 326, "uz": "Davlatimiz rahbari bu ishlarni izchil va tizimli davom ettirish yuzasidan mutasaddilarga topshiriqlar berdi.", "qq": "Mámleketimiz basshısı bul jumıslardı izbe-iz hám sistemalı dawam ettiriw boyınsha juwapkerlerge tapsırmalar berdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 327, "uz": "Shundan so‘ng Prezident Shavkat Mirziyoyev raisligida Narpay tumanida Samarqand viloyatini ijtimoiy-iqtisodiy rivojlantirish masalalari yuzasidan yig‘ilish bo‘lib o‘tdi.", "qq": "Bunnan soń Prezident Shavkat Mirziyoevtiń basshılıǵında Narpay rayonında Samarqand wálayatın sociallıq-ekonomikalıq rawajlandırıw máseleleri boyınsha májilis bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 328, "uz": "Davlatimiz rahbari, avvalo, yig‘ilganlarni kirib kelayotgan muborak Ramazon hayiti va qutlug‘ ayyom – Navro‘zi olam bilan chin qalbdan tabrikladi.", "qq": "Mámleketimiz basshısı, bárinen burın, jıynalǵanlardı kirip kiyatırǵan múbárek Ramazan hayıtı hám qutlı áyyyam – Nawrız bayramı menen shın júrekten qutlıqladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 329, "uz": "Samarqandga oxirgi tashrifdan keyin o‘tgan to‘rt oy davomida mamlakatimiz hayotida katta o‘zgarishlar ro‘y bergani ta’kidlandi.", "qq": "Samarqandqa sońǵı saparınan soń ótken tórt ay dawamında mámleketimiz turmısında úlken ózgerisler júz bergeni atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 330, "uz": "Xususan, shu haftaning o‘zida Olmaliq shahrida 3-mis boyitish fabrikasi ishga tushirildi, poytaxtimizda nafaqat O‘zbekiston, balki butun Markaziy Osiyoning ma’naviy xazinasi bo‘lgan Islom sivilizatsiyasi markazi ochildi.", "qq": "Atap aytqanda, usı hápteniń ózinde Almalıq qalasında 3-mıs bayıtıw fabrikası iske qosıldı, paytaxtımızda tek ǵana Ózbekstan emes, al pútkil Oraylıq Aziyanıń ruwxıy ǵáziynesi bolǵan Islam civilizaciyası orayı ashıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 331, "uz": "Ertaga esa Payariq tumanida buyuk hadisshunos ajdodimiz Imom Buxoriy yodgorlik majmuasining ochilish marosimi o‘tkazilishi qayd etildi.", "qq": "Erteń bolsa Payariq rayonında ullı hádistanıwshı babamız Imam Buxariy estelik kompleksiniń ashılıw máresimi ótkeriletuǵını atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 332, "uz": "Davlatimiz rahbari bugun Vatanimiz qudratini yuksaltirish, har bir oila va har bir inson hayotini yaxshilash bo‘yicha yanada katta marralar olinganini, hududlarda amalga oshirilayotgan ishlar esa bunga mustahkam zamin yaratayotganini ta’kidladi.", "qq": "Mámleketimiz basshısı búgin Watanımız qúdiretin arttırıw, hár bir shańaraq hám hár bir insannıń turmısın jaqsılaw boyınsha jáne de úlken shekler alınǵanın, aymaqlarda ámelge asırılıp atırǵan jumıslar bolsa oǵan bekkem tiykar jaratıp atırǵanın atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 333, "uz": "Shu bilan birga, bugungi talab kechagi yondashuvlar bilan cheklanib qolmaslikni, ertangi kun vazifalari esa yanada samarali va qat’iy harakat , pirovardida esa viloyat iqtisodiyotini yuksaltirishga xizmat qilishi shartligi qayd etildi.", "qq": "Bul qarjılar, bárinen burın, rayonlarda jumıssızlıq hám kámbaǵallıqtı qısqartıwǵa, sońında bolsa wálayattıń ekonomikasın kóteriwge xızmet etiwi shárt ekenligi atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 339, "uz": "Yig‘ilishda tumanlarning sanoat, servis va qishloq xo‘jaligi ko‘rsatkichlari, yer osti va yer usti zaxiralari, mehnat resurslari, aholining biznes va kasbiy ko‘nikmalarini sun’iy intellekt yordamida tahlil qilish, mahallalar imkoniyatlaridan kelib chiqib, har bir tumanning ichki rivojlanish modelini yaratish zarurligi ko‘rsatib o‘tildi.", "qq": "Májiliste rayonlardıń sanaat, servis hám awıl xojalıǵı kórsetkishleri, jer astı hám jer ústi rezervleri, miynet resursları, xalıqtıń biznes hám kásiplik kónlikpelerin jasalma intellekt járdeminde tallaw, máhállelerdiń imkaniyatlarınan kelip shıǵıp, hár bir rayonnıń ishki rawajlanıw modelin jaratıw zárúr ekenligi kórsetip ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 340, "uz": "Mazkur tahlillar asosida tuman hokimlari, “mahalla yettiligi” va mahalla bankirlari resurslarni eng ko‘p ish o‘rni yaratadigan va byudjet tushumlarini oshiradigan loyihalarga yo‘naltirishi lozim.", "qq": "Usı tallawlar tiykarında rayon hákimleri, “máhálle jetiligi” hám máhálle bankirleri resurslardı eń kóp jumıs ornın jaratatuǵın hám byudjet túsimlerin arttıratuǵın joybarlarǵa baǵdarlawı kerek.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 341, "uz": "Ushbu tizim 1-mayga qadar Narpay va Termiz tumanlarida joriy qilinib, butun respublika uchun namuna sifatida tatbiq etilishi belgilandi.", "qq": "Bul sistema 1-mayǵa shekem Narpay hám Termiz rayonlarında engizilip, pútkil respublika ushın úlgi sıpatında engiziletuǵını belgilendi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 342, "uz": "Yig‘ilishda Samarqand viloyati rahbariyati oldida kamida 9 foiz iqtisodiy o‘sishni ta’minlab, yalpi hududiy mahsulot hajmini 144 trillion so‘mdan oshirish, 3 milliard dollar xorijiy investitsiya jalb etish va eksportni 1,2 milliard dollarga yetkazish vazifasi turgani qayd etildi.", "qq": "Májiliste Samarqand wálayatı basshısı aldında keminde 9 procent ekonomikalıq ósiwdi támiyinlep, jalpı aymaqlıq ónimniń kólemin 144 trillion sumnan arttırıw, 3 milliard dollar sırt el investiciyasın tartıw hám eksporttı 1,2 milliard dollarǵa jetkeriw wazıypası turǵanı atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 343, "uz": "Shuningdek, 100 ming aholini doimiy ish bilan ta’minlash, 31 ming oilani kambag‘allikdan chiqarish va viloyatni ishsizlik hamda kambag‘allikdan xoli hududga aylantirish zarurligi ko‘rsatib o‘tildi.", "qq": "Sonday-aq, 100 mıń xalıqtı turaqlı jumıs penen támiyinlew, 31 mıń shańaraqtı kámbaǵallıqtan shıǵarıw hám wálayattı jumıssızlıq hám kámbaǵallıqtan jıraq aymaqqa aylandırıw zárúr ekenligi kórsetip ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 344, "uz": "Mavjud imkoniyatlar va ishga solinmagan salohiyat Narpay, Qo‘shrabot, Kattaqo‘rg‘on, Paxtachi tumanlari misolida tahlil qilindi.", "qq": "Bar imkaniyatlar hám iske qosılmaǵan potencial Narpay, Qwshrabot, Kattaqwrǵon, Paxtashı rayonları mısalında tallandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 345, "uz": "Ushbu tumanlar va Kattaqo‘rg‘on shahrining viloyat sanoatidagi jami ulushi atigi 10 foizni tashkil qilayotga z": "Umuman, Narpay, Paxtachi, Payariq, Qo‘shrabot, Ishtixon, Kattaqo‘rg‘on tumanlari hamda Kattaqo‘rg‘on shahrida sanoat va servisni rivojlantirish, hududlarga yangicha qiyofa olib kirish ustuvor vazifa sifatida belgilab berildi.", "qq": "Ulıwma, Narpay, Paxtashı, Payariq, Qwshrabot, Ishtixan, Kattaqwrǵon rayonları jáne Kattaqwrǵon qalasında sanaat hám servisti rawajlandırıw, aymaqlarǵa jańasha kórinis alıp kiriw tiykarǵı wazıypa sıpatında belgilep berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 350, "uz": "Yig‘ilishda jahondagi notinchliklar tufayli logistika zanjirlarining uzilishi, neft narxi va transport xarajatlarining oshib borayotgani oziq-ovqat narxlariga ta’sir qilishi tabiiy ekani ta’kidlandi.", "qq": "Májiliste dúnyadaǵı tınıshsızlıqlar sebepli logistika shınjırlarınıń úziliwi, neft bahası hám transport qárejetleriniń artıp atırǵanı azıq-awqat bahalarına tásir etiwi tábiyiy ekeni atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 351, "uz": "Shu bilan birga, dunyoda qariyb 100 million turist sayohat uchun tinch va xavfsiz mamlakatlarni qidirayotgani qayd etildi.", "qq": "Sonıń menen birge, dúnyada derlik 100 million turist sayaxat etiw ushın tınısh hám qáwipsiz mámleketlerdi izlep atırǵanı atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 352, "uz": "Bunday sharoitda oziq-ovqat mahsulotlarini ko‘paytirish, turizm va servis sohalaridagi mavjud imkoniyatlarni to‘liq ishga solish hokimlarning eng asosiy vazifasi bo‘lishi kerakligi ko‘rsatib o‘tildi.", "qq": "Bunday sharayatta azıq-awqat ónimlerin kóbeytiw, turizm hám servis tarawlarındaǵı bar imkaniyatlardı tolıq iske qosıw hákimlerdiń eń tiykarǵı wazıypası bolıwı kerek ekenligi kórsetip ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 353, "uz": "Yaylov yerlarini to‘g‘ridan-to‘g‘ri ijaraga berish muddati yana bir yilga uzaytirilishi belgilandi.", "qq": "Jaylaw jerlerin tikkeley ijaraǵa beriw múddeti jáne bir jılǵa sozdırılatuǵını belgilendi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 354, "uz": "Viloyatning 4 ta tumanida jami 43 ming gektar maydonda jamoat yaylovlari tashkil etilib, mahallalarga 30 yilga bepul ijaraga beriladi.", "qq": "Wálayattıń 4 rayonında jámi 43 mıń gektar maydanda jámiyetlik jaylawlar shólkemlestirilip, máhállelerge 30 jılǵa biypul ijaraǵa beriledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 355, "uz": "Yaylovlarda quduq qazish, suv chiqarish, urug‘ ekish va degradatsiyadan chiqarish xarajatlari uchun 50 milliard so‘m ajratiladi.", "qq": "Jaylawlarda qudıq qazıw, suw shıǵarıw, tuqım egiw hám degradaciyadan shıǵarıw qárejetleri ushın 50 milliard sum ajıratıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 356, "uz": "Chorva naslchiligini rivojlantirish maqsadida laboratoriya uskunalari va naslli qoramol xaridi uchun 10 yilga 12 foizli kredit ajratiladi.", "qq": "Sharwa násilshiligin rawajlandırıw maqsetinde laboratoriya úskeneleri hám násilli qaramal satıp alıw ushın 10 jılǵa 12 procentlik kredit ajıratıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 357, "uz": "Bulung‘ur tumanida 50 million dollarlik go‘sht yo‘nalishidagi naslchilik korxonasi, Qo‘shrabotda esa 20 million dollarlik tuxum yo‘nalishidagi naslchilik korxonasi ishga tushiriladi.", "qq": "Bulunǵur rayonında 50 million dollarlıq gósh baǵdarındaǵı násilsh r", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 389, "uz": "Bu yilgi bayramni “Navro‘zni ulug‘lash – insonni ulug‘lashdir”, degan da’vatkor g‘oya asosida o‘tkazayotganimiz ham buning yana bir tasdig‘idir.", "qq": "Bıyılǵı bayramdı “Nawrızdı ulıǵlaw – insandı ulıǵlaw!”, degen shaqırıwshı ideya tiykarında ótkerip atırǵanımız da bunıń jáne bir dálili bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 390, "uz": "Biz barcha hududlarimizga, qishloq va ovullar, mahallalarimizga Yangi O‘zbekiston nafasini olib kirish bo‘yicha katta harakat boshladik.", "qq": "Biz barlıq aymaqlarımızǵa, awıl hám máhállelerimizge Jańa Ózbekstan nápesin alıp kiriw boyınsha úlken háreket basladıq.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 391, "uz": "Yangi ish o‘rinlari yaratish, kambag‘allikni qisqartirish, ijtimoiy himoyani kuchaytirish borasida ham ulkan qadamlar qo‘ymoqdamiz.", "qq": "Jańa jumıs orınların jaratıw, kámbaǵallıqtı qısqartıw, sociallıq qorǵawdı kúsheytiw baǵdarında da úlken qádemler qoymaqtamız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 392, "uz": "Yangi-yangi zamonaviy korxonalar, kommunikatsiya tarmoqlari, shinam uy-joylar, ta’lim, tibbiyot, madaniyat va sport obyektlari barpo etilmoqda.", "qq": "Jańadan-jańa zamanagóy kárxanalar, kommunikaciya tarmaqları, ıqsham turaq jaylar, bilimlendiriw, medicina, mádeniyat hám sport obektleri qurılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 393, "uz": "Kelgusida bunday qurilishlar ko‘lamini yanada kengaytiramiz.", "qq": "Keleshekte bunday qurılıslardıń kólemin jáne de keńeytemiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 394, "uz": "Ushbu fayzli tongda mirishkor dehqon va fermerlarimizga barchamiz yuksak hurmat va ehtirom bildiramiz.", "qq": "Usı payızlı tańda miynetkesh diyqan hám fermerlerimizge bárshemiz joqarı húrmet-izzet bildiremiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 395, "uz": "Siz, azizlarning elimiz dasturxonini yanada to‘kin va farovon qilishdek ezgu ishlaringizda zafar va omadlar tilaymiz.", "qq": "Siz, ázizlerdiń elimiz dasturxanın jáne de mol hám abadan etiwdey iygilikli islerińizde tabıs hám áwmetler tileymiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 396, "uz": "Chunki, sizlarning olijanob mehnatingiz bilan xalqimizning rizqu nasibasi butun bo‘ladi.", "qq": "Sebebi, sizlerdiń ullı miynetińiz benen xalqımızdıń ırısqı-nesiybesi pútin boladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 397, "uz": "Bu borada davlatimiz, jamiyatimiz sizlarni doimo qo‘llab-quvvatlaydi.", "qq": "Bul baǵdarda mámleketimiz, jámiyetimiz sizlerdi bárqulla qollap-quwatlaydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 398, "uz": "Hurmatli yurtdoshlar!", "qq": "Húrmetli watanlaslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 399, "uz": "Yangi O‘zbekiston mamlakatimiz yoshlari uchun yuksak parvozlar, katta-katta g‘alabalar maydoniga aylanib bormoqda.", "qq": "Jańa Ózbekstan elimiz jasları ushın joqarı párwazlar, úlken-úlken jeńisler maydanına aylanıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 400, "uz": "Yaqinda yoshlarimiz bilan uchrashib, bunga yana bir bor ishonch hosil qildim.", "qq": "Jaqında jaslarımız benen ushırasıp, oǵan jáne bir márte isenim payda ettim.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 401, "uz": "Har bir yo‘nalishda – ta’lim, ilm-fan, madaniyat va san’at, sport, IT va biznes sohalarida yangi nomlar, yangi qahramonlar paydo bo‘lmoqda.", "qq": "Hár bir baǵdarda – bilimlendiriw, ilim, mádeniyat hám kórkem óner, sport, IT hám biznes tarawlarında jańa atamalar, jańa qaharmanlar payda bolmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 402, "uz": "Mana shunday bilimli, jo‘shqin va izlanuvchan o‘g‘il-qizlar bilan barchamiz haqli ravishda faxrlanamiz.", "qq": "Mine, usınday bilimli, kúsh-ǵayratlı hám izleniwsheń ul-qızlarımız benen bárshemiz haqılı túrde maqtanamız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 403, "uz": "Aziz farzandlarim, bugun Uchinchi Renessans bunyodkorlari bo‘lishdek ulkan baxt va yuksak sharaf sizlarga nasib etmoqda.", "qq": "Áziz perzentlerim, búgin Úshinshi Renessanstıń dóretiwshileri bolıwday úlken baxıt hám joqarı mártebe sizlerge nesip etpekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 404, "uz": "Qancha-qancha ajdodlarimiz intilib yashagan shu buyuk orzuni ro‘yobga chiqarishga sizlar albatta qodirsiz.", "qq": "Qanshadan-qansha ata-babalarımız umtılıp jasaǵan bul ullı ármandı álbette, sizler ámelge asıra alasız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 405, "uz": "Bugungi tinch va osoyishta hayotning, yaratilgan katta imkoniyatlar, ota-onalar, ustoz-murabbiylaringiz mehnatining qadriga yetib, tinimsiz o‘qib-o‘rgansangiz, bilim va mahoratingizni doimo oshirib borsangiz –  kelajak albatta siznikidir.", "qq": "Búgingi tınısh hám paraxat turmıstıń, jaratılǵan úlken imkaniyatlardı, ata-analarıńız, ustaz-tárbiyashılarıńızdıń miynetin qádirlep, tınımsız oqıp-úyrenseńiz, bilim hám sheberligińizdi bárqulla arttırıp barsańız – keleshek álbette siziki.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 406, "uz": "Bu yo‘lda sizlarga, butun O‘zbekiston yoshlariga yana qanday sharoit zarur bo‘lsa, barchasini yaratib berishga tayyormiz.", "qq": "Bul jolda sizlerge, pútkil Ózbekstan jaslarına jáne qanday sharayat zárúr bolsa, barlıǵın jaratıp beriwge tayarmız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 407, "uz": "Vatan uchun, millat uchun, xalq uchun deb yashasangiz – Vatan va xalq ham sizni e’zozlab, boshiga ko‘taradi!", "qq": "Watan ushın, millet ushın, xalıq ushın dep jasasańız – Watan hám xalıq ta sizdi qádirlep, basına kóteredi!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 408, "uz": "Yangi O‘zbekistonning oltin avlodi bo‘lib, uning zafar bayrog‘ini baland ko‘tarishdan hech qachon to‘xtamang, aziz farzandlarim!", "qq": "Jańa Ózbekstannıń altın áwladı bolıp, onıń jeńis bayraǵın bálent kóteriwden hesh qashan toqtamań, áziz perzentlerim!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 409, "uz": "Qadrli yurtdoshlar!", "qq": "Qádirli watanlaslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 410, "uz": "Mahalla deganda, ko‘z oldimizda avvalo ona yurtimizning go‘zal timsoli namoyon bo‘ladi.", "qq": "Máhálle degende, kóz aldımızda bárinen burın ana jurtımızdıń gózzal tımsalı kórinedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 411, "uz": "Biz Mahallani rivojlantirish va jamiyatni yuksaltirish yilida yaxshi niyat bilan katta dastur va rejalarni amalga oshirmoqdamiz.", "qq": "Biz Máhálleni rawajlandırıw hám jámiyetti ilgeriletiw jılında jaqsı niyet penen úlken baǵdarlama hám rejelerdi ámelge asırmaqtamız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 412, "uz": "Bu ishlarda oila va jamiyatda tinchlik-totuvlik, o‘zaro mehr-oqibatni mustahkamlash, ijtimoiy muammolarni joyida hal etish, ezgulik va adolatni qaror toptirish uchun ko‘pni ko‘rgan otaxon va onaxonlarimiz, “mahalla yettiligi”, faol fuqarolarimiz yaqindan ishtirok etadilar, deb ishonaman.", "qq": "Bul jumıslarda shańaraq hám jámiyette tınıshlıq-tatıwlıq, óz-ara miyrim-shápáátti bekkemlew, sociallıq mashqalalardı ornında sheshiw, jaqsılıq hám ádillikti engiziw ushın kópti kórgen ata hám analarımız, “máhálle jetiligi”, belsendi puqaralarımız jaqınnan qatnasadı, dep isenemen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 413, "uz": "Fursatdan foydalanib, ertaga nishonlanadigan Mahalla tizimi xodimlari kuni bilan jonkuyar mahalla raislari va faollarini, barcha yurtdoshlarimizni chin qalbimdan tabriklab, ularga yangi muvaffaqiyatlar tilayman.", "qq": "Pursattan paydalanıp, erteń belgilenetuǵın Máhálle sisteması xızmetkerleri kúni menen jankúyer máhálle baslıqları hám belsendilerin, barlıq watanlaslarımızdı shın júrekten qutlıqlap, olarǵa jańa tabıslar tileymen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 414, "uz": "Muhtaram do‘stlar!", "qq": "Húrmetli doslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 415, "uz": "Ming yillar davomida xalqlar o‘rtasida ma’naviy ko‘prik bo‘lib kelayotgan Navro‘zning tinchlik, do‘stlik va hamkorlik g‘oyalari bugungi notinch zamonda yanada dolzarb ahamiyat kasb etmoqda.", "qq": "Mıń jıllar dawamında xalıqlar arasında ruwxıy kópir bolıp kiyatırǵan Nawrızdıń tınıshlıq, doslıq hám birge islesiw ideyaları búgingi tınısh emes zamanda jáne de ayrıqsha áhmiyetke iye bolmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 416, "uz": "Yurtimizda yashayotgan 130 dan ortiq millat va elat vakillari bu bayramni bir bo‘lib, shodu xurramlik bilan nishonlamoqda.", "qq": "Elimizde jasap atırǵan 130 dan aslam millet hám xalıq wákilleri bul bayramdı birgelikte, quwanısh penen belgilemekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 417, "uz": "Mana shunday ahillik va totuvlik Yangi O‘zbekistonimizni birgalikda barpo etishning eng ishonchli kafolatidir.", "qq": "Mine, usınday tatıwlıq hám awızbirshilik Jańa Ózbekstanımızdı birgelikte qurıwdıń eń isenimli kepili bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 418, "uz": "Biz jamiyatimizda millatlar va dinlararo hamjihatlikni bundan buyon ham mustahkamlash uchun bor kuch va imkoniyatlarimizni safarbar etamiz.", "qq": "Biz jámiyetimizde milletler hám dinleraralıq tatıwlıqtı bunnan bılay da bekkemlew ushın bar kúsh hám imkaniyatlarımızdı jumsaymız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 419, "uz": "Bu borada qo‘shni va qardosh mamlakatlar bilan birga, yagona Markaziy Osiyo ovozi bo‘lib, mintaqamizning tinchlik, birodarlik va hamkorlik makoni sifatidagi nufuzini oshirishga ustuvor ahamiyat qaratamiz.", "qq": "Bul baǵdarda qońsı hám tuwısqan mámleketler menen birge, birden-bir Oraylıq Aziya dawısı bolıp, regionımızdıń tınıshlıq, doslıq hám birge islesiw mákanı sıpatındaǵı abırayın arttırıwǵa tiykarǵı áhmiyet qaratamız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 420, "uz": "Fursatdan foydalanib, davramizda ishtirok etayotgan xorijiy davlatlarning muhtaram elchilarini, xalqaro tashkilotlar vakillarini Xalqaro Navro‘z kuni bilan samimiy qutlab, ularning o‘lkalari va xalqlariga qizg‘in tabriklarimizni yo‘llaymiz.", "qq": "Pursattan paydalanıp, dógeregimizde qatnasıp atırǵan sırt mámleketlerdiń húrmetli elshilerin, xalıqaralıq shólkemlerdiń wákillerin Xalıqaralıq Nawrız kúni menen qızǵın qutlıqlap, olardıń úlkeleri hám xalıqlarına qızǵın qutlıqlawlarımızdı jollaymız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 421, "uz": "Qadrli do‘stlar!", "qq": "Qádirli doslar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 422, "uz": "Mana shu tarovatli lahzalarda barchangizga, butun el-yurtimizga murojaat qilib aytmoqchiman.", "qq": "Mine usı gózzal demlerde bársheńizge, pútkil el-xalqımızǵa múrájat etip aytpaqshıman.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 423, "uz": "Azizlar, qarang, qanday go‘zal yurtimiz, qanday saxovatli zaminimiz, betakror tabiatimiz bor!", "qq": "Ázizler, qarań, qanday gózzal elimiz, qanday saqawatlı jerimiz, biytákirar tábiyatımız bar!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 424, "uz": "Bu bebaho boyliklarni ming yillar osha asrab-avaylab kelayotgan mehnatkash, oq ko‘ngil va olijanob xalqimiz bor.", "qq": "Bul biybaha baylıqlardı mıń jıllar dawamında qásterlep saqlap kiyatırǵan miynetkesh, aq kewil hám ullı mártebeli xalqımız bar.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 425, "uz": "Xudo bizga ato etgan yer-suvimizni, barcha imkoniyatlarimizni qadrlab, ulardan oqilona foydalansak, bir boyligimizga, albatta, o‘n boylik qo‘shiladi.", "qq": "Quday bizge inam etken jer-suwımızdı, barlıq imkaniyatlarımızdı qádirlep, olardan aqılǵa uǵras paydalansaq, bir baylıǵımızǵa, álbette, on baylıq qosıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 426, "uz": "Shu bois azaliy an’analarimizni davom ettirib, ko‘chat ekib, bog‘ yarataylik, uyimiz, mahallamizni obod qilib, hayotimizni yanada go‘zal va farovon etaylik!", "qq": "Sonıń ushın ázeliy dástúrlerimizdi dawam ettirip, nál egip, baǵ jaratayıq, úyimizdi, máhállemizdi abat etip, turmısımızdı jáne de gózzal hám abadan eteyik!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 427, "uz": "Yaxshi qo‘shnichilik, ahillik bilan, ezgu va savob ishlarimiz bilan bag‘rikeng el, o‘z mashaqqatli mehnatimiz bilan baxt va obro‘ topayotgan xalq ekanimizni dunyoga namoyon etaylik!", "qq": "Jaqsı qońsıshılıq, tatıwlıq penen, iygilikli hám sawaplı islerimiz benen keńpeyil el, óz miynetimiz benen baxıt hám abıray tabıp atırǵan xalıq ekenimizdi dúnyaǵa kórseteyik!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 428, "uz": "O‘g‘il-qizlarimiz zamonaviy bilim, til va kasblarni egallab, barkamol avlod bo‘lib safimizga kirsin!", "qq": "Ul-qızlarımız zamanagóy bilim, til hám kásiplerdi iyelep, bárkamal áwlad bolıp qatarımızǵa qosılsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 429, "uz": "Yagona Vatan, yagona xalq bo‘lib, yangi hayot, yangi tarix, yangi kelajak yarataylik!", "qq": "Birden-bir Watan, birden-bir xalıq bolıp, jańa ómir, jańa tariyx, jańa keleshek jaratayıq!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 430, "uz": "Aziz va muhtaram vatandoshlarim!", "qq": "Áziz hám húrmetli watanlaslarım!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 431, "uz": "Siz, qadrdonlarimni, butun xalqimizni Navro‘zi olam bilan yana bir bor chin dildan tabriklayman.", "qq": "Siz, qádirdanlarımdı, pútkil xalqımızdı Nawrız bayramı menen jáne bir márte shın júrekten qutlıqlayman.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 432, "uz": "Yangi O‘zbekiston Navro‘zi – yuksalish va taraqqiyot davri xalqimizga ravnaq va farovonlik ato etsin!", "qq": "Jańa Ózbekstan Nawrızı – rawajlanıw dáwiri xalqımızǵa rawajlanıw hám abadanlıq baǵıshlasın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 433, "uz": "Barcha pok niyatlarimiz amalga oshsin!", "qq": "Barlıq pák niyetlerimiz ámelge assın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 434, "uz": "Yaratgan Parvardigor jonajon Vatanimizni o‘z panohida asrasin!", "qq": "Jaratqan Iyemiz janajan Watanımızdı óz panasında saqlasın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 435, "uz": "Yangi kun, yangi baxt barchamizga muborak bo‘lsin!", "qq": "Jańa kún, jańa baxıt bárshemizge múbárek bolsın!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 436, "uz": "Qoraqalpog‘iston axborot agentligi Qoraqalpog‘iston Respublikasi davlat matbuot organi hisoblanadi.", "qq": "Qаrаqаlpаqstаn хаbаr аgеntligi Qаrаqаlpаqstаn Rеspublikаsınıń mámlеkеtlik bаspаsóz uyımı bоlıp tаbılаdı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 437, "uz": "Agentlik o‘z ish faoliyatini 1954 yil O‘zTAG (O‘zbek axborot agentligi)ning Qoraqalpog‘iston bo‘limi sifatida boshladi.", "qq": "Аgеntlik óz jumısın 1954-jılı ÓzTАG (Ózbеk málimlеmе аgеntligi)tıń Qаrаqаlpаqstаn bólimi sıpаtındа bаslаdı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 438, "uz": "U paytlari bo‘lim asosan mahalliy gazetalarda chop etiladigan va radio orqali uzatiladigan TASS xabarlarini va boshqa rasmiy materiallarini qoraqalpoq tiliga tarjima qilish bilan shug‘ullangan.", "qq": "Bul wаqıtlаrı bólim tiykаrınаn jеrgilikli gаzеtаlаrdа bаsılаtuǵın hám rаdiо аrqаlı bеrilеtuǵın TАSS хаbаrlаrın jánе bаsqа dа rásmiy mаtеriаllаrdı qаrаqаlpаq tilinе аwdаrıw mеnеn shuǵıllаnǵаn.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 439, "uz": "1976 yil O‘zTAGning Qoraqalpog‘iston bo‘limi huzurida xabar tayyorlash tahriririyati tashkillashtirildi.", "qq": "1976-jılı ÓzTАGtıń Qаrаqаlpаqstаn bólimi jаnınаn хаbаr tаyarlаw rеdаkciyası shólkеmlеstirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 440, "uz": "Ayni paytda bo‘lim xodimlari faqat tarjima bilan shug‘ullanmasdan, kunning eng dolzarb mavzusidagi axborot, maqola va reportajlar ham tayyorlay boshladi.", "qq": "Endi bólim хızmеtkеrlеri tеk аwdаrmа mеnеn shuǵıllаnıp qоymаstаn, kúnniń eń áhmiyеtli tеmаsındаǵı хаbаr, mаqаlа hám rеpоrtаjlаr dа tаyarlаy bаslаdı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 441, "uz": "O‘zbekiston Respublikasi Prezidentining 1992 yil 5 fevraldagi Formaniga asosan, O‘zbek axborat agentligi (O‘zTAG) O‘zbekiston Milliy axborot agentligi (O‘zA) bo‘lib qayta tashkillashtirilgandan keyin O‘zTAGning Qoraqalpog‘iston bo‘limi asosida Qoraqalpog‘iston axborot agentligi tashkil etildi.", "qq": "Ózbеkistаn Rеspublikаsı Prеzidеntiniń 1992-jıl 5-fеvrаldаǵı Pármаnınа muwаpıq, Ózbеk málimlеmе аgеntligi (ÓzTАG) Ózbеkistаn Milliy málimlеmе аgеntligi (ÓzА) bоlıp qаytа shólkеmlеstirilgеnnеn kеyin ÓzTАGtıń Qаrаqаlpаqstаn bóliminiń tiykаrındа Qаrаqаlpаqstаn хаbаr аgеntligi dúzildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 442, "uz": "QAA O‘zbekiston Milliy axborot agentligi orqali mamlakatimizning barcha ommaviy axborot vositalariga Prezidentimiz va Hukumat tomonidan qabul qilinayotgan farmon, qaror, farmoyishlarini, shuningdek, muhim siyasiy ahamiyatga molik va boshqa materiallarni qoraqalpoq tilida uzatib boradi.", "qq": "QХА Ózbеkistаn Milliy málimlеmе аgеntligi аrqаlı yelimizdiń bаrlıq ǵаlаbа хаbаr qurаllаrınа Prеzidеntimiz hám Húkimеt tárеpinеn qаbıl etilip аtırǵаn pármаn, qаrаr, biyliklеrdi, sоndаy-аq úlkеn siyasiy áhmiyеtkе iyе rásmiy hám bаsqа dа mаtеriаllаrdı qаrаqаlpаq tilindе jеtkеrip bеrеdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 443, "uz": "Shuningdek, Qoraqalpog‘iston Respublikasi Jo‘qarg‘i Kengesi, Vazirlar Kengashi faoliyatiga oid rasmiy materiallarni tayyorlaydi va respublika miqyosida bo‘lib o‘tadigan ijtimoiy-siyosiy, iqtisodiy, ma’naviy-ma’rifiy tadbirlarini yoritib boradi.", "qq": "Sоndаy-аq Qаrаqаlpаqstаn Rеspublikаsı Jоqаrǵı Kеńеsi, Ministrlеr Kеńеsiniń jumısınа bаylаnıslı rásmiy mаtеriаllаrdı tаyarlаydı hám rеspublikа kólеmindе ótkеrilеtuǵın jámiyеtlik-siyasiy, sоciаllıq-ekоnоmikаlıq, ruwхıy-аǵаrtıwshılıq ilаjlаrın sáwlеlеndirip bаrаdı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 444, "uz": "QAA xabarlari o‘zbek, qoraqalpoq, rus tillarida uzatiladi.", "qq": "QХА хаbаrlаrı ózbеk, qаrаqаlpаq, orıs tillеrindе tаrqаtılаdı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 445, "uz": "Bugun, 18-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida Innovatsion rivojlanish agentligi Qoraqalpog‘iston bo‘limi mutaxassislari E.Abdiganiyev, T.Polatbayev va “Akademik harakatchanlik”, tanlovi g‘olibi Sh.Saburovlar ishtirokida agentlik tomonidan e’lon qilingan “Akademik harakatchanlik”, \"Bo‘lajak olim\" va \"Olima ayollar\" tanlovlari bo‘yicha professor-o‘qituvchilar, doktorantlar va magistrantlar uchun seminar-trening tashkil etildi.", "qq": "Búgin, 18-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde Innovaciyalıq rawajlanıw agentligi Qaraqalpaqstan bólimi qánigeleri E.Abdiganiev, T.Polatbaev hám “Akademiyalıq háreketsheńlik” tańlawi jeńimpazi Sh.Saburovlar qatnasıwında agentlik tárepinen járiyalanǵan “Akademiyalıq háreketsheńlik”, “Bolajaq alım” hám “Ilimpaz hayallar” tańlawları boyınsha professor-oqıtıwshılar, doktorantlar hám magistrantlar ushın seminar-trening shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 446, "uz": "Seminar-treningni universitetning Ilmiy ishlar va innovatsiyalar bo‘yicha prorektori I.Turdimambetov olib bordi.", "qq": "Seminar-treningdi universitet Ilimiy isler hám innovaciyalar boyınsha prorektor I.Turdımambetov basqarıp bardı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 447, "uz": "Seminar-treningda professor-o‘qituvchilar, doktorantlar va magistrantlarning innovatsion fikrlashini rivojlantirish, “Akademik harakatchanlik”, “Bo‘lajak olim” va “Olima ayollar” tanlovlarida ishtirok etish tartiblari, ilmiy va startap loyihalarni shakllantirish masalalari, tanlovlarga loyiha hujjatlarini topshirish bosqichlari bo‘yicha amaliy bilim va ko‘nikmalarini oshirishga qaratilgan ma’lumotlar berildi.", "qq": "Seminar-treningde professor-oqıtıwshılar, doktorantlar hám magistrantlardıń innovaciyalıq pikirlewin rawajlandırıw, “Akademiyalıq háreketsheńlik”, “Bolajaq alım” hám “Ilimpaz hayallar” tańlawlarına qatnasıw tártipleri, ilimiy hám startap joybarların qáliplestiriw máseleleri, tańlawlarǵa joybar hújjetlerin tapsırıw basqıshları boyınsha ámeliy bilim hám kónlikpelerin arttırıwǵa qaratılǵan maǵlıwmatlar berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 448, "uz": "Seminar-trening davomida ishtirokchilar ilmiy va startap loyihalarini yaratish bosqichlaridagi muhim masalalar, o‘z g‘oyalarini taqdim etish, tajribali mentorlar bilan fikr almashish hamda o‘z loyihalarini amalga oshirish bo‘yicha o‘zlarini qiziqtirgan savollarga tegishli javoblarni oldilar.", "qq": "Seminar-trening dawamında qatnasıwshılar ilimiy hám startap joybarların jaratıw basqıshlarındaǵı áhmiyetli máseleler, óz ideyaların usınıw, tájiriybeli mentorlar menen pikir almasıw hám óz joybarların ámelge asırıw boyınsha sorawlarına tiyisli juwapların aldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 449, "uz": "Berdaq nomidagi Qoraqalpoq davlat universiteti San’at fakultetida 1-kurs talabalari ishtirokida \"Zamonaviy ayolning ko‘p qirraliligi va ko‘p vazifalari\" mavzusida seminar-trening tashkil etildi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Kórkem óner fakultetinde 1-kurs studentleri qatnasıwında \"Zamanagóy hayaldıń kóp qırlılıǵı hám kóp wazıypaları\" atamasında seminar-trening shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 450, "uz": "Tadbirning asosiy maqsadi - bugungi zamonaviy ayolning jamiyatdagi o‘rni, roli va qadr-qimmatini chuqurroq anglashga ko‘maklashishdan iborat bo‘ldi.", "qq": "Ilajdıń tiykarǵı maqseti - búgingi zamanagóy hayaldıń jámiyettegi ornı, roli hám qádir-qımbatın tereńirek ańlawǵa járdemlesiwden ibarat boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 451, "uz": "Seminar-trening pedagogika va psixologiya kafedrasi mudiri, dotsent A.Matchanov tashabbusi bilan o‘tkazildi.", "qq": "Seminar-trening pedagogika hám psixologiya kafedrası baslıǵı, docent A.Matchanov baslaması menen ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 452, "uz": "Unda kafedra professor-o‘qituvchilari N.Pirniyazova va G.Orazbayeva zamonaviy innovatsion yondashuvlar va maxsus amaliy mashg‘ulotlar orqali talabalarga muhim tushunchalarni yetkazdi.", "qq": "Onda kafedra professor-oqıtıwshıları N.Pirniyazova hám G.Orazbaeva zamanagóy innovaciyalıq qatnaslar hám arnawlı ámeliy shınıǵıwlar arqalı studentlerge áhmiyetli túsiniklerdi jetkerdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 453, "uz": "Mashg‘ulotlar davomida zamonaviy ayolning ko‘p qirrali shaxs sifatida turli rollarni muvaffaqiyatli uyg‘unlashtira olishi ta’kidlandi.", "qq": "Shınıǵıwlar dawamında zamanagóy hayal-qızdıń kóp qırlı shaxs sıpatında túrli rollerdi tabıslı úylestire alatuǵını atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 454, "uz": "Ya’ni, u nafaqat mehribon ona va sadoqatli umr yo‘ldoshi, balki o‘z ustida ishlaydigan professional, tashabbuskor tadbirkor, faol jamoat arbobi, sportchi va ijodkor inson sifatida namoyon bo‘lishi mumkinligi tushuntirildi.", "qq": "Yaǵnıy, ol tek ǵana mehriban ana hám sadıq ómirlik joldas emes, al óz ústinde isleytuǵın professional, intalı isbilermen, belsendi jámiyetlik ǵayratker, sportshı hám dóretiwshi insan sıpatında kóriniwi múmkin ekenligi túsindirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 455, "uz": "Mazkur seminar-trening talabalarda zamonaviy xotin-qizlarning ko‘p qirraliligini shakllantirish, ularning shaxsiy va kasbiy rivojlanishi uchun zarur bo‘lgan ko‘nikma va malakalarni rivojlantirish muhimligini yana bir bor ko‘rsatdi.", "qq": "Bul seminar-trening studentlerde zamanagóy hayal-qızlardıń kóp qırlılıǵın qáliplestiriw, olardıń jeke hám kásiplik rawajlanıwı ushın zárúr bolǵan kónlikpe hám uqıplılıqlardı rawajlandırıw áhmiyetli ekenligin jáne bir márte kórsetti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 456, "uz": "Talaba-yoshlar o‘rtasida diniy ekstremizmning oldini olish, millatlararo totuvlik va diniy bag‘rikenglikni targ‘ib qilish, shuningdek, qoraqalpoq milliy sport turlarini targ‘ib qilish maqsadida \"Qo‘l kurashi,\" \"Arqon tortish,\" \"Tosh ko‘tarish,\" \"Langi\" turlari bo‘yicha Jismoniy madaniyat fakulteti birinchiligi o‘tkazildi.", "qq": "Student-jaslar arasında diniy ekstremizmniń aldın alıw, milletlerara tatıwlıq hám diniy bawrıkeńlikti úgit-násiyatlaw, sonday-aq, qaraqalpaq milliy sport túrlerin úgit-násiyatlaw maqsetinde «Qol gúresi», «Arqan  tartıs», «Tas kóteriw», «Láńgi» túrleri boyınsha Dene mádeniyatı fakulteti birinshiligi ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 457, "uz": "Musobaqada fakultetdan jami 200 dan ortiq talaba-yoshlar (o‘g‘il bolalar va qizlar) ishtirok etdi. Musobaqa qizg‘in bahslarga boy bo‘lib, yoshlarning \"Qo‘l kurashi,\" \"Arqon tortish,\" \"Tosh ko‘tarish,\" \"Langi\" milliy sport turlariga bo‘lgan qiziqishi, ularning sport mahoratlari sinovdan o‘tkazildi.", "qq": "Jarısqa fakultetten jámi 200 den aslam student-jaslar (er balalar hám qızlar) qatnastı. Jarıs qızǵın bellesiwlerge bay bolıp, jaslardıń «Qol gúresi», «Arqan  tartıs», «Tas kóteriw», «Láńgi» milliy sport túrlerine bolǵan qızıǵıwshılıǵı, olardıń sport sheberlikleri sınaldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 458, "uz": "Musobaqaga tajribali sportchilar, jismoniy tarbiya nazariyasi va metodikasi kafedrasi professor-o‘qituvchilari hakamlik qildi.", "qq": "Jarısqa tájiriybeli sportshılar, dene mádeniyatı teoriyası hám metodikası kafedrası professor-oqıtıwshıları tóreshilik etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 459, "uz": "Musobaqa shartlari bo‘yicha hakamlar tomonidan adolatli baholanib, o‘g‘il bolalar o‘rtasidagi g‘oliblar va qizlar o‘rtasidagi g‘oliblar aniqlanib, birinchilikni qo‘lga kiritishga muvaffaq bo‘ldi.", "qq": "Jarıs shártleri boyınsha tóreshiler tárepinen ádil bahalanıp, er balalar arasındaǵı jeńimpazlar hám qızlar arasındaǵı jeńimpazlar anıqlanıp, birinshilikti jeńip alıwǵa miyasar boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 460, "uz": "Berdaq nomidagi Qoraqalpoq davlat universitetida mehnat jamoasi va kasaba uyushmasi qo‘mitasi kafolatlarni mustahkamlashga qaratilgan bir qator muhim bandlar o‘z ifodasini topgan.", "qq": "Sonday-aq, onda xızmetkerlerdiń sociallıq-ekonomikalıq máplerin qorǵaw, miynet sharayatların jaqsılaw, bántlikti támiyinlew hám sociallıq kepilliklerdi bekkemlewge qaratılǵan bir qatar áhmiyetli bántler óz kórinisin tapqan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 465, "uz": "Jamoa shartnomasi xodimlar tomonidan o‘z vakillari orqali hamda ish beruvchi tomonidan o‘zaro kelishuv asosida tuziladigan huquqiy hujjat sifatida tashkilotda ijtimoiy hamkorlikni rivojlantirishda muhim o‘rin tutadi.", "qq": "Jámáát shártnaması xızmetkerler tárepinen óz wákilleri arqalı hám de jumıs beriwshi tárepinen óz-ara kelisim tiykarında dúziletuǵın huqıqıy hújjet sıpatında shólkemde sociallıq birge islesiwdi rawajlandırıwda áhmiyetli orın iyeleydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 466, "uz": "Muhokama jarayonida ishtirokchilar tomonidan hujjatning bandlarini yanada takomillashtirish, xodimlar manfaatlarini to‘liq qamrab olish bo‘yicha fikr-mulohazalar bildirildi.", "qq": "Dodalaw procesinde qatnasıwshılar tárepinen hújjettiń bántlerin bunnan bılay da jetilistiriw, xızmetkerlerdiń máplerin tolıq qamtıp alıw boyınsha pikir-usınıslar bildirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 467, "uz": "Berdaq nomidagi Qoraqalpoq davlat universitetida xalqaro hamkorlikni kengaytirish, yuridik ta’lim sifatini oshirish va talabalarning amaliy ko‘nikmalarini mustahkamlashga qaratilgan muhim uchrashuv bo‘lib o‘tdi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde xalıqaralıq birge islesiwdi keńeytiw, yuridikalıq bilimlendiriwdiń sapasın arttırıw hám studentlerdiń ámeliy kónlikpelerin bekkemlewge qaratılǵan áhmi
