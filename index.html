alı, hár qıylı formalar, sızılmalar, háripli belgiler, xalıq jasaytuǵın orınlar, GESler, paydalı qazılma kánlerdiń belgileri masshtabsız boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 175, "uz": "Chiziqli shartli belgilar bilan daryolar, yo‘llar, chegaralar ko‘rsatiladi. ", "qq": "Sızıqlı shártli belgiler menen dáryalar, jollar, shegaralar kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 176, "uz": "Tushuntirish belgilari bilan daryo oqimining yo‘nalishi, o‘rmondagi daraxtlarning turlari ko‘rsatiladi.", "qq": "Túsindiriw belgileri menen dárya aǵısınıń baǵdarı, toǵaydaǵı aǵashlardıń túrleri kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 177, "uz": "Bulardan tashqari yozuvli, harfli, sonli shartli belgilar ham mavjud bo‘ladi.", "qq": "Bulardan basqa jazıwlı, háripli, sanlı shártli belgiler de boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 178, "uz": "Xaritalar masshtabiga, ularda tasvirlangan hududning katta-kichikligiga, mazmuni, vazifasi va tuzilishiga ko‘ra bir qancha turlarga bo‘linadi.", "qq": "Kartalar masshtabına, olarda súwretlengen maydanlardıń kólemine, mazmunı, wazıypası hám dúzilisine qarap birqansha túrlerge bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 179, "uz": "Xaritalar masshtabiga qarab quyidagi turlarga bo‘linadi: yirik masshtabli — 1:10000 dan 1:200000 gacha, o‘rta masshtabli —1:200000 dan 1:1000000 gacha, mayda masshtabli — 1:1000000 dan kichik.", "qq": "Kartalar masshtabına qarap tómendegi túrlerge bólinedi: iri masshtablı — 1:10000 nan 1:200000 ǵa shekem, orta masshtablı — 1:200000 nan 1:000000 ǵa shekem, mayda masshtablı — 1:1000000 nan kishi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 180, "uz": "Turli masshtabli xaritalarda voqea va hodisalar turli xil aniqlikda tasvirlanadi.", "qq": "Hár qıylı masshtablı kartalarda waqıya hám qubılıslar hár túrli anıqlıqta súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 181, "uz": "Xaritalar ularda nima tasvirlanganligi va hududning kattakichikligiga qarab quyidagi turlarga bo‘linadi: yulduzlar xaritasi, sayyoralar va Yer xaritasi, yarimsharlar xaritasi, materiklar va okeanlar xaritalari, tabiiy geografik o‘lkalar va dengizlar xaritasi, mamlakatlar xaritasi, ma’muriy birliklar xaritasi, maxsus hudud (qo‘riqxona, sayohatbop joy)lar xaritasi, shahar, viloyat va tumanlar xaritasi.", "qq": "Kartalar olarda ne súwretlengenligi hám aymaqtıń kólemine qarap tómendegi túrlerge bólinedi: juldızlar kartası, planetalar hám Jer kartası, yarım sharlar kartaları, materikler hám okeanlar kartaları, tábiyiy geografiyalıq úlkeler hám teńizler kartaları, mámleketler kartaları, administrativlik birlikler kartaları, arnawlı aymaqlar (qorıqxanalar, sayaxatlıq orınlar) kartaları, qala hám wálayatlar, rayonlar kartaları.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 182, "uz": "Mazmuniga ko‘ra xaritalar ikkita yirik guruhga bo‘linadi: umumiy geografik xaritalar va mavzuli xaritalar.", "qq": "Mazmunı boyınsha kartalar eki iri toparǵa bólinedi: ulıwma geografiyalıq kartalar hám tematikalıq kartalar.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 183, "uz": "Umumiy geografik xaritalarda joy geografik sharoitining asosiy tarkibiy qismlari bir xil aniqlikda tasvirlanadi: relyef, daryo, ko‘l, muzliklar, tuproq va o‘simlik qoplami, aholi yashaydigan joylar, xo‘jalik tarmoqlarining tarkibi, aloqa yo‘llari, chegaralar va h. k.", "qq": "Ulıwma geografiyalıq kartalarda orınnıń geografiyalıq sharayatınıń tiykarǵı quramlıq bólimleri birdey anıqlıqta súwretlenedi: relyef, dárya, kól, muzlıqlar, topıraq, ósimlikler qatlamı, xalıq jasaytuǵın orınlar, xojalıq tarmaqlarınıń quramı, baylanıs jolları, shegaralar h.t.b.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 184, "uz": "Mavzuli xaritalar, o‘z navbatida, yana ikki guruhga — tabiiy va iqtisodiy xaritalarga bo‘linadi.", "qq": "Tematikalıq kartalar óz náwbetinde jáne eki toparǵa—tábiyiy hám ekonomikalıq kartalarǵa bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 185, "uz": "Tabiiy geografik xaritalarga Yer yuzasi va okean tagi relyefi, iqlim, tuproq, o‘simlik, hayvonlar, landshaft, tabiatni qo‘riqlash, foydali qazilma konlari xaritasi kiradi.", "qq": "Tábiyiy geografiyalıq kartalarǵa Jer beti hám okean astı relyefi, klimatı, topıraq, ósimlik, haywanat, landshaft, tábiyattı qorǵaw, paydalı qazılma kánleri kartaları kiredi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 186, "uz": "Ijtimoiy-iqtisodiy xaritalar iqtisodiy, tarixiy, madaniy-siyosiy, siyosiy-ma’muriy xaritalardan iborat.", "qq": "Sociallıq-ekonomikalıq kartalar ekonomikalıq, tariyxıy, mádeniy-siyasiy, siyasiy-administrativlik kartalardan ibarat boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 187, "uz": "Vazifasiga ko‘ra xaritalar yana ilmiy, madaniyat va targ‘ibot, texnik, sayohat hamda o‘quv xaritalariga bo‘linadi.", "qq": "Wazıypalarına qaray kartalar jáne de ilimiy, mádeniyat hám úgit-násiyat, texnikalıq, sayaxat kartaları, oqıw kartalarına bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 188, "uz": "Atlas — to‘la va aniq ma’lumotga ega bo‘lgan, yagona dastur asosida tuzilgan, tartibga solingan xaritalar to‘plamidir.", "qq": "Atlas tolıq, anıq maǵlıwmatqa iye bolǵan, birden-bir baǵdarlama tiykarında dúzilgen, tártipke salınǵan kartalar toplamı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 189, "uz": "«Atlas» atamasi fanga flamand xaritashunosi Merkator tomonidan kiritilgan.", "qq": "«Atlas» ataması ilimge flamand karta tanıwshı Merkator tárepinen kirgizilgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 190, "uz": "U o‘zi tuzgan xaritalar to‘plamini (1595- yil) Livanning afsonaviy qiroli Atlas nomi bilan ataydi.", "qq": "Ol ózi dúzgen kartalar toplamın (1595-jıl) Livannıń ápsanaǵa aylanǵan korolı Atlas atı menen ataǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 191, "uz": "Birinchi xaritalar to‘plami II asrda Klavdiy Ptolemey tomonidan tuzilgan.", "qq": "Birinshi kartalar toplamı II ásirde Klavdiy Ptolemey tárepinen dúzilgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 192, "uz": "Hozirgi zamon atlaslarining asosiy xususiyatlari undagi xaritalarning bir butunligi, bir-biriga muvofiqligi va bir-birini to‘ldirishidir.", "qq": "Házirgi zaman atlaslarınıń tiykarǵı ózgeshelikleri ondaǵı kartalardıń bir pútinligi, bir-birine sáykesligi hám bir-birin tolıqtırıwı bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 193, "uz": "Atlaslar ham xaritalarga o‘xshab juda xilma-xil bo‘ladi.", "qq": "Atlaslar da kartalarǵa usap júdá hár qıylı boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 194, "uz": "Ular qamrab olgan maydoniga ko‘ra sayyoralar, dunyo, materiklar, tabiiy geografik o‘lkalar, davlatlar, viloyatlar atlaslariga; mazmuniga ko‘ra umumiy geografik va mavzuli atlaslarga bo‘linadi.", "qq": "Olar ózine qamtıǵan maydanına qarap planetalar, dúnya, materikler, tábiyiy-geografiyalıq úlkeler, mámleketler, wálayatlar atlaslarına, mazmunına qaray ulıwma geografiyalıq hám tematikalıq atlaslarǵa bo'linedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 195, "uz": "Vazifasiga ko‘ra ilmiy, ommabop (o‘lkashunoslik), o‘quv atlaslari, sayohat va yo‘l atlaslariga bo‘linadi.", "qq": "Wazıypasına qaray ilimiy, massalıq (úlketanıw), oqıw atlasları, sayaxatlar hám jollar atlaslarına bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 196, "uz": "Ilmiy atlaslar ma’lum bir joy haqida to‘la, ilmiy asoslangan ma’lumot beruvchi atlaslardir.", "qq": "Ilimiy atlaslar belgili bir orın haqqında tolıq, ilimiy jaqtan tiykarlanǵan maǵlıwmat beriwshi atlaslar bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 197, "uz": "Bunday atlaslarda shu joyning tabiiy sharoiti, xo‘jaligi, aholisi va madaniyati ko‘rsatiladi.", "qq": "Bularda sol orınnıń tábiyiy sharayatı, xojalıǵı, xalqı hám mádeniyatı kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 198, "uz": "Ommabop (o‘lkashunoslik) atlaslar keng o‘quvchilar ommasiga mo‘ljallangan bo‘lib, ular foydalanishga qulay va oson qilib tuziladi.", "qq": "Massalıq (úlketanıw) atlaslar keń oqıwshılar massasına arnalıp paydalanıwǵa qolaylı, ańsat dúziledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 199, "uz": "Ularda rasmlar, chizmalar, ma’lum bir hudud to‘g‘risidagi ma’lumotlar, tarixiy yodgorliklar ko‘rsatiladi.", "qq": "Olarda súwretler, sızılmalar, belgili bir aymaq haqqındaǵı maǵlıwmatlar, tariyxıy estelikler kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 200, "uz": "O‘quv atlaslari maktablar va oliy o‘quv yurtlarida foydalanish uchun mo‘ljallanadi.", "qq": "Oqıw atlasları mektepler hám joqarı oqıw orınlarında paydalanıw ushın arnaladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 201, "uz": "Hozirgi paytda xarita va atlaslar xalq xo‘jaligining turli sohalarida, tadqiqot ishlarida keng qo‘llaniladi.", "qq": "Házirgi waqıtta karta hám atlaslar xalıq xojalıǵınıń túrli tarawlarında, izertlew jumıslarında keń qollanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 202, "uz": "Ulardan joyning aniq o‘rnini belgilashda, ilmiy tekshirish ishlarida, xalq xo‘- jaligi (dasturlar tuzish, loyihalashtirish, qurilish, yerlarni o‘zlashtirish, foydali qazilma konlarini qidirish, ob-havoni bashorat qilish va h. k.)da, harbiy va o‘quv ishlarida foydalaniladi.", "qq": "Olardan jerdiń anıq ornın belgilewde, ilimiy tekseriw jumısları, xalıq xojalıǵında (baǵdarlamalar dúziw, joybarlaw, qurılıs, jerlerdi ózlestiriw, paydalı qazılma kánlerin izlew, hawa rayın boljaw hám t.b.), áskeriy hám oqıw islerinde paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 203, "uz": "Xarita yordamida masofa, maydon va burchaklar ham o‘lchanadi.", "qq": "Karta járdeminde aralıq, maydan hám múyeshler de ólshenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 204, "uz": "Xaritada masofa masshtab yordamida quyidagi tartibda aniqlanadi.", "qq": "Kar tada aralıq masshtab járdeminde tómendegi tár tipte anıqlanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 205, "uz": "Xarita masshtabidan xaritadagi 1 sm masofa joyda necha km ga teng ekani topiladi.", "qq": "Karta masshtabınan kartadaǵı 1 sm aralıq ornında neshe km ge teń ekeni tabıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 206, "uz": "Berilgan ikki nuqta orasi xaritada necha sm ekani aniqlanadi.", "qq": "Berilgen eki noqat arası kartada neshe sm ekeni anıqlanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 207, "uz": "Bu ikki son (km va sm) ko‘paytirilsa, berilgan nuqtalar oralig‘i necha km ga teng ekani, ya’ni haqiqiy masofa chiqadi.", "qq": "Bul eki san (km hám sm) kóbeytilse, berilgen noqatlar aralıǵı neshe km ge teń ekeni, yaǵnıy haqıyqıy aralıq shıǵadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 208, "uz": "Masalan, xaritaning masshtabi 1:1000 000, ya’ni 1 sm 10 km ga teng.", "qq": "Mısalı, kartanıń masshtabı 1:1000000, yaǵnıy 1 sm 10 km ge teń.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 209, "uz": "Xaritada ikki nuqta oralig‘i 4,5 sm ga teng.", "qq": "Kartada eki noqat aralıǵı 4,5 sm ge teń.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 210, "uz": "Binobarin, 4,5 × 10 = 45 km yoki 45 000 m.", "qq": "Demek 4,5x10=45 km yaki 45000 m.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 211, "uz": "Uning markazida nuqta tasvirlangan.", "qq": "Onıń ortasında noqta súwretlengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 212, "uz": "Nuqta geodeziya tayanchining haqiqiy o‘rnini bildiradi.", "qq": "Noqta geodeziya tayanchınıń haqıyqıy ornın bildirédi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 213, "uz": "Geografik koordinata Yer yuzasidagi haqiqiy o‘rnini ko‘rsatadi.", "qq": "Geografiyalıq koordinata jer betindegi haqıyqıy ornın kórsetedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 214, "uz": "Aholi manzilgohlari egallagan maydoni bilan ko‘rsatiladi.", "qq": "Ahalı mekemeleri iyelegen maydanı menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 215, "uz": "Shaharlar nomi yirik harflar bilan yoziladi.", "qq": "Qalalar atı iri haripler menen jazıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 216, "uz": "Qishloqlar nomi kichik harflar bilan yoziladi.", "qq": "Awıllar atı kishirek haripler menen jazıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 217, "uz": "Daryolar ko‘k rangda tasvirlanadi.", "qq": "Dáryalar kók ráng menen súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 218, "uz": "Ko‘llar va suv omborlari havorangda tasvirlanadi.", "qq": "Kóller hám suw ombarları háwa ráng menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 219, "uz": "Daryo oqimining yo‘nalishi va tezligi ko‘rsatiladi.", "qq": "Dárya aǵısınıń baǵıtı hám tezligi kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 220, "uz": "Ko‘priklar va paromlar maxsus belgilar bilan ko‘rsatiladi.", "qq": "Kópirler hám paromlar arnawlı belgiler menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 221, "uz": "Yo‘llar turli qalinlikdagi chiziqlar bilan beriladi.", "qq": "Jollar túrli qalıńlıqtakı sızıqlar menen beriledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 222, "uz": "Temiryo‘l, avtomobil yo‘llari alohida belgilanadi.", "qq": "Temir jol, avtomobil jolları ayrı belgilenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 223, "uz": "O‘simlik qoplami yashil ranglarda beriladi.", "qq": "Ósimlik qaplamı jasıl ránglarda beriledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 224, "uz": "Bog‘lar va botqoqlar alohida belgilar bilan tasvirlanadi.", "qq": "Baǵlar hám batpaqlıqlar arnawlı belgiler menen súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 225, "uz": "Relyef gorizontallar bilan ko‘rsatiladi.", "qq": "Relyef gorizontallar menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 226, "uz": "Gorizontallar ko‘p bo‘lsa balandlik yuqori bo‘ladi.", "qq": "Gorizontallar kóp bolsa biyiklik joqarı boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 227, "uz": "Gorizontallar yaqin bo‘lsa yonbag‘ir tik bo‘ladi.", "qq": "Gorizontallar jaqın bolsa janbawır tik boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 228, "uz": "Gorizontallar orqali balandlik farqi aniqlanadi.", "qq": "Gorizontallar arqalı biyiklik parqı anıqlanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 229, "uz": "Ularning shartli belgisi — to‘g‘ri uchburchakdan iborat.", "qq": "Olardıń shártli belgisi — tuwrı úshmúyeshlikten ibarat.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 230, "uz": "Uning markazida nuqta tasvirlangan.", "qq": "Onıń ortasında noqta súwretlengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 231, "uz": "Nuqta geodeziya tayanchining haqiqiy o‘rniga to‘g‘ri keladi.", "qq": "Noqta geodeziya tayanchınıń haqıyqıy ornına tuwrı keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 232, "uz": "Uning geografik koordinatasi Yer yuzasidagi haqiqiy o‘rnini bildiradi.", "qq": "Onıń geografiyalıq koordinatası jer betindegi haqıyqıy ornın bildirédi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 233, "uz": "Shartli belgi yoniga yozilgan sonlar uning mutlaq balandligini bildiradi.", "qq": "Shártli belgi qaptalına jazılǵan sanlar onıń absolyut biyikligin bildirédi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 234, "uz": "Aholi manzilgohlari ular egallagan maydon qiyofasi bilan ko‘rsatiladi.", "qq": "Ahalı mekemeleri iyelegen maydan kórinisi menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 235, "uz": "Aholi manzilgohlarining nomlari turli kattalikdagi harflar bilan beriladi.", "qq": "Ahalı mekemeleriniń atları túrli úlkenliktegi háripler menen beriledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 236, "uz": "Shaharlar nomi yirik harflar bilan yoziladi.", "qq": "Qalalar atı iri háripler menen jazıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 237, "uz": "Qishloqlar nomi kichikroq harflar bilan yoziladi.", "qq": "Awıllar atı kishirek háripler menen jazıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 238, "uz": "Aholi manzilgohlari nomi ostidagi raqamlar ulardagi xonadonlar sonini ifodalaydi.", "qq": "Ahalı mekemeleri atı astındaǵı sanlar olardaǵı xojalıqlar sanın bildirédi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 239, "uz": "Masshtabsiz shartli belgilar bilan sanoat va madaniy binolar, korxonalar, ayrim zavodlar, elektrostansiya va konlar ko‘rsatiladi.", "qq": "Masshtabsız shártli belgiler menen sanaat hám mádeniy imaratlar, kárxanalar, ayrım zavodlar, elektrostansiya hám kánler kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 240, "uz": "Daryolar, soylar hamda ularning irmoqlari ko‘k rangda tasvirlanadi.", "qq": "Dáryalar, saylar hám olardıń tarmaqları kók ráńde súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 241, "uz": "Ko‘llar, suv omborlari va hovuzlar havorang bilan tasvirlanadi.", "qq": "Kóller, suw ombarları hám háwizler háwa ráń menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 242, "uz": "Daryo oqimining yo‘nalishi, tezligi, kengligi, chuqurligi va kechuv joylari ko‘rsatiladi.", "qq": "Dárya aǵısınıń baǵıtı, tezligi, keńligi, tereńligi hám ótúw jayları kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 243, "uz": "Paromlar, ko‘priklar va kema to‘xtash joylari maxsus belgilar bilan ko‘rsatiladi.", "qq": "Paromlar, kópirler hám keme toqtaytuǵın jaylar arnawlı belgiler menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 244, "uz": "Yo‘llar turli xil qalinlikdagi va rangdagi chiziqlar bilan tasvirlanadi.", "qq": "Jollar túrli qalıńlıqtakı hám ráńdegi sızıqlar menen súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 245, "uz": "Temiryo‘llar, avtomobil yo‘llari va toshyo‘llar alohida ko‘rsatiladi.", "qq": "Temir jollar, avtomobil jolları hám tas jollar ayrı kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 246, "uz": "Shartli belgining shakli va rangi yo‘lning turini tasvirlaydi.", "qq": "Shártli belginiń forması hám ráńi jol túrin kórsetedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 247, "uz": "Maxsus belgilar bilan yo‘lning kengligi, temiryo‘lning raqami va yo‘l qoplami ko‘rsatiladi.", "qq": "Arnawlı belgiler menen joldıń keńligi, temir joldıń nomeri hám jol qaplamı kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 248, "uz": "O‘simlik qoplami turli xil zangori-yashil ranglar bilan beriladi.", "qq": "Ósimlik qaplamı túrli kók-jasıl ráńler menen beriledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 249, "uz": "O‘tloqlar, bog‘lar, botqoqlar va hokazolar alohida belgilar bilan tasvirlanadi.", "qq": "Otlaqlar, baǵlar, batpaqlıqlar hám basqalar arnawlı belgiler menen súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 250, "uz": "Relyef topografik xaritalarda gorizontallar bilan ko‘rsatiladi.", "qq": "Relyef topografiyalıq kartalarda gorizontallar menen kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 251, "uz": "Yonbag‘ir qancha ko‘p gorizontallar bilan tasvirlansa, u shuncha baland bo‘ladi.", "qq": "Janbawır qanshelli kóp gorizontallar menen súwretlense, sonshelli biyik boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 252, "uz": "Gorizontallar bir-biriga qancha yaqin bo‘lsa, yonbag‘ir shuncha tik bo‘ladi.", "qq": "Gorizontallar bir-birine qansha jaqın bolsa, janbawır sonsha tik boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 253, "uz": "Gorizontallarga qarab nuqtalarning baland yoki pastligini aniqlash mumkin.", "qq": "Gorizontallarga qarap noqalardıń biyik yaki pás ekenin anıqlawǵa boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 254, "uz": "Qo‘shni gorizontallar orasidagi masofaga qarab yonbag‘irning tikligini bilish mumkin.", "qq": "Qońsı gorizontallar arasındagı aralıqqa qarap janbawırdıń tikligin biliwge boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 255, "uz": "Odatda, geografik xaritalarning masshtabi juda kichik bo‘ladi.", "qq": "Ádette geografiyalıq kartalardıń masshtabı óte kishi boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 256, "uz": "Yer yuzasi million marta va undan ko‘proq marta kichraytirib ko‘rsatiladi.", "qq": "Jer beti million eseden hám onnan da kóbirék márte kishireytilip kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 257, "uz": "Yer yuzasining kichik qismini tasvirlovchi yirik masshtabli xaritalar topografik xaritalar deb ataladi.", "qq": "Jer betiniń kishkene bólimin súwretlewshi iri masshtablı kartalar topografiyalıq kartalar dep ataladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 258, "uz": "Mazmuniga ko‘ra, ular umumiy geografik xaritalar hisoblanadi.", "qq": "Mazmunına qaray, olar ulıwma geografiyalıq kartalar bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 259, "uz": "Yirik masshtabli topografik xaritalar joyda bajariladigan topografik o‘lchov ishlari hamda aerosuratlar asosida tuziladi.", "qq": "Iri masshtablı topografiyalıq kartalar jerde orınlanatuǵın topografiyalıq ólshew isleri hám aerosúwretler tiykarında dúziledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 260, "uz": "Yirik masshtabli topografik xaritalarda katta maydonlar tasvirlanadigan bo‘lsa, xarita juda kattalashib ketadi.", "qq": "Iri masshtablı topografiyalıq kartalarda úlken maydanlar súwretlenetuǵın bolsa, karta júdá úlkeyip ketedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 261, "uz": "Shuning uchun bunday xaritalar ayrim-ayrim varaqlarga bo‘linadi va ular ko‘p varaqli bo‘ladi.", "qq": "Sonıń ushın bunday kartalar ayrım-ayrım betlerge bólinedi hám olar kóp betli boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 262, "uz": "Yirik masshtabli topografik xaritalarning har bir varag‘ida Yer yuzasining kichik qismi tasvirlanadi.", "qq": "Iri masshtablı topografiyalıq kartalardıń hár bir betinde jer betiniń kishkene bólimi súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 263, "uz": "Shuning uchun bunday xaritalarda mayda masshtabli xaritalarga nisbatan xatoliklar juda kam bo‘ladi.", "qq": "Sonıń ushın bunday kartalarda mayda masshtablı kartalarǵa qaraǵanda qatelikler júdá az boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 264, "uz": "Chunki kichik maydon yuzasi tekislikka yaqin bo‘ladi.", "qq": "Sebebi kishkene maydan beti tegislikke jaqın boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 265, "uz": "Xaritaning masshtabi uning barcha qismida bir xil bo‘ladi.", "qq": "Kartanıń masshtabı onıń barlıq bólimlerinde birdey boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 266, "uz": "Topografik xaritaning har bir varag‘i yon tomonlarda meridian, yuqori va past tomonlarda parallellar bilan chegaralanadi.", "qq": "Topografiyalıq kartanıń hár bir beti qaptal jaqlarında meridian, joqarı hám tómen jaqlarında paralleller menen shegaralanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 267, "uz": "Masshtabi 1:1000 000 bo‘lgan xaritaning har bir varag‘i har 6° dan o‘tkazilgan meridianlar va har 4° dan o‘tkazilgan parallellar bilan chegaralangan.", "qq": "Masshtabı 1:1 000 000 bolǵan kartanıń hár bir beti hár 6° meridian hám hár 4° paralleller menen shegaralanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 268, "uz": "Natijada Yer yuzasida uzunligi 6° va kengligi 4° ga teng bo‘lgan trapetsiyalar hosil bo‘ladi.", "qq": "Nátiyjede jer betinde uzunlıǵı 6° hám keńligi 4° bolǵan trapeziyalar payda boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 269, "uz": "Yirik masshtabli xaritalar uchun o‘lchami kichikroq bo‘lgan trapetsiyalardan foydalaniladi.", "qq": "Iri masshtablı kartalar ushın ólshemi kishirek bolǵan trapeziyalardan paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 270, "uz": "Masalan, masshtabi 1:100 000 bo‘lgan xarita trapetsiyasining o‘lchami uzunlik bo‘yicha 30′ va kenglik bo‘yicha 20′ ga teng bo‘ladi.", "qq": "Mısalı, masshtabı 1:100 000 bolǵan karta trapeziyasınıń ólshemi uzunlıq boyınsha 30′ hám keńlik boyınsha 20′ ga teń boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 271, "uz": "Masshtabi 1:25 000 li xarita trapetsiyasining o‘lchami uzunlik bo‘yicha 7′30′′, kenglik bo‘yicha 5′ ga teng bo‘ladi.", "qq": "Masshtabı 1:25 000 bolǵan karta trapeziyasınıń ólshemi uzunlıq boyınsha 7′30′′, keńlik boyınsha 5′ ga teń boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 272, "uz": "Topografik xaritalarning har bir varag‘i kilometrli kataklarga ham bo‘lingan bo‘ladi.", "qq": "Topografiyalıq kartalardıń hár bir beti kilometrli torlarǵa da bólingen boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 273, "uz": "Har bir katakning tomonlari 1000 m (1 km) ga teng qilib olinadi.", "qq": "Hár bir tor jaqları 1000 m (1 km) bolıp alınadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 274, "uz": "Xaritalar masshtabiga qarab kataklar har xil kattalikda bo‘ladi.", "qq": "Kartalardıń masshtabına qarap torlar hár qıylı úlkenlikte boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 275, "uz": "Agar xarita masshtabi 1:100 000 bo‘lsa, katak tomonlari 1 sm bo‘ladi.", "qq": "Eger karta masshtabı 1:100 000 bolsa, tor jaqları 1 sm boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 276, "uz": "Agar masshtab 1:50 000 bo‘lsa, katak tomonlari 2 sm bo‘ladi.", "qq": "Eger masshtab 1:50 000 bolsa, tor jaqları 2 sm boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 277, "uz": "Agar masshtab 1:25 000 bo‘lsa, katak tomonlari 4 sm bo‘ladi.", "qq": "Eger masshtab 1:25 000 bolsa, tor jaqları 4 sm boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 278, "uz": "Agar masshtab 1:10 000 bo‘lsa, katak tomonlari 10 sm ga teng bo‘ladi.", "qq": "Eger masshtab 1:10 000 bolsa, tor jaqları 10 sm ge teń boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 279, "uz": "Xaritaning pastki ramkasidan yuqori tomonga yo‘nalish x bilan belgilanadi.", "qq": "Kartanıń tómen rámkasınan joqarı jaqqa baǵıt x menen belgilenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 280, "uz": "O‘ng tomonga gorizontal yo‘nalish bilan belgilanadi.", "qq": "Oń jaqqa gorizontal baǵıt menen belgilenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 281, "uz": "Ularning necha kilometrga teng ekanligi yozib qo‘yiladi.", "qq": "Olardıń neshe kilometrge teń ekenligi jazıp qoyıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 282, "uz": "Shu raqamlarga qarab xaritadagi har bir nuqtaning vertikali va gorizontali nechanchi kilometrlarda ekanligini aniqlasa bo‘ladi.", "qq": "Sol sanlarǵa qarap kartadaǵı hár bir noqanıń vertikali hám gorizontali neshinshi kilometrlərdə ekenin anıqlawǵa boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}]}, {"name": "xabarlar", "rows": [{"id": 1, "uz": "Prezident Shavkat Mirziyoyev Imom Buxoriy majmuasida yakuniga yetgan bunyodkorlik ishlari va yaratilgan sharoitlar bilan tanishdi.", "qq": "Prezident Shavkat Mirziyoev Imam Buxariy kompleksinde juwmaqlanǵan dóretiwshilik jumısları hám jaratılǵan sharayatlar menen tanıstı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 2, "uz": "Majmua davlatimiz rahbari tashabbusi bilan buyuk muhaddis bobomizning islom olamida tutgan yuksak mavqei, ulkan salohiyatiga munosib tarzda qaytadan bunyod etildi.", "qq": "Kompleks mámleketimiz basshısınıń baslaması menen ullı muhaddis babamızdıń islam dúnyasında tutqan joqarı abırayı, úlken potencialına múnásip tárizde qaytadan qurıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 3, "uz": "Ziyoratchilarga har tomonlama qulay sharoit yaratildi.", "qq": "Zıyaratshılarǵa hár tárepleme qolaylı sharayat jaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 4, "uz": "Xususan, majmua qoshida turizm markazi ochildi.", "qq": "Atap aytqanda, kompleks janında turizm orayı ashıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 5, "uz": "Yondosh 15 gektar maydonda zamonaviy infratuzilma yaratilib, shinam mehmonxonalar, xizmat ko‘rsatish va servis nuqtalari barpo etildi.", "qq": "Qaptaldaǵı 15 gektar maydanda zamanagóy infrastruktura jaratılıp, ıqsham miymanxanalar, xızmet kórsetiw hám servis orayları qurıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 6, "uz": "Jumladan, 1 ta to‘rt yulduzli, 2 ta uch yulduzli mehmonxona, 22 ta 176 o‘rinli oilaviy mehmon uylari hamda avtoturargoh qurilgan.", "qq": "Sonıń ishinde, 1 tórt juldızlı, 2 úsh juldızlı miymanxana, 22 176 orınlıq shańaraqlıq miyman úyleri hám avtomobil turatuǵın orın qurılǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 7, "uz": "Mazkur obyektlar to‘liq kommunikatsiya tarmoqlari bilan ta’minlanib, hududida obodonlashtirish ishlari amalga oshirilgan.", "qq": "Bul obektler tolıq kommunikaciya tarmaqları menen támiyinlenip, aymaǵında abadanlastırıw jumısları ámelge asırılǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 8, "uz": "Natijada Imom Buxoriy majmuasi ilgari bir kunda 12 ming ziyoratchiga xizmat ko‘rsatgan bo‘lsa, hozir kuniga 65 ming nafar ziyoratchini qabul qilish quvvatiga ega.", "qq": "Nátiyjede Imam Buxariy kompleksi burın bir kúnde 12 mıń zıyaratshıǵa xızmet kórsetken bolsa, házir kúnine 65 mıń zıyaratshını qabıl etiw quwatlılıǵına iye.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 9, "uz": "Majmuaning o‘zi Samarqandning, yangi O‘zbekistonning durdonasi bo‘lib qad rostladi.", "qq": "Komplekstiń ózi Samarqandtıń, jańa Ózbekstannıń dúrdanası bolıp boy tikledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 10, "uz": "Uning maydoni 45 gektarni tashkil etadi.", "qq": "Onıń maydanı 45 gektardı quraydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 11, "uz": "10 ming kishiga mo‘ljallangan ulkan masjid, ma’muriyat binosi, 154 ustunli, milliy uslubdagi muhtasham ayvon qurildi.", "qq": "10 mıń adamǵa mólsherlengen úlken meshit, hákimshilik imaratı, 154 baǵanalı milliy usıldaǵı sawlatlı áywan qurıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 12, "uz": "Majmua tarkibida eng ilg‘or axborot texnologiyalari asosida 9 pavilondan iborat noyob innovatsion muzey barpo etildi.", "qq": "Kompleks quramında eń aldınǵı málimleme texnologiyaları tiykarında 9 pavilonnan ibarat biybaha innovaciyalıq muzey qurıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 13, "uz": "U islom olamida muhaddislar sultoni deya e’tirof etilgan Imom Buxoriyning hayoti va ilmiy merosi, islom ma’rifati rivojiga qo‘shgan hissasini namoyon etadi.", "qq": "Ol islam dúnyasında muhaddisler sultanı dep tán alınǵan Imam Buxariydiń ómiri hám ilimiy miyrası, islam aǵartıwshılıǵınıń rawajlanıwına qosqan úlesin kórsetedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 14, "uz": "Shuningdek, muzeyda Qur’oni karimda ismlari zikr qilingan 25 payg‘ambar tarixi, Muhammad alayhissalomning shajarasi, Makka va Madinadagi hayoti, hadislarning jamlanishi va yozilishi haqidagi ma’lumotlar joylashtirilgan.", "qq": "Sonday-aq, muzeyde Quranı kárimde atları tilge alınǵan 25 payǵambar tariyxı, Muhammed áleyhissalamnıń shejiresi, Mekke hám Madinadaǵı turmısı, hádislerdiń jıynawı hám jazılıwı haqqındaǵı maǵlıwmatlar jaylastırılǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 15, "uz": "Qadamjoda 14 ta moviy gumbaz, 75 metrlik 4 ta minora unga ulug‘vor qiyofa bag‘ishlab turibdi.", "qq": "Zıyarat etiw ornında 14 kók gúmbez, 75 metrlik 4 minara oǵan ullı kórinis baǵıshlap tur.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 16, "uz": "Davlatimiz rahbari turizm markazi va masjidda yaratilgan sharoitlarni ko‘zdan kechirdi.", "qq": "Mámleketimiz basshısı turizm orayı hám meshitte jaratılǵan sharayatlardı kózden ótkerdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 17, "uz": "Ma’lumki, bir yarim ming yillik islom tarixini, ilm-ma’rifatini yurtimizdan yetishib chiqqan buyuk olimu ulamolarning nomlarisiz tasavvur etib bo‘lmaydi.", "qq": "Hámmemizge belgili, bir yarım mıń jıllıq islam tariyxın, ilim-máripatın elimizden jetisip shıqqan ullı ilimpaz hám ulamalardıń atlarısız kóz aldımızǵa keltire almaymız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 18, "uz": "Shu kunlarda rasman ochilgan O‘zbekistondagi Islom sivilizatsiyasi markazi ham bu haqiqatni yana bir bor tasdiqlaydi.", "qq": "Usı kúnlerde rásmiy ashılǵan Ózbekstandaǵı Islam civilizaciyası orayı da bul haqıyqattı jáne bir márte tastıyıqlaydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 19, "uz": "Butun musulmon olamida hadis ilmi haqida gap ketsa, hech shubhasiz, bizning diyorimiz birinchilar qatorida tilga olinadi.", "qq": "Pútkil musılman áleminde hádis ilimi haqqında sóz bolǵanda, álbette, biziń úlkemiz birinshiler qatarında tilge alınadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 20, "uz": "Chunki Imom Buxoriy, Imom Termiziy kabi buyuk hadisshunos olimlar aynan mana shu zamin farzandlaridir.", "qq": "Sebebi Imam Buxariy, Imam Termiziy sıyaqlı ullı hádistanıwshı ilimpazlar mine usı jerdiń perzentleri bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 21, "uz": "Xususan, Imom Buxoriyning “Sahihi Buxoriy” kitobi dunyoda tan olingan eng mo‘’tabar oltita hadis kitobining biridir.", "qq": "Atap aytqanda, Imam Buxariydiń “Sahihi Buxariy” kitabı dúnyada tán alınǵan eń abıraylı altı hádis kitabınıń biri bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 22, "uz": "O‘n yoshidan boshlab hadis ilmini o‘rgangan alloma bobomiz 20 dan ortiq asar yozganlar.", "qq": "On jas waqtınan baslap hádis ilimin úyrengen ilimpaz babamız 20 dan aslam shıǵarma jazǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 23, "uz": "Ular to hanuz dinu diyonatimizni mustahkamlash yo‘lida islom ummatiga xizmat qilib kelmoqdalar.", "qq": "Olar házirge shekem dinimizdi bekkemlew jolında islam úmmetine xizmet etip kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 24, "uz": "Prezidentimiz har gal Samarqandga kelganida majmuaning qurilish jarayoni bilan tanishib, bu joy faqat ziyorat emas, ilm-ma’rifat, tarbiya va ibrat maskani bo‘lishi, Imom Buxoriyning buyuk izlanishlari, bilimi hamda kamoloti ziyoratchilar, ayniqsa, yoshlar uchun ezgu namuna bo‘lishi kerakligini ta’kidlagandi.", "qq": "Prezidentimiz hár saparı Samarqandqa kelgeninde komplekstiń qurılıs procesi menen tanısıp, bul jer tek zıyarat etiw emes, ilim-aǵartıwshılıq, tárbiya hám ibrat orayı bolıwı, Imam Buxariydiń ullı izlenisleri, bilimi hám jetikligi zıyaratshılar, ásirese, jaslarǵa úlgi bolıwı kerek ekenin atap ótken edi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 25, "uz": "– Ushbu betakror qurilish yangi O‘zbekistonning ulkan imkoniyatlarini yaqqol namoyon etadi.", "qq": "– Bul biytákirar qurılıs jańa Ózbekstannıń keń imkaniyatların ayqın kórsetedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 26, "uz": "Ziyoratgoh xalqimiz uchun, jahondagi barcha musulmonlar uchun ezgulik va ma’rifat nurini taratadigan qutlug‘ maskanga aylanadi deb ishonaman.", "qq": "Zıyarat etiw ornı xalqımız ushın, dúnyadaǵı barlıq musılmanlar ushın jaqsılıq hám aǵartıwshılıq nurın taratatuǵın teberik orınǵa aylanadı, dep isenemen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 27, "uz": "Aminmanki, bu dargohni ziyorat qilib, uning ma’naviy muhitidan bahramand bo‘lgan inson, ayniqsa, yoshlar islom dinining asl ma’nosini anglab yetadi, to‘g‘ri yo‘ldan adashmaydi, – dedi Prezidentimiz.", "qq": "Bul dárgaydı zıyarat etip, onıń ruwxıy ortalıǵınan paydalanǵan insan, ásirese, jaslar islam dininiń tiykarǵı mánisin túsinip jetedi, durıs joldan adaspaydı, – dedi Prezidentimiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 28, "uz": "Shuning uchun ham Imom Buxoriy majmuasida ma’naviy-ma’rifiy ishlarni keng yo‘lga qo‘yish, uni chinakam tarbiya va ibrat maktabiga aylantirish, bu yerda imom-xatiblar, mahalla faollari uchun malaka oshirish dasturlarini kuchaytirish lozimligi ta’kidlandi.", "qq": "Sonıń ushın da Imam Buxariy kompleksinde ruwxıy-aǵartıwshılıq jumıslardı keńnen jolǵa qoyıw, onı haqıyqıy tárbiya hám ibrat mektebine aylandırıw, bul jerde imam-xatibler, máhálle belsendileri ushın tájiriybe arttırıw baǵdarlamaların kúsheytiw zárúr ekenligi atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 29, "uz": "Bu yerdagi barcha ishlar yakuniga yetganini hisobga olib, yangi qurilgan muhtasham masjidda Hayit namozini ado etish taklif qilindi, bu mo‘min-musulmonlarimiz, butun el-yurtimizning ko‘nglidagi ish, xalqimizga munosib Ramazon sovg‘asi bo‘lishi kerak.", "qq": "Bul jerdegi barlıq jumıslar juwmaqlanǵanın esapqa alıp, jańadan qurılǵan sawlatlı meshitte Hayıt namazın oqıw usınıs etildi, bul mómin-musılmanlarımız, pútkil el-xalqımızdıń kewlindegi jumıs, xalqımızǵa múnásip Ramazan sawǵası bolıwı kerek.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 30, "uz": "Shuning bilan davlatimiz rahbarining Samarqand viloyatiga tashrifi yakunlandi.", "qq": "Sonıń menen mámleketimiz basshısınıń Samarqand wálayatına saparı juwmaqlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 31, "uz": "Prezident Shavkat Mirziyoyev 19-mart kuni Samarqand viloyati Payariq tumanida qaytadan bunyod etilgan Imom Buxoriy majmuasiga tashrif buyurdi.", "qq": "Prezident Shavkat Mirziyoev 19-mart kúni Samarqand wálayatı Payariq rayonında qaytadan qurılǵan Imam Buxariy kompleksine bardı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 32, "uz": "Ziyoratgohning qoq markazida buyuk hadisshunos bobomizning tabarruk maqbarasi o‘rin olgan.", "qq": "Zıyarat etiw orayınıń dál ortasında ullı hádistanıwshı babamızdıń teberik mavzoleyi orın alǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 33, "uz": "Davlatimiz rahbari maqbarani ziyorat qildi.", "qq": "Mámleketimiz basshısı maqbaranı zıyarat etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 34, "uz": "Qur’on tilovat etilib, duo o‘qildi.", "qq": "Quran oqılıp, pátiya etildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 35, "uz": "– Muborak Ramazon hayiti arafasida buyuk vatandoshimiz, hadis ilmining sultoni Imom Buxoriy hazratlarining ruhi poklariga yana bir bor hurmat-ehtirom bajo keltirmoqdamiz.", "qq": "– Múbárek Ramazan hayıtı qarsańında ullı watanlasımız, hádis iliminiń sultanı Imam Buxariy háziretleriniń ruwxına jáne bir márte húrmet-izzet kórsetpektemiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 36, "uz": "Buxoriy bobomiz Qur’oni karimdan keyingi eng mo‘’tabar manba bo‘lgan hadislar kitobini yaratib, butun islom olamida shuhrat qozongan ulug‘ siymodir.", "qq": "Buxariy babamız Quranı kárimnen keyingi eń abıraylı derek bolǵan hádisler kitabın jaratıp, pútkil islam áleminde dańqqa erisken ullı tulǵa bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 37, "uz": "Muqaddas zaminimiz dunyoga mana shunday mashhur allomani bergani bilan har qancha faxrlansak, arziydi.", "qq": "Muqaddes jerimiz dúnyaǵa mine usınday belgili ilimpazdı bergeni menen hár qansha maqtansaq arzıydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 38, "uz": "El-yurtimizning fidokorona mehnati bilan bugun orzu-niyatlarimiz ro‘yobga chiqdi.", "qq": "El-jurtımızdıń pidákerlik miyneti menen búgin arzıw-nietlerimiz ámelge astı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 39, "uz": "Bu betakror ziyoratgohni Imom Buxoriy bobomizning olamshumul mavqeiga, yuksak maqomiga munosib darajada bunyod etishga muyassar bo‘ldik.", "qq": "Bul biytákirar zıyarat etiw ornın Imam Buxariy babamızdıń dúnyaǵa belgili abırayına, joqarı statusına múnásip dárejede qurıwǵa miyasar boldıq.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 40, "uz": "Mana shunday tabarruk maskan barchamizga muborak bo‘lsin, – dedi davlatimiz rahbari.", "qq": "Mine, usınday teberik orın barshemizge mubárek bolsın, – dedi mámleketimiz basshısı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 41, "uz": "O‘zbekiston Respublikasi Prezidenti Shavkat Mirziyoyev 19-mart kuni Ozarbayjon Respublikasi Prezidenti Ilhom Aliyev bilan telefon orqali muloqot qildi.", "qq": "Ózbekstan Respublikası Prezidenti Shavkat Mirziyoev 19-mart kúni Ázerbayjan Respublikası Prezidenti Ilham Aliev penen telefon arqalı sóylesti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 42, "uz": "Davlat rahbarlari yaqinlashib kelayotgan Ramazon hayiti va Navro‘z bayrami munosabati bilan bir-birlarini samimiy qutlab, birodar xalqlarimizga tinchlik-osoyishtalik, farovonlik va ravnaq tiladilar.", "qq": "Mámleket basshıları jaqınlasıp kiyatırǵan Ramazan hayıtı hám Nawrız bayramı múnásibeti menen bir-birin qızǵın qutlıqlap, dos xalıqlarımızǵa tınıshlıq-paraxatshılıq, abadanlıq hám rawajlanıw tiledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 43, "uz": "Suhbatda Oliy davlatlararo kengashning ikkinchi yig‘ilishida erishilgan kelishuvlarni amalga oshirish doirasida O‘zbekiston – Ozarbayjon strategik sheriklik va ittifoqchilik munosabatlarini yanada kengaytirish masalalariga alohida e’tibor qaratildi.", "qq": "Sóylesiwde Joqarı mámleketleraralıq keńestiń ekinshi májilisinde erisilgen kelisimlerdi ámelge asırıw sheńberinde Ózbekstan – Ázerbayjan strategiyalıq sheriklik hám awqamlaslıq qatnasıqların bunnan bılay da keńeytiw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 44, "uz": "Tovar ayirboshlash barqaror ortib borayotgani, savdo-iqtisodiy, investitsiyaviy, transport, madaniy-gumanitar va boshqa ustuvor sohalarda qo‘shma kooperatsiya loyihalari ilgari surilayotgani mamnuniyat bilan qayd etildi.", "qq": "Tovar almasıw turaqlı artıp baratırǵanı, sawda-ekonomikalıq, investiciyalıq, transport, mádeniy-gumanitarlıq hám basqa da tiykarǵı tarawlarda birgeliktegi kooperaciyalıq joybarlar alǵa qoyılıp atırǵanı qanaatlanıwshılıq penen atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 45, "uz": "Tomonlar, shuningdek, Yaqin Sharqdagi vaziyatni muhokama qildilar.", "qq": "Tárepler, sonday-aq, Jaqın Shıǵıstaǵı jaǵdaydı dodaladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 46, "uz": "Uning yanada keskinlashishi keng mintaqa uchun oldindan aytib bo‘lmaydigan oqibatlarga, jahon iqtisodiyoti retsessiyasiga olib kelishi mumkinligi, vaziyatni faqat siyosiy-diplomatik vositalar bilangina tez fursatda yumshatish zarurligi qayd etildi.", "qq": "Onıń jáne de keskinlesiwi keń region ushın aldınnan aytıp bolmaytuǵın aqıbetlerge, jáhán ekonomikasınıń recessiyasına alıp keliwi múmkin ekenligi, jaǵdaydı tek ǵana siyasiy-diplomatiyalıq qurallar menen tez pursatta jumsartıw zárúr ekenligi atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 47, "uz": "Bo‘lajak ikki va ko‘p tomonlama tadbirlar rejasi ham ko‘rib chiqildi.", "qq": "Bolajaq eki hám kóp tárepleme ilajlardıń rejesi de kórip shıǵıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 48, "uz": "Tadbir davomida milliy taomlar va hunarmandchilik buyumlari ko‘rgazmalari tashkil etildi.", "qq": "Ilaj dawamında milliy taǵamlar hám ónermentshilik buyımlarınıń kórgizbeleri shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 49, "uz": "Unda milliy taomlar turlari namoyish etilib, mehmonlarga bahoriy dasturxonlar yozildi.", "qq": "Onda milliy taǵamlarınıń túrleri kórsetilip, miymanlarǵa báhárgi dasturxanlar jayıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 50, "uz": "Shu bilan birga, mahalliy hunarmandlar tomonidan tayyorlangan qo‘l mehnati namunalari - gilamlar, kashtalar, bezak buyumlari va boshqa milliy mahsulotlar ishtirokchilar e’tiboriga havola etildi.", "qq": "Sonıń menen birge, jergilikli ónermentler tárepinen tayarlanǵan qol miyneti úlgileri - gilemler, kesteler, bezew buyımları hám basqa da milliy ónimler qatnasıwshılar itibarına usınıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 51, "uz": "Ko‘rgazmalar orqali xalqimizning boy madaniy merosi, milliy an’ana va qadriyatlari yana bir bor keng targ‘ib qilindi.", "qq": "Kórgizbeler arqalı xalqımızdıń bay mádeniy miyrası, milliy dástúr hám qádiriyatları jáne bir márte keńnen úgit-násiyatlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 52, "uz": "Bayram ishtirokchilari milliy urf-odatlar, qo‘shiq va raqslardan zavq olib, Navro‘zning fayz-u barakasini his etdi.", "qq": "Bayram qatnasıwshıları milliy úrp-ádetler, qosıq hám ayaq oyınlardan zawıq alıp, Nawrızdıń qut-bereketin sezdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 53, "uz": "Ushbu bayram tadbiri mahallada ahillik va hamjihatlik muhitini yanada mustahkamlashga xizmat qildi.", "qq": "Bul bayram ilajı máhállede tatıwlıq hám awızbirshilik ortalıǵın jáne de bekkemlewge xızmet etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 54, "uz": "Bugun butun sharq xalqlari yangi yil boshi Navro‘zning dastlabki yakshanbasi.", "qq": "Búgin pútkil shıǵıs xalıqları jańa jıl bası Nawrızdıń dáslepki ekshembisi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 55, "uz": "Bayram kunlarida xalqimizni sifatli oziq-ovqat bilan ta’minlash, aholi farovonligini oshirish va mahalliy ishlab chiqaruvchilarni qo‘llab-quvvatlash borasida Qonliko‘l dehqon bozori tomonidan xayrli ishlar yo‘lga qo‘yilgan.", "qq": "Bayram kúnlerinde xalqımızdı sapalı azıq-awqat penen támiynlew, xalıqtıń abadanlıǵın arttırıw hám jergilikli islep shıǵarıwshılardı qollap-quwatlaw baǵdarında Qanlıkól diyqan bazarı tárepinende jaqsı jumıslar jolǵa qoyılǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 56, "uz": "Qonliko‘l tumani hokimi B.Sultonov umumxalq Navro‘z bayrami kunlarida dehqon bozorida iste’molchilar uchun sharoitlar bilan tanishtirdi.", "qq": "Qanlıkól rayonı hákimi B.Sultanov ulıwmaxalıqlıq Nawrız bayramı kúnlerinde diyqan bazarında tutınıwshılar ushın sharayatlar menen tanısıtı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 57, "uz": "Dehqon bozori bugun bayram quchog‘ida.", "qq": "Diyqan bazarı búgin bayram qushaǵında.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 58, "uz": "Tuman aholisi kimdir bayramga tayyorgarlik uchun mahsulot sotsa kimdir sotib olmoqda.", "qq": "Rayon xalqı kim dur bayramǵa tayarlıq ushın ónim satsa kimlerdur satıp almaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 59, "uz": "Bozor rastalari bahor mahsulotlari bilan to‘lib, qo‘l yetadigan narxlarda savdo xizmati aholiga muntazam ravishda ko‘rsatilayotgani xaridorlarni quvontiradi.", "qq": "Bazar taxtaları báhár ónimleri menen tolısıp qol jeterli bahalarda sawda xızmeti xalıqqa turaqlı túrde qorsetilip atırǵanı qarıydarlardı quwandıradı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 60, "uz": "Tuman hokimi tumanda savdo xizmatini yanada takomillashtirish bo‘yicha chora-tadbirlar belgiladi.", "qq": "Rayon hákimi rayonda sawda xızmetin elede jetilistiriw boyınsha ilajlar belgiledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 61, "uz": "Bugun Berdaq nomidagi Qoraqalpoq davlat akademik musiqali teatrida «Mahalla tizimi xodimlari kuni» munosabati bilan tantanali bayram kechasi bo‘lib o‘tdi.", "qq": "Búgin Berdaq atındaǵı Qaraqalpaq mámleketlik akademiyalıq muzıkalı teatrında «Máhálle sisteması xızmetkerleri kúni» múnásibeti menen saltanatlı bayram keshesi bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 62, "uz": "Unda Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesining Raisi Amanbay Orinbaev so‘zga chiqib, yig‘ilganlarni tabrikladi.", "qq": "Onda Qaraqalpaqstan Respublikası Joqarǵı Keńesiniń Baslıǵı Amanbay Orınbaev shıǵıp sóylep, jıynalǵanlardı qutlıqladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 63, "uz": "Aytish joizki, so‘ngi yillari Hurmatli Prezidentimizning boshchiligida xalqimiz hayotini yaxshilash, kam ta’minlangan, yordamga muhtoj oilalarni qo‘llab-quvvatlash, joylardagi muammolarga ijobiy yechim topish, mahalla institutini  takomillashtirish, uning tizimli faoliyat olib borishi uchun qulay  sharoitlar yaratish bo‘yicha keng ko‘lamli ishlar amalga oshirilmoqda.", "qq": "Atap ótiw orınlı, sońǵı jılları elimizde húrmetli Prezidentimizdiń basshılıǵında xalıqtıń turmıs tárizin jaqsılaw, kem támiyinlengen, járdemge mútáj shańaraqlardı qollap-quwatlaw, orınlardaǵı mashqalalardı unamlı sheshiw, máhálle institutın jetilistiriw, onıń sistemalı jumıs alıp barıwı ushın qolaylı sharayatlar jaratıw boyınsha keń kólemli jumıslar ámelge asırılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 64, "uz": "O‘tgan qisqa davr ichida sohaga bog‘liq qator Qonun, Farmon va Qarorlarning qabul qilinishi bu boradagi choralar ko‘lamini yangi bosqichlarga ko‘tarishga asos bo‘lmoqda.", "qq": "Ótken qısqa dáwir ishinde tarawǵa baylanıslı bir qatar nızam, párman hám qararlardıń qabıl etilgeni bul baǵdardaǵı ilajlar kólemin jańa basqıshlarǵa kóteriwge tiykar bolmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 65, "uz": "Bu o‘z navbatida mahallani chin ma’noda odamlarning og‘irini yengil qiluvchi tuzilmaga aylantirishda katta ahamiyat kasb etmoqda.", "qq": "Bul óz gezeginde máhálleni shın mánisinde adamlardıń awırın jeńil etetuǵın strukturaǵa aylandırıwda áhmiyetli orın tutpaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 66, "uz": "Haqiqatdan ham, bugungi kunda mahalla institutining jamiyatimizdagi roli ortib bormoqda.", "qq": "Haqıyqatında da, búgingi kúnde máhálle institutınıń jámiyetimizde atqaratuǵın roli artıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 67, "uz": "Chin ma’noda xalqimiz bilan tig‘iz ishlaydigan jamiyatning bir bo‘g‘ini sifatida soha xodimlari mashaqqatli, shuning bilan birga sharafli vazifani bajarib kelmoqda.", "qq": "Shın mánisinde xalqımız benen tıǵız islesetuǵın jámiyettiń bir buwını sıpatında taraw xızmetkerleri oǵada mashaqatlı, sonıń menen birge maqtanıshlı wazıypanı atqarıp kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 68, "uz": "O‘tkazilgan tantanali tadbir davomida bayram munosabati bilan o‘zlarining yuqori natijalari va sermahsul faoliyati bilan ajralib kelayotgan qator soha vakillari hurmatli Prezidentimizning Farmoni asosida orden va medallar, shuningdek, Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesi va O‘zbekistonda mahallalar uyushmasi tomonidan ko‘krak nishonlari bilan taqdirlandi.", "qq": "Ótkerilgen saltanatlı ilaj dawamında búgingi bayram múnásibeti menen ózleriniń joqarı nátiyjeleri hám tabısları menen ajıralıp kiyatırǵan bir qatar taraw pidayıları húrmetli Prezidentimizdiń arnawlı Pármanı tiykarında orden hám medallar, sonday-aq, Qaraqalpaqstan Respublikası Joqarǵı Keńesi hám Ózbekstan máhálleler awqamı tárepinen kókirek belgileri menen sıylıqlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 69, "uz": "Tadbir san’at va madaniyat xodimlari tomonidan tayyorlangan konsert dasturi bilan davom etdi.", "qq": "Ilaj kórkem óner sheberleri tárepinen tayarlanǵan koncert baǵdarlaması menen dawam etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 70, "uz": "Avvalo, sizlarni, sizlarning timsolingizda butun xalqimizni Mahalla tizimi xodimlari kuni bilan samimiy tabriklaymiz.", "qq": "Eń dáslep, sizlerdi, sizlerdiń tımsalıńızda pútkil xalqımızdı Máhálle sisteması xızmetkerleri kúni menen qızǵın qutlıqlaymız.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 71, "uz": "Mahalla - asrlar osha milliy urf-odat va an’analarimizni e’zozlab saqlab, xalqimiz uchun ezgulik va tarbiya beshigi, yaxshi qo‘shnichilik va ahillik maskani bo‘lib kelmoqda.", "qq": "Máhálle - ásirler asa milliy úrp-ádet hám dástúrlerimizdi qásterlep saqlap, xalqımız ushın jaqsılıq hám tárbiya besigi, jaqın qońsıshılıq hám awızbirshiliktiń máskanı bolıp kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 72, "uz": "Biz mahalla deganda, dunyoda kamdan kam uchraydigan, insonni jamiyat bilan birga yashashga o‘rgatib, bag‘rikenglik ruhida tarbiyalaydigan, xalq bilan davlat o‘rtasida ishonchli ko‘prik vazifasini bajaradigan sohani tushunamiz.", "qq": "Biz máhálle degende, dúnyada kemnen-kem ushıraytuǵın, insandı jámiyet penen birge jasawǵa úyretip, keńpeyillik ruwxında tárbiyalaytuǵın, xalıq penen mámleket arasındaǵı isenimli kópir wazıypasın orınlaytuǵın tarawdı túsinemiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 73, "uz": "Bunda mahallalarda hamjihatlik va milliy qadriyatlarimizni keng tarǵib qilishda muhim bo‘lgan ko‘cha boshilari instituti xalq bilan yaqindan ishlashda «mahalla yettiligi»ning chinakam ko‘makchisiga aylangan.", "qq": "Bunda máhállelerde awızbirshilik hám milliy qádriyatlarımızdı en jaydırıwda áhmiyetli bolǵan kóshe biyleri institutı xalıq penen tıǵız birge islesiwde “máhálle jetiligi”niń shın mánisindegi kómekshisine aylanǵan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 74, "uz": "Hozirgi vaqtda yurtimizda yashayotgan har bir inson, millati, tili, dinidan qat’iy nazar, o‘z hayotini, quvonch va tashvishlarini mahalladan alohida tasavvur qila olmaydi.", "qq": "Házirgi waqıtta elimizde jasap atırǵan hár bir insan, milleti, tili, dinine qaramastan, óz ómiri, quwanısh hám táshwishlerin máhálleden bólek kóz aldına keltire almaydı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 75, "uz": "Navro‘z bayrami hurmatli Prezidentimiz tomonidan qabul qilingan Qaror asosida butun yurtimiz bo‘ylab « Navro‘zni ulug‘lash — insonni ulug‘lashdir!»", "qq": "Nawrız bayramı Húrmetli Prezidentimiz tárepinen qabıl etilgen arnawlı Qarar tiykarında pútkil elimiz boylap « Nawrızdı ulıǵlaw - insandı ulıǵlaw!»", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 76, "uz": "shiori ostida ko‘tarinki ruhda o‘tkazilmoqda.", "qq": "súreni astında kóterińki ruwxta ótkerilmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 77, "uz": "Joriy yilning 21-mart kuni Nukus shahrida umumxalq Navro‘z sayliga bag‘ishlangan teatrlashtirilgan va adabiy musiqali xoreografik bayram tomoshalari «Do‘stlik» kanali bo‘yidagi O‘zbekiston milliy, madaniy boyligi ko‘chasida bo‘lib o‘tdi.", "qq": "Usı jıldıń 21-mart kúni Nókis qalasında ulıwma xalıqlıq Nawrız seyiline baǵıshlanǵan teatrlastırılǵan hám ádebiy muzıkalı xoreografiyalıq bayram tamashaları «Doslıq» kanalı boyındaǵı Ózbekstan milliy, mádeniy baylıǵı kóshesinde bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 78, "uz": "Bayram kechasida O‘zbekiston Respublikasi Prezidentining maslahatchisi T.Xudaybergenov, Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesining Raisi Amanbay Orinbaev, hukumat a’zolari, keng jamoatchilik vakillari ishtirok etdi.", "qq": "Bayram keshesine Ózbekstan Respublikası Prezidentiniń keńesgóyi T.Xudaybergenov, Qaraqalpaqstan Respublikası Joqarǵı Keńesiniń Baslıǵı Amanbay Orınbaev, Ministrler Keńesiniń Baslıǵı F.Ermanov, húkimet aǵzaları, keń jámiyetshilik wakilleri qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 79, "uz": "Unda Jo‘qorg‘i Kenges Raisi so‘zga chiqib, butun xalqimizni yangilanish va yosharish ayyomi - Navro‘z bayrami munosabati bilan tabrikladi.", "qq": "Onda Joqarǵı Keńes Baslıǵı shıǵıp sóylep, gúllán xalqımızdı jańarıw hám jasarıw ayyamı – Nawrız bayramı múnásibeti menen qutlıqladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 80, "uz": "Aytish joizki, qutlug‘ ayyom o‘tkazilayotgan maydonda baxshi-jirovlar, sozanda va san’atkorlar o‘z san’atlari bilan xalqimizga bayram kayfiyatini ulashdi.", "qq": "Aytıp ótiw orınlı, qutlı áyyam ótkerilip atırǵan maydanda baqsı-jırawlar, sázendeler hám kórkem óner sheberleri ózleriniń ónerleri menen xalqımızǵa bayram keypiyatın inám etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 81, "uz": "«Do‘stlik» kanali bo‘yida san’at ustalari, madaniyat sohasi vakillari, xalq sevgan ijrochilar yig‘ilganlarga Navro‘zga xos ko‘tarinki ruh bag‘ishladi.", "qq": "«Doslıq» kanalınıń boyında kórkem óner sheberleri, mádeniyat tarawı wákilleri, xalıq súygen atqarıwshılar jıynalǵanlarǵa Nawrızǵa tán kóterińkilik baǵıshladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 82, "uz": "Qardosh xalqlarning milliy urf-odat va an’analarini o‘zida mujassam etgan tarzda sahnalashtirilgan chiqishlar, milliy raqs va qo‘shiqlar ijrosi, xalqimizning milliy o‘yinlari, baxshi va jirovlarning ajoyib chiqishlari barchaga birdek manzur bo‘ldi.", "qq": "Tuwısqan xalıqlardıń milliy úrp-ádet hám dástúrlerin ózinde jámlegen túrde sahnalastırılǵan kórinisler, milliy ayaq oyın hám qosıqlar atqarılıwı, xalqımızdıń milliy oyınları, baqsı hám jırawlardıń ájayıp shıǵıwları hámmege birdey unadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 83, "uz": "Barchangizni el-yurtimizga qut-baraka, fayzu baraka va yangilanish ruhini olib kiradigan ulug‘ ayyom - Navro‘z bayrami bilan samimiy muborakbod etaman.", "qq": "Bársheńizdi elimizge qut-bereket, qut-bereket hám jańalanıw ruwxın alıp keliwshi ullı áyyyam - Nawrız bayramı menen qızǵın qutlıqlayman.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 84, "uz": "Navro‘z - bu tabiat uyg‘onishi, ezgulik va mehr-oqibat tantanasi, inson qalbidagi ezgu niyat va umidlarning yanada mustahkamlanishidir.", "qq": "Nawrız - bul tábiyattıń oyanıwı, jaqsılıq hám miyrim-shápááttiń saltanatı, insan qálbindegi jaqsı nietler menen úmitlerdiń jáne de bekkemleniwi bolıp tabıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 85, "uz": "Bu qutlug‘ ayyom asrlar davomida xalqimizning boy milliy qadriyatlari, urf-odat va an’analarini o‘zida mujassam etgan holda, barchamizni birlashtirib kelmoqda.", "qq": "Bul qutlı áyyyam ásirler dawamında xalqımızdıń bay milliy qádiriyatları, úrp-ádet hám dástúrlerin ózinde jámlegen halda, bárshemizdi birlestirip kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 86, "uz": "Bugun tumanimizda ham Navro‘z keng nishonlanib, milliy an’analarimiz, xalq o‘yinlari va boy madaniyatimiz namoyish etilmoqda.", "qq": "Búgin rayonımızda da Nawrız keńnen belgilenip, milliy dástúrlerimiz, xalıq oyınları hám bay mádeniyatımız kórsetilmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 87, "uz": "Bu esa yosh avlodni milliy ruhda tarbiyalash, totuvlik va hamjihatlikni mustahkamlashda muhim ahamiyat kasb etadi.", "qq": "Bul bolsa jas áwladtı milliy ruwxta tárbiyalaw, tatıwlıq hám awızbirshilikti bekkemlewde ayrıqsha áhmiyetke iye.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 88, "uz": "Ushbu qutlug‘ bayram kunlarida har bir xonadonda tinchlik-xotirjamlik, fayzu baraka hukmron bo‘lishini tilayman.", "qq": "Bul qutlı bayram kúnlerinde hár bir shańaraqta tınıshlıq-paraxachılıq, qut-bereket húkim súriwińizdi tileymen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 89, "uz": "Barchangizga sihat-salomatlik, oilaviy baxt-saodat, mehnat faoliyatingizga omad va yurtimiz ravnaqi yo‘lidagi ishlaringizda ulkan zafarlar tilayman.", "qq": "Bársheńizge bekkem densawlıq, shańaraqlıq baxıt-ıǵbal, miynetlerińizge áwmet hám elimizdiń rawajlanıwı jolındaǵı jumıslarıńızda úlken tabıslar tileymen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 90, "uz": "Navro‘z bayrami barchamizga yangi kuch-g‘ayrat, ezgu niyatlar va ulkan muvaffaqiyatlar olib kelsin!", "qq": "Nawrız bayramı bárshemizge jańa kúsh-ǵayrat, jaqsı nietler hám úlken tabıslar alıp kelsin!", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 91, "uz": "Avvalo, barchangizni, ko‘p millatli butun xalqimizni jonajon O‘zbekistonimizga, aziz Qoraqalpog‘istonimizga kirib kelgan Navro‘z bayrami bilan samimiy tabriklab, eng ezgu tilaklarimizni bildiramiz.", "qq": "Eń dáslep, bársheńizdi, kóp milletli pútkil xalqımızdı janajan Ózbekstanımızǵa, áziz Qaraqalpaqstanımızǵa kirip kelgen Nawrız bayramı menen qızǵın qutlıqlap, eń jaqsı tileklerimizdi bildiremiz.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 92, "uz": "Hammamiz yaxshi bilamiz, Navro‘z tinchlikni, totuvlikni qadrlab, bir-birimizga mehr-oqibatli bo‘lib, e’zozlab yashashga da’vat qiladi.", "qq": "Hámmemiz jaqsı bilemiz, Nawrız tınıshlıqtı, tatıwlıqtı qádirlep, bir-birimizge miyirmanlıq etip, qásterlep jasawǵa shaqıradı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 93, "uz": "Go‘zal diyorimizda yashayotgan, millati, tili va dinidan qat’iy nazar, barcha yurtdoshlarimiz mustahkam og‘izbirchilikda, do‘stlik, totuvlikda Vatanimizning gullab-yashnashi yo‘lida xizmat qilib, birgalikda yashab kelmoqda.", "qq": "Gozzal úlkemizde jasap atırǵan, milleti, tili hám dinine qaramastan, barlıq watanlaslarımız bekkem awızbirshilikte, doslıq, tatıwlıqta Watanımızdıń gúllep jasnawı jolında xızmet etip, birgelikte jasap kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 94, "uz": "Bugungi kunda bayram tantanasi respublikamiz bo‘ylab keng davom etmoqda.", "qq": "Búgingi kúnde bayram saltanatı respublikamız boylap keń túrde dawam etpekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xaba
