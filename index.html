<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>O'zbekcha-qoraqalpoqcha parallel korpus</title>
<style>
:root {
  --bg:#eaf5ff; --panel:#ffffff; --soft:#dff0ff; --border:#c7e2ff;
  --primary:#2d8cff; --primary2:#1168c7; --text:#17324d; --muted:#6c89a6;
  --shadow:0 10px 28px rgba(35,95,155,.12); --radius:18px; --hit:#fff1a8;
}
*{box-sizing:border-box}
body{margin:0;font-family:Segoe UI,Arial,sans-serif;color:var(--text);background:linear-gradient(180deg,#f7fbff 0%,var(--bg) 100%)}
.wrap{max-width:1320px;margin:0 auto;padding:24px}
.hero{background:linear-gradient(135deg,#dff0ff 0%,#bedfff 100%);border:1px solid var(--border);border-radius:26px;padding:24px 24px 18px;box-shadow:var(--shadow);margin-bottom:16px}
.hero-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
.title{font-size:30px;font-weight:800;line-height:1.15;margin:0}
.lang-switch{display:flex;gap:10px;align-items:center}
.lang-btn{border:1px solid var(--border);background:#fff;border-radius:16px;padding:10px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;min-width:150px}
.lang-btn.active{background:#edf7ff;border-color:#90c6ff;box-shadow:0 0 0 3px rgba(74,163,255,.16)}
.lang-btn span{font-size:14px;font-weight:700}
.flag{width:34px;height:22px;border-radius:5px;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);position:relative;flex:0 0 auto}
.flag.uz{background:linear-gradient(to bottom,#1eb8ff 0 33%,#fff 33% 66%,#1eb53a 66% 100%)}
.flag.uz:before,.flag.uz:after,.flag.qq:before,.flag.qq:after{content:"";position:absolute;left:0;right:0;height:2px;background:#ce1126}
.flag.uz:before{top:31%} .flag.uz:after{top:63%}
.flag.uz i{position:absolute;left:6px;top:4px;width:8px;height:8px;border-radius:50%;box-shadow:-3px 0 0 0 #fff;background:#1eb8ff}
.flag.qq{background:linear-gradient(to bottom,#24b6ff 0 44%,#ffd449 44% 56%,#26b86c 56% 100%)}
.flag.qq:before{top:43%} .flag.qq:after{top:55%}
.flag.qq i{position:absolute;left:6px;top:4px;width:8px;height:8px;border-radius:50%;box-shadow:-3px 0 0 0 #fff;background:#24b6ff}
.toolbar{display:grid;grid-template-columns:1.3fr .9fr .9fr .8fr .6fr;gap:12px;margin:16px 0}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
.label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
input,select{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:15px;outline:none;background:#fbfeff;color:var(--text)}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0 16px}
.stat{background:#f7fbff;border:1px solid var(--border);border-radius:14px;padding:10px 14px;min-width:180px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;font-weight:800;margin-bottom:6px}
.stat .v{font-size:26px;font-weight:800;color:var(--primary2)}
.table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse}
thead th{position:sticky;top:0;background:#dff0ff;color:#174771;text-align:left;padding:14px 12px;font-size:14px;border-bottom:1px solid var(--border)}
tbody td{padding:14px 12px;border-bottom:1px solid #edf6ff;vertical-align:top;line-height:1.5;font-size:15px}
tbody tr:hover{background:#f7fbff}
.idcol{width:72px;color:var(--muted);font-weight:700;white-space:nowrap}
.hint,.empty{padding:34px;text-align:center;color:var(--muted)}
.empty{display:none}
.hit{background:var(--hit);padding:0 2px;border-radius:4px;cursor:pointer}
.popover{position:fixed;z-index:9999;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 14px 28px rgba(25,78,131,.18);padding:12px 14px;max-width:330px;display:none}
.popover h4{margin:0 0 8px 0;font-size:14px}
.tagline{font-size:13px;line-height:1.45;margin:3px 0}
@media (max-width:1100px){.toolbar{grid-template-columns:1fr 1fr}.title{font-size:24px}}
@media (max-width:700px){.toolbar{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="hero-top">
      <h1 class="title" id="mainTitle">O'zbekcha-qoraqalpoqcha parallel korpus</h1>
      <div class="lang-switch">
        <button class="lang-btn active" id="btnUZ" type="button"><div class="flag uz"><i></i></div><span>O'zbek</span></button>
        <button class="lang-btn" id="btnQQ" type="button"><div class="flag qq"><i></i></div><span>Qoraqalpoq</span></button>
      </div>
    </div>
  </div>

  <div class="toolbar">
    <div class="card"><div class="label" id="lblSearch">Qidiruv</div><input id="searchInput" type="text" placeholder="So‘z yoki gap kiriting..."></div>
    <div class="card"><div class="label" id="lblMode">Qidiruv turi</div><select id="modeSelect"><option value="exact">Faqat so'zning o'zi</option><option value="forms">So'z shakllari</option></select></div>
    <div class="card"><div class="label" id="lblSheet">Bo'lim</div><select id="sheetSelect"></select></div>
    <div class="card"><div class="label" id="lblField">Qidiruv ustuni</div><select id="fieldSelect"></select></div>
    <div class="card"><div class="label" id="lblLimit">Ko'rsatish</div><select id="limitSelect"><option value="25">25 ta</option><option value="50" selected>50 ta</option><option value="100">100 ta</option><option value="999999">Hammasi</option></select></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k" id="lblTotal">Jami qator</div><div class="v" id="totalCount">0</div></div>
    <div class="stat"><div class="k" id="lblFound">Topilgan natija</div><div class="v" id="resultCount">0</div></div>
    <div class="stat"><div class="k" id="lblPair">Juftlik</div><div class="v" style="font-size:16px" id="pairName"></div></div>
  </div>

  <div class="table-wrap">
    <table>
      <thead><tr><th class="idcol">#</th><th id="leftHeader"></th><th id="rightHeader"></th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="hintState" class="hint">Qidiruv so‘zini kiriting.</div>
    <div id="emptyState" class="empty">Natija topilmadi.</div>
  </div>
</div>

<div id="popover" class="popover"></div>

<script>
const SHEETS = [{"name": "geografiya_darslik", "rows": [{"id": 1, "uz": "Aziz o‘quvchilar!", "qq": "Áziz oqıwshılar!", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 2, "uz": "Siz 6- sinfda «Materiklar va okeanlar tabiiy geografiyasi» bilan tanishganingizda Yer yuzining rang-barangligini, har bir materik, okean tabiati betakror ekanini, har bir qit’aning o‘rganilish tarixini bilib oldingiz, geografik komplekslarni o‘rgandingiz.", "qq": "Siz 6-klasta «Materikler hám okeanlar tábiyiy geografiyası» menen tanısqanıńızda, jer betiniń ráńbe-ráńligin, hárbir materik, okeannıń tábiyatı biytákirar ekenin, hárbir kontinenttiń úyreniliw tariyxın bilip aldıńız, geografiyalıq komplekslerdi úyrendińiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 3, "uz": "Tabiat bilan inson o‘rtasidagi o‘zaro aloqa va ta’sirlar, insonning tabiatdan foydalanish masalalari, tabiatni muhofaza qilish muammolari bilan tanishdingiz.", "qq": "Usınıń menen birge, tábiyat penen insan arasındaǵı óz ara baylanıs hám tásirler, insannıń tábiyattan paydalanıw máseleleri, tábiyattı qorǵaw mashqalaları menen tanıstıńız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 4, "uz": "7- sinfda Siz mamlakatimiz — O‘zbekiston Respublikasi joylashgan tabiiy geografik o‘lka — O‘rta Osiyo tabiiy geografiyasi bilan Vatanimiz tabiiy geografiyasini o‘rganasiz.", "qq": "7-klasta siz elimiz — Ózbekistan Respublikası jaylasqan tábiyiy geografiyalıq úlke — Orta Aziya tábiyiy geografiyası menen Watanımız tábiyiy geografiyasın úyrenesiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 5, "uz": "O‘rta Osiyoning geografik o‘rni, o‘ziga xos xususiyatlari, geologik tuzilishi, relyefi, foydali qazilmalari, iqlimi, suvlari, tuproqlari, o‘simliklari, hayvonot dunyosi, tabiatdan, uning boyliklaridan oqilona foydalanish masalalari bilan tanishasiz.", "qq": "Orta Aziyanıń geografiyalıq ornı, ózine tán ózgeshelikleri, geologiyalıq dúzilisi, relyefi, paydalı qazılmaları, klimatı, suwları, topıraqları, ósimlikleri, haywanat dúnyası, tábiyattan, onıń baylıqlarınan aqılǵa muwapıq paydalanıw máseleleri menen tanısasız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 6, "uz": "Shu bilan birga, geografiyani o‘rganishda xaritalardan foydalanishni, xaritalarning qanday ishlanishini, turlarini, topografik xaritalar, ulardan qanday foydalanishni bilib olasiz.", "qq": "Usınıń menen birge, geografiyanı úyreniwde kartalardan paydalanıwdı, kartalardıń qalay isleniwin, túrlerin, topografiyalıq kartalar, olardan qalay paydalanıwdı bilip alasız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 7, "uz": "Yana vaqt hisobi, soat mintaqalari, iqlim hosil qiluvchi omillar, tuproqlar haqida umumiy tushunchalarga ega bo‘lasiz.", "qq": "Jáne jergilikli waqıt, saat poyasları, klimat payda etiwshi faktorlar, topıraqlar haqqında ulıwma túsiniklerge iye bolasız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 8, "uz": "O‘rta Osiyo tabiiy geografiyasini o‘rganib bo‘lganingizdan keyin o‘quv yilining ikkinchi yarmidan boshlab, jonajon Vatanimiz — O‘zbekistonning tabiiy geografiyasini chuqur o‘rganishga kirishasiz.", "qq": "Orta Aziya tábiyiy geografiyasın úyrenip bolǵanıńızdan keyin oqıw jılınıń ekinshi yarımınan baslap janajan Watanımız — Ózbekistannıń tábiyiy geografiyasın tereń úyreniwge kirisesiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 9, "uz": "Bunda Siz Vatanimizning dunyo geografik xaritasida tutgan o‘rni, ma’muriy bo‘linishi, geologik tuzilishi, relyefi, foydali qazilmalari, iqlim xususiyatlari, ichki suvlari, tuproqlari, o‘simliklari, hayvonot olamini bilib olasiz.", "qq": "Bunda siz watanımızdıń dúnya geografiyalıq kartasında tutqan ornın, administrativlik bóliniwi, geologiyalıq dúzilisi, relyefi, paydalı qazılmaları, klimat ózgeshelikleri, ishki suwları, topıraqları, ósimlikleri, haywanat dúnyasın bilip alasız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 10, "uz": "Mamlakatimizning tabiat komplekslarini o‘rganishda siz Vatanimizning turli hududlari tabiati bir-biridan qanday farq qilishi, u yerlarda tabiatdan, uning boyliklaridan qanday foydalanilayotgani, tabiat qanday qilib muhofaza qilinayotganini bilib olasiz.", "qq": "Elimizdiń tábiyat komplekslerin úyreniwde siz watanımızdıń túrli aymaqlarınıń tábiyatı bir-birinen qanday ózgesheleniwi, ol jerlerde tábiyattan, onıń baylıqlarınan qalay paydalanıp atırǵanı, tábiyat qalay qorǵalıp atırǵanlıǵın bilip alasız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 11, "uz": "Siz bilishingiz lozim bo‘lgan tushuncha va atamalar alohida harflar bilan ajratib yozilgan.", "qq": "Biliwińiz zárúr bolǵan túsinik hám atamalar arnawlı háripler menen ajıratıp jazılǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 12, "uz": "Siz har bir mavzuni qanchalik o‘zlashtirib olganligingizni tekshirib ko‘rish uchun «Savol va topshiriqlar» berilgan.", "qq": "Siz hárbir temanı qanshelli ózlestirip alǵanlıǵıńızdı tekserip kóriw ushın «Sorawlar hám tapsırmalar» berilgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 13, "uz": "Bu savollarga javob berishda, topshiriqlarni bajarishda 7- sinf uchun nashr qilingan geografik atlasdan foydalaning.", "qq": "Bul sorawlarǵa juwap beriwde, tapsırmalardı orınlawda 7-klass ushın basıp shıǵarılǵan geografiyalıq atlastan paydalanıń.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 14, "uz": "Bolalar, sizlar «Materiklar va okeanlar tabiiy geografiyasi» kursini o‘rganganingizda tabiiy geografik rayonlashtirish haqida tushuncha olgan edingiz.", "qq": "Balalar, sizler «Materikler hám okeanlar tábiyiy geografiyası» kursın úyrengenińizde tábiyiy geografiyalıq rayonlastırıw haqqında túsinik alǵan edińiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 15, "uz": "Shunda Yevrosiyo joyning tabiiy xususiyatlariga qarab bir qancha tabiiy geografik o‘lkalarga bo‘linganligi bilan tanishgansiz.", "qq": "Sonda Evraziya óziniń tábiyiy ózgesheliklerine qarap birqansha tábiyiy geografiyalıq úlkelerge bólingenligi menen tanısqansız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 16, "uz": "Endi biz ana shu tabiiy geografik o‘lkalardan biri bo‘lgan O‘rta Osiyoni o‘rganamiz.", "qq": "Endi, biz, mine usı tábiyiy geografiyalıq úlkelerden biri bolǵan Orta Aziyanı úyrenemiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 17, "uz": "O‘rta Osiyo tabiiy o‘lkasi o‘zining tabiiy sharoiti, tabiiy geografik xususiyatlariga ega bo‘lgan, boshqa o‘lkalardan tabiiy chegaralari bilan ajralib turadigan yirik tabiiy geografik kompleksdir.", "qq": "Orta Aziya tábiyiy úlkesi óziniń tábiyiy sharayatı, tábiyiy geografiyalıq ózgesheliklerine iye bolǵan, basqa úlkelerden tábiyiy shegaraları menen ajıralıp turatuǵın iri tábiyiy geografiyalıq kompleks bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 18, "uz": "Bolalar, Siz Yevrosiyoning tabiiy xaritasidan O‘rta Osiyo joylashgan yerlarni e’tibor berib ko‘rib chiqing.", "qq": "Balalar, siz Evraziyanıń tábiyiy kartasınan Orta Aziya jaylasqan jerlerdi dıqqat penen kórip shıǵıń.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 19, "uz": "Shunda O‘rta Osiyo yer yuzasining tuzilishiga ko‘ra uch qismga bo‘linganini ko‘rasiz.", "qq": "Sonda Orta Aziya jer betiniń dúzilisine qarap úsh bólimge bólingenligin kóresiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 20, "uz": "O‘lkaning g‘arbiy qismi cho‘llar egallagan keng pasttekisliklar, shimoliy qismi cho‘l, chalacho‘l va dashtlardan iborat qir va tekisliklar ekanini, sharqiy va janubiy qismlarida osmono‘par baland tog‘lar ko‘tarilib turganini ko‘rasiz.", "qq": "Úlkeniń batıs bólimi shóller iyelegen keń pástegislikler, arqa bólimi shól, yarımshól hám dalalardan ibarat qır hám tegislikler ekenin, shıǵıs hám qubla bólimlerinde júdá biyik tawlar kóterilip turǵanın kóresiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 21, "uz": "O‘rta Osiyo — Yevrosiyo materigining deyarli qoq o‘rtasida joylashgan juda katta berk havzali o‘lka.", "qq": "Orta Aziya — Evraziya materiginiń derlik qaq ortasında jaylasqan oǵada úlken jabıq basseynli úlke.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 22, "uz": "Iqlimi quruq va kontinental.", "qq": "Klimatı qurǵaq hám kontinental klimat.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 23, "uz": "Qishi ancha sovuq.", "qq": "Qısı ádewir suwıq keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 24, "uz": "Shimoli-sharqiy qismida –50°C sovuq kuzatilgan.", "qq": "Arqa-shıǵıs bóliminde —50oC suwıq baqlanǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 25, "uz": "Yozi esa juda issiq.", "qq": "Al, jazı júdá ıssı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 26, "uz": "Termizda harorat +50°C ga, Qoraqumda +54°C ga yetgani kuzatilgan.", "qq": "Termizde temperatura +50oC qa, Qaraqumda +54oC qa jetkenligi baqlanǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 27, "uz": "Suvsiz cho‘llar minglab kilometrga cho‘zilgan.", "qq": "Suwsız shóller mıńlaǵan kilometrlerge sozılǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 28, "uz": "Shu bilan birga, sharqdagi tog‘larda juda katta maydonlarni doimiy qor va muzliklar qoplab yotadi.", "qq": "Usınıń menen birge, shıǵıstaǵı tawlarda oǵada úlken maydanlardı máńgi qar hám muzlıqlar qaplap jatadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 29, "uz": "O‘lkada tabiat turli xil o‘tlar o‘sadigan dashtlardan, janubda quruq subtropiklargacha o‘zgaradi.", "qq": "Úlkede tábiyat hár túrli ot-shópler ósetuǵın dalalardan, qublada qurǵaq subtropiklerge shekem ózgeredi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 30, "uz": "O‘rta Osiyoda butun dunyoga dong‘i ketgan tarixiy me’morchilik yodgorliklari, muzey-shaharlar mavjud.", "qq": "Orta Aziyada pútkil dúnyaǵa dańqı jayılǵan tariyxıy arxitekturalıq estelikleri, muzey-qalalar bar.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 31, "uz": "Buxoro, Samarqand, Xiva dunyoga mashhur shaharlardir.", "qq": "Buxara, Samarqand, Xiywa dúnyaǵa belgili qalalardan esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 32, "uz": "O‘rta Osiyo o‘lkasidan jahon fani rivojiga ulkan hissa qo‘shgan Ahmad alFarg‘oniy, Abu Nasr Forobiy, Abu Rayhon Beruniy, Abu Abdulloh Muhammad ibn Muso al-Xorazmiy, Abu Ali ibn Sino kabi olimlar, Jaloliddin Manguberdi, Amir Òemur, Zahiriddin Muhammad Bobur, Muhammad Shayboniyxon kabi sarkardalar, Abdurahmon Jomiy, Alisher Navoiy, Abu Abdulloh Rudakiy, Ahmad Yassaviy, Boborahim Mashrab kabi buyuk shoirlar, Imom al-Buxoriy, Hakim at-Òermiziy, Bahouddin Naqshband kabi hadisshunos mutafakkirlar yetishib chiqqan.", "qq": "Orta Aziya úlkesinen pútkil dúnya iliminiń rawajlanıwına úlken úles qosqan Ahmad al-Ferǵaniy, Abu Nasr Farabiy, Abu Rayxan Beruniy, Abu Abdullah Muhammed ibn Musa al-Xorezmiy, Abu Ali ibn Sina usaǵan alımlar, Amir Temur, Zahiriddin Muhammed Babur, Muhammed Shaybaniyxan usaǵan sárkardalar, Alisher Nawayı, Abdirahman Jomiy, Abu Abdullah Rudakiy, Ahmad Yassawiy, Babarahim Mashrab usaǵan ullı shayırlar, Imam al Buxariy, Hakim at-Termiziy, Bahowiddin Naqshbandiy usaǵan hádis izertlewshiler jetisip shıqqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 33, "uz": "O‘rta Osiyo Yevrosiyo materigining o‘rtasida joylashgan.", "qq": "Orta Aziya Evraziya materiginiń ortasında jaylasqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 34, "uz": "O‘lkaning eng shimoliy nuqtasi 53,8° shimoliy kenglikda, Ayirtov yaqinida, eng janubiy nuqtasi Hindukush tog‘larining g‘arbiy tarmog‘i bo‘lgan.", "qq": "Úlkeniń eń arqa noqatı 53,8o arqa keńlikte, Ayırtawǵa jaqın jerde, eń qubla noqatı Hindikush tawlarınıń batıs tarmaǵı bolǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 35, "uz": "7 lari tutashgan joyda (34° shimoliy kenglik), g‘arbiy nuqtasi Kaspiy dengizining Mang‘ishloq yarimorolidagi Òubqarag‘ay burnida (50,3° sharqiy uzunlik) va sharqiy nuqtasi Savir tog‘- larining etagidagi Qora Irtish daryosi vodiysida (85,6° sharqiy uzunlik) joylashgan.", "qq": "7 kuh taw dizbegi menen Nishapur tawları tutasqan jerde — (34o a.k), batıs noqatı Kaspiy teńiziniń Mańǵıshlaq yarım atawındaǵı Tubqaraǵay tumsıǵında (50,3o sh.b) hám shıǵıs noqatı Savir tawlarınıń etegindegi Qara Irtish dáryası alabında (85,6o sh.b.) jaylasqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 36, "uz": "Shimoldan janubga 2200 km va g‘arbdan sharqqa 2750 km ga yaqin masofaga cho‘zilgan.", "qq": "Arqadan qublaǵa 2200 km hám batıstan shıǵısqa 2750 km ge jaqın aralıqqa sozılǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 37, "uz": "O‘rta Osiyo o‘lkasining geografik kengligi Janubiy Yevropa o‘lkasi, Afrikadagi Atlas tog‘lari geografik kengligiga to‘g‘ri keladi.", "qq": "Orta Aziya úlkesiniń geografiyalıq keńligi Qubla Evropa úlkesi, Afrikadaǵı Atlas tawları geografiyalıq keńligine tuwrı keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 38, "uz": "U yerlardagi mamlakatlar iliq mo‘tadil va subtropik tabiatli mamlakatlardir.", "qq": "Bul jerdegi eller jıllı, ortasha hám subtropikalıq tábiyatlı eller esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 39, "uz": "O‘rta Osiyo yirik materikning o‘rtasida, dengiz va okeanlardan uzoqda joylashganligi sababli juda qurg‘oqchil o‘lkadir.", "qq": "Orta Aziya úlken materiktiń ortasında, teńiz hám okeanlardan uzaqta jaylasqanlıqtan júdá qurǵaq úlke esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 40, "uz": "O‘lkaning chegarasi juda murakkab.", "qq": "Úlkeniń shegarası júdá quramalı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 41, "uz": "Janub va sharq tomonlarida chegara tog‘larning suvayirg‘ichidan o‘tkaziladi.", "qq": "Qubla hám shıǵıs táreplerinen shegara tawlardıń suw ayırǵıshlarınan ótkeriledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 42, "uz": "Chunki bu tog‘lar iqlimiy va gidrografik chegaralar hisoblanadi.", "qq": "Sebebi bul tawlar klimatlıq hám gidrografikalıq shegaralar bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 43, "uz": "Lekin shimoli-g‘arbiy, shimoliy va shimoli-sharqiy chegaralarni aniqlash ancha murakkab.", "qq": "Biraq arqa-batıs, arqa hám arqa-shıǵıs shegaralardı anıqlaw birqansha qıyın.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 44, "uz": "Bu yerda iqlimiy chegaralar yo‘q desa ham bo‘ladi.", "qq": "Bul jerde klimatlıq shegaralar joq dewge de boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 45, "uz": "Shuning uchun bu yerda tektonik chegaralar asos qilib olinadi.", "qq": "Sonlıqtan bul jerde tektonikalıq shegaralardı tiykar etip alıwǵa boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 46, "uz": "Shunday qilib, O‘rta Osiyo o‘lkasi chegaralarini quyidagicha belgilash mumkin.", "qq": "Solay etip, Orta Aziya úlkesi shegaraların tómendegishe belgilew múmkin.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 47, "uz": "G‘arb tomonda Kaspiy dengizi qirg‘oqlari chegara bo‘ladi.", "qq": "Batıs tárepte Kaspiy teńiziniń jaǵaları shegara boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 48, "uz": "Shimoli-g‘arbiy chegara Emba daryosining quyar joyidan janubroqdan boshlanib, Ustyurt platosi shimoliy chinklari bo‘ylab o‘tadi va Mug‘ojar tog‘larining janubiy etaklarigacha boradi.", "qq": "Arqa-batıs shegara Emba dáryasınıń quyar jerinen qublaraqtan baslanıp, Ústirt platosı arqa chinkleri boylap ótedi hám Muǵojar tawlarınıń qubla eteklerine shekem baradı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 49, "uz": "Bu chegara Sharqiy Yevropa platformasi bilan yosh Turon platformasi chegarasiga to‘g‘ri keladi.", "qq": "Bul shegara Shıǵıs Evropa platforması menen Turan platforması shegarasına tuwrı keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 50, "uz": "Chegara 58° sharqiy uzunlik va 48° shimoliy kenglikka yetgandan keyin shimolga, shimoli sharqqa burilib Qustonoygacha davom etadi va undan Ayirtovga boradi.", "qq": "Shegara 58o sh.b hám 48o a.k jetkennen keyin arqaǵa, arqa-shıǵısqa qaray Qostanayǵa shekem dawam etedi hám onnan Ayırtawǵa baradı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 51, "uz": "So‘ngra chegara sharq va janubi sharqqa tomon Qozog‘iston past tog‘larining shimoliy etaklari bo‘ylab davom etib, Qozog‘iston — Xitoy chegarasida Savir tog‘larining shimoliy etagiga keladi.", "qq": "Soń shegara shıǵıs hám qublashıǵısqa qaray Qazaqstannıń páskeltek tawlarınıń arqa etekleri boylap dawam etip, Qazaqstan — Qıtay shegarasındaǵı Savir tawlarınıń arqa etegine keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 52, "uz": "Sharqiy chegara Savir, O‘rkashar, Moylitog‘, Jung‘oriya, Boroxoro, Iren-Xabirga tizmalari, Adenkur dovoni, Qarat, Xoliqtog‘ tizmalari suvayirg‘ichi orqali o‘tib, Xontangri tog‘ tuguniga keladi.", "qq": "Shıǵıs shegara Savir, Órkashar, Maylıtaw, Junǵariya, Boroxoro, Iren-Xabirga taw dizbekleri, Adenkur ótkeli, Qarat, Xalıqtaw dizbekleri suwayırǵıshı arqalı ótip, Xantańri taw túyinine shekem keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 53, "uz": "Undan so‘ng Ko‘kshag‘al, Otboshi tizmalari suvayirg‘ichi orqali o‘tib, Farg‘ona tizmasiga tutashadi, so‘ngra Oloy tog‘larining sharqiy qismi va Sariko‘l tizmasi bo‘ylab o‘tib, Hindukush tog‘lariga tutashadi.", "qq": "Onnan keyin Kókshaǵal, Atbası dizbekleriniń suw ayırǵıshı arqalı ótip, Ferǵana dizbegine tutasadı, sońınan Alay tawlarınıń shıǵıs bólimi hám Sarıkól dizbegi boylap ótip Hindikush tawlarına tutasadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 54, "uz": "Janubiy chegara Hindikush, Safedko‘h, Nishopur tog‘ tizmalari suvayirg‘ichi bo‘ylab o‘tib, Kaspiy dengizi qirg‘og‘i bilan tutashadi.", "qq": "Qubla shegara Hindikush, Safedkuh, Nishapur taw dizbekleriniń suw ayırǵıshları boylap ótip, Kaspiy teńizi jaǵası menen tutasadı (Kartadan bul shegaralardı kórip shıǵıń).", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 55, "uz": "O‘rta Osiyoni alohida tabiiy geografik o‘lka sifatida ajratishga asos bo‘ladigan tabiiy xususiyatlari quyidagilar.", "qq": "Orta Aziyanıń ayrıqsha tábiyiy geografiyalıq úlke sıpatında ajıratıwǵa bolatuǵın ózine tán tábiyiy ózgeshelikleri tómendegiler.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 56, "uz": "O‘rta Osiyo okeanlardan uzoqda, materikning o‘rtasida joylashgan.", "qq": "Orta Aziya okeanlardan uzaqta, materiktiń ortasında jaylasqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 57, "uz": "Eng yaqin okean — Hind okeanigacha bo‘lgan masofa 1000 km dan ortiq.", "qq": "Eń jaqın okean — Hind okeanına shekem aralıq 1000 km den aslam.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 58, "uz": "Iqlimi — qishi ancha sovuq, yozi issiq, yog‘in kam bo‘lgan keskin kontinental iqlim.", "qq": "Klimatı — qısı ádewir suwıq, jazı ıssı, jawın az bolǵan keskin kontinental klimat.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 59, "uz": "Suvlari tashqariga chiqib ketmaydigan, gidrografik jihatdan yaxlit berk o‘lka (shimoli-sharqiy kichik qismidan tashqari).", "qq": "Suwları sırtqa shıǵıp ketpeytuǵın, gidrografikalıq jaqtan bir pútin tuyıq úlke (arqa-shıǵıs kishi bóliminen tısqarı).", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 60, "uz": "Tabiatida o‘ziga xos keskinliklar mavjud, ya’ni bu yerda dengiz sathidan 132 m past bo‘lgan Qoragiyo botig‘i bilan birga, balandligi 7000 m dan oshadigan tog‘lar bor.", "qq": "Tábiyatında ózine tán keskinlikler bar, yaǵnıy bul jerde teńiz qáddinen 132 m tómen bolǵan Qaragiya batıǵı menen birge, biyikligi 7000 m den asatuǵın tawlar bar.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 61, "uz": "Cho‘llarda yog‘in miqdori 70—80 mm dan, tog‘larda 1000 mm gacha boradi.", "qq": "Shóllerde jawınshashın muǵdarı 70—80 mm ge shekem, tawlarda 1000 mm ge shekem jetedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 62, "uz": "Qishda shimoli-sharqiy qismida –50°C li sovuq, yozda janubida +50°C li jazirama issiq kunlar kuzatiladi.", "qq": "Qısta arqa-shıǵıs bóliminde—50o C lıq suwıq, jazda qublada +50o C lıq jazıyrama ıssı kúnler baqlanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 63, "uz": "Janub va sharq tomonlari baland tog‘lar bilan o‘ralgan.", "qq": "Qubla hám shıǵıs tárepleri biyik tawlar menen qorshalǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 64, "uz": "Shimol va shimoli g‘arb tomonlari tekisliklardan iborat.", "qq": "Arqa hám arqa-batıs tárepleri tegisliklerden ibarat.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 65, "uz": "G‘arbdan iliq shamollar, shimoldan sovuq, quruq shamollar bemalol kirib kela oladi.", "qq": "Batıstan jıllı samallar, arqadan suwıq, qurǵaq samallar irkinishsiz kirip kele aladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 66, "uz": "G‘arbiy shamollar tog‘larning g‘arbiy yonbag‘irlariga anchagina yog‘in keltiradi.", "qq": "Batıs samallar tawlardıń batıs janbawırlarına kóp jawın-shashın alıp keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 67, "uz": "Baland tog‘larda qor, muz to‘planib, yoz davomida daryolarga suv berib turadi.", "qq": "Biyik tawlarda qar, muz toplanıp, jaz dawamında dáryalarǵa suw berip turadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 68, "uz": "Bu yerda o‘simliksiz ko‘chma qumlar ham, o‘tish qiyin bo‘lgan chakalakzorlar ham, ekinzor va bog‘lardan iborat obod vohalar ham mavjud.", "qq": "Bul jerde ósimliksiz kóshpeli qumlardı, ótiw qıyın bolǵan putalıqlardı, egislik hám baǵlardan ibarat oazislerdi ushıratıw múmkin.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 69, "uz": "O‘rta Osiyoning gidrografik berk o‘lka ekanligi va sharq, janub tomonlardan baland tog‘lar bilan o‘ralganligi ekologik jihatdan noqulay vaziyat tarkib topishiga sabab bo‘ladi.", "qq": "Orta Aziyanıń gidrografikalıq tuyıq úlke ekenligi hám shıǵıs, qubla táreplerden biyik tawlar menen qorshalǵanlıǵı ekologiyalıq jaqtan qolaysız jaǵday júzege keliwine sebep boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 70, "uz": "O‘rta Osiyo tabiatini o‘rganish juda qadim davrlardan boshlangan.", "qq": "Orta Aziya tábiyatın úyreniw oǵada áyyemgi dáwirlerden baslanǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 71, "uz": "Chunki O‘rta Osiyo G‘arb va Sharq davlatlari o‘rtasidagi muhim xalqaro savdo yo‘lida joylashgan.", "qq": "Sebebi Orta Aziya Batıs hám Shıǵıs mámleketleri arasındaǵı áhmiyetli xalıqaralıq sawda jolında jaylasqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 72, "uz": "O‘rta Osiyo haqidagi dastlabki ma’lumotlarni Gerodot, Strabon, Arrian, Ptolemey va boshqalarning asarlarida uchratish mumkin.", "qq": "Orta Aziya haqqındaǵı dáslepki maǵlıwmatlardı Gerodot, Strabon, Arrian, Ptolemey hám basqalardıń shıǵarmalarında ushıratıw múmkin.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 73, "uz": "O‘rta Osiyo tabiatini o‘rganish tarixi bir necha bosqichdan iborat.", "qq": "Orta Aziya tábiyatın izertlew tariyxı birneshe basqıshlardan ibarat.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 74, "uz": "Birinchi bosqich — «Buyuk ipak yo‘li» mavjud bo‘lgan davr.", "qq": "Birinshi basqısh — «Ullı jipek jolı» payda bolǵan dáwir.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 75, "uz": "Ipak yo‘li miloddan avvalgi II asrdan milodning XVI asrigacha asosiy savdo yo‘li hisoblangan.", "qq": "Jipek jolı biziń eramızǵa shekemgi II ásirden biziń eramızdıń XVI ásirine shekem tiykarǵı sawda jolı bolıp esaplanǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 76, "uz": "Bu davrda O‘rta Osiyo tabiati xitoy, arab va mahalliy olimlar tomonidan o‘rganildi.", "qq": "Bul dáwirde Orta Aziya tábiyatı qıtay, arab hám jergilikli alımlar tárepinen izertlengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 77, "uz": "Xitoy sayyohi Chjan-Syan 13 yil davomida (miloddan avvalgi 138—126- yillar) Issiqko‘l atrofi, Farg‘ona va Xorazm tabiatini, aholisi va xo‘jaligini o‘rgandi.", "qq": "Qıtay sayaxatshısı Chjan-Cyan 13 jıl dawamında (b.e.sh. 138—126-jıllar) Issıqkól átirapın, Ferǵana hám Xorezm tábiyatın, xalqın hám xojalıǵın úyrendi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 78, "uz": "Milodning VII asrida Syuan-Szan 16 yil davomida (629—645- yillar) Òyanshan, Yettisuv, Chu vodiysi, Òoshkent, Samarqand va Pomir tabiatini o‘rganib, muhim geografik asar yozib qoldirgan.", "qq": "Biziń eramızdıń VII ásirinde Syuan-Czan 16 jıl dawamında (629—645-jıllar) Tyanshan, Jetisuw, Chu oypatlıǵı, Tashkent, Samarqand hám Pamir tábiyatın izertlep, áhmiyetli geografiyalıq shıǵarma jazıp qaldırǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 79, "uz": "O‘rta asrlarda O‘rta Osiyo tabiati arab olimlari tomonidan o‘rganilgan.", "qq": "Orta ásirlerde Orta Aziya tábiyatı Arab alımları tárepinen izertlengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 80, "uz": "Arab sayyohlari va olimlari tomonidan O‘rta Osiyo tabiati va uning tabiiy geografik o‘lkalari haqida juda ko‘p geografik ma’lumotlar yozib qoldirilgan.", "qq": "Arab sayaxatshıları hám alımları Orta Aziya tábiyatı hám onıń tábiyiy geografiyalıq úlkeleri haqqında júdá kóp geografiyalıq maǵlıwmatlar jazıp qaldırǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 81, "uz": "Abul Hasan Ali Ma’sudiy (X asr) O‘rta Osiyo va Kavkaz geografiyasi haqida asar yozgan, Abu Is’hoq Istaxriy (X asr) «Iqlimlar kitobi», Yoqut ibn Abdulla (XII—XIII asrlar) «Mamlakatlarning alifbo tartibida ro‘yxati» nomli asar yozgan.", "qq": "Abul Xasan Aliy Masudiy (X ásir) Orta Aziya hám Kavkaz geografiyası haqqında shıǵarma jazǵan, Abu Isxaq Istaxriy (X ásir) «Klimatlar kitabı», Yaqut ibn Abdulla (XII—XIII ásirler) «Ellerdiń álipbe tártibindegi dizimi» atamasındaǵı shıǵarma jazǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 82, "uz": "O‘rta Osiyo tabiatini o‘rganishga shu yerlik olimlar ham juda katta hissa qo‘shgan.", "qq": "Orta Aziya tábiyatın izertlewde jergilikli alımlar da júdá úlken úles qosqan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 83, "uz": "Muhammad ibn Muso al-Xorazmiy (IX asr) O‘rta Osiyo geografiyasiga asos solgan, uning «Yer tasviri» nomli asari o‘z zamonasida eng mukammal geografik asar bo‘lgan.", "qq": "Muxammad ibn Musa al-Xorezmiy (IX ásir) Orta Aziya geografiyasına tiykar salǵan, onıń «Jer kórinisi» degen shıǵarması óz zamanında eń tolıq geografiyalıq shıǵarma bolǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 84, "uz": "Bu asar 1878- yilda rus tiliga tarjima qilingan.", "qq": "Bul shıǵarma 1878-jılı rus tiline awdarılǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 85, "uz": "O‘rta Osiyo tabiati, geologik tuzilishi, foydali qazilmalari, xo‘jaligi, tarixi haqida buyuk olim Abu Rayhon Beruniy (X—XI asrlar) juda qimmatli ma’lumotlar yozib qoldirgan.", "qq": "Orta Aziya tábiyatı, geologiyalıq dúzilisi, paydalı qazılmaları, xojalıǵı, tariyxı haqqında ullı alım Abu Rayxan Beruniy (X—XI ásirler) oǵada bahalı maǵlıwmatlar jazıp qaldırǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 86, "uz": "Uning dunyo xaritasida O‘rta Osiyodagi ko‘p joylar va ularning nomlari berilgan.", "qq": "Onıń dúnya kartasında Orta Aziyadaǵı kóp jerler hám olardıń atları berilgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 87, "uz": "Mahmud Koshg‘ariy (XI asr) ham O‘rta Osiyoni, uning tabiatini o‘rgangan bo‘lib, o‘zining mashhur «Devon-u lug‘otit turk» asarida ko‘p joy nomlari va geografik atamalar haqida yozib qoldirgan.", "qq": "Maxmud Qashǵariy (XI ásir) da Orta Aziyanı, onıń tábiyatın izertlegen, óziniń belgili «Devonu luǵotit turk» shıǵarmasında kóp jerlerdiń atamaları hám geografiyalıq terminler haqqında jazıp qaldırǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 88, "uz": "Zahiriddin Muhammad Bobur (XV—XVI asrlar) «Boburnoma» asarida O‘rta Osiyo tabiati, ayniqsa, Farg‘ona vodiysidagi joylar haqida muhim ma’lumotlar keltirgan.", "qq": "Zahiriddin Muhammed Babur (XV—XVI ásirler) «Baburnama» shıǵarmasında Orta Aziya tábiyatı, ásirese Ferǵana alabındaǵı jerler haqqında áhmiyetli maǵlıwmatlar keltirgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 89, "uz": "Ikkinchi bosqich — bu davr O‘rta Osiyoning Rossiya imperiyasi tomonidan bosib olinishi arafasidan to oktabr to‘ntarishigacha bo‘lgan davrni o‘z ichiga oladi.", "qq": "Ekinshi basqısh — bul dáwir Orta Aziyanıń Rossiya imperiyası tárepinen basıp alınıwı qarsańınan tap oktyabr revolyuciyasına shekem bolǵan dáwirdi óz ishine aladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 90, "uz": "O‘rta Osiyo bu bosqichda har tomonlama turli maqsadlarda, shu jumladan, harbiy maqsadda o‘rganildi.", "qq": "Orta Aziya bul basqıshta hár tárepleme túrli maqsetlerde, sonıń menen birge áskeriy maqsette izertlendi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 91, "uz": "O‘rta Osiyo Rossiya imperiyasi tomonidan bosib olinguniga qadar uning tabiati I.Xoxlov (1620), B.Pazuxin (1669—1673), Benevini (1718—1725), F.Yefremov, G.Karelin va boshqalar tomonidan o‘rganildi.", "qq": "Orta Aziya Rossiya imperiyası tárepinen basıp alınǵanǵa shekem onıń tábiyatı I.Xoxlov (1620), B.Pazuxin (1669—1673), Benevini (1718—1725), F.Efremov, G.Karelin hám basqalar tárepinen izertlendi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 92, "uz": "Ular, asosan, Xorazm, Qoraqum, Qizilqum, Markaziy Qozog‘iston, Orol dengizi tabiatini o‘rgandilar.", "qq": "Olar tiykarınan Xorezm, Qaraqum, Qızılqum, Oraylıq Qazaqstan, Aral teńizi tábiyatın úyrendi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 93, "uz": "O‘rta Osiyo Rossiyaning mustamlakasiga aylantirilgandan keyin tabiiy boyliklaridan ko‘proq, to‘liqroq foydalanish maqsadida uning tabiatini o‘rganish yana ham kengaydi.", "qq": "Orta Aziya Rossiyanıń koloniyasına aylandırılǵannan keyin onıń tábiyiy baylıqlarınan kóbirek, tolıǵıraq paydalanıw maqsetinde tábiyatın úyreniw jáne de en jaydı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 94, "uz": "Bu davrda uning tabiati, xo‘jaligini P.P.Semyonov-Òyanshanskiy (1856—1897), N.A.Seversov (1864—1878), A.P.Fedchenko (1868—1871) va boshqalar o‘rgandilar.", "qq": "Bul dáwirde onıń tábiyatın, xojalıǵın P.P.Semyonov-Tyanshanskiy (1856— 1897), N.A.Severcev (1864—1878), A.P.Fedchenko (1868—1871) hám basqalar izertledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 95, "uz": "Natijada, O‘rta Osiyoning geologik tuzilishi, foydali qazilmalari, o‘simliklari, hayvonot dunyosi haqida muhim ilmiy ma’lumotlar olindi.", "qq": "Nátiyjede, Orta Aziyanıń geologiyalıq dúzilisi, paydalı qazılmaları, ósimlikları, haywanat dúnyası haqqında áhmiyetli ilimiy maǵlıwmatlar alındı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 96, "uz": "Uchinchi bosqich — oktabr to‘ntarishidan O‘zbekiston mustaqillikka erishgungacha bo‘lgan davr.", "qq": "Úshinshi basqısh — oktyabr revolyuciyasınan Ózbekistan ǵárezsizlikke eriskenge shekem bolǵan dáwir.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 97, "uz": "Bu davrda O‘rta Osiyo tabiiy boyliklari tez sur’atlar bilan o‘zlashtirila boshlandi.", "qq": "Bul dáwirde Orta Aziya tábiyiy baylıqları tez pát penen ózlestirildi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 98, "uz": "Uning geologiyasi, relyefi, iqlimi, ichki suvlari, tuprog‘i, o‘simligi va hayvonot dunyosi, chuqur va har tomonlama o‘rganildi.", "qq": "Onıń geologiyası, relyefi, klimatı, ishki suwları, topıraǵı, ósimligi, haywanat dúnyası, tereń hám hár tárepleme izertlendi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 99, "uz": "Bu davrda O‘rta Osiyo tabiatini o‘rganishga N.L.Korjenevskiy va boshqa olimlar katta hissa qo‘shdilar.", "qq": "Bul dáwirde Orta Aziya tábiyatın izertlewde N.L.Korjenevskiy h.t.b. ilimpazlar úlken úles qostı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 100, "uz": "Mamlakatimiz mustaqillikka erishgandan keyin geografik tadqiqotlar tabiatdan, uning boyliklaridan to‘g‘ri foydalanish, muhofaza qilish masalalarini o‘rganishga yo‘naltirildi.", "qq": "Elimiz ǵárezsizlikke eriskennen soń geografiyalıq izertlewler tábiyattan, onıń baylıqlarınan durıs paydalanıw, qorǵaw máselelerin úyreniwge baǵdarlandı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 101, "uz": "Ayniqsa, suv boyligimiz va uni muhofaza qilish, atrof-muhitni toza tutish, tabiiy geografik jarayonlarni, inson va tabiat munosabatlari masalalarini o‘rganishga e’tibor berilmoqda.", "qq": "Ásirese, suw baylıǵımız hám onı qorǵaw, qorshaǵan ortalıqtı taza saqlaw, tábiyiy geografiyalıq processlerdi, adam hám tábiyat qatnasları máselelerin úyreniwge itibar berilmekte.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 102, "uz": "O‘rta Osiyoning tub aholisiga o‘zbeklar, tojiklar, qozoqlar, qirg‘izlar, turkmanlar, qoraqalpoqlar, afg‘onlar, forslar kiradi.", "qq": "Orta Aziyanıń túpkilikli xalqına ózbekler, qaraqalpaqlar, tájikler, qazaqlar, qırǵızlar, túrkmenler, awǵanlar, parsılar kiredi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 103, "uz": "O‘rta Osiyo xalqlari jahon fani va madaniyatiga, davlatchilik ilmiga katta hissa qo‘shgan buyuk allomalari, sarkardalari bilan faxrlanadi.", "qq": "Orta Aziya xalıqları jáhán ilimi hám mádeniyatına, mámleketshilik ilimine úlken úles qosqan ullı alımlar, sárkardaları menen maqtanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 104, "uz": "O‘rta Osiyoda tub millatlardan tashqari turli vaqtlarda ko‘- chib kelib, o‘troq yashab qolgan ruslar, tatarlar, yahudiylar, ukrainlar, boshqirdlar, koreyslar, uyg‘urlar, turklar va boshqa millatlar ham mavjud.", "qq": "Orta Aziyada tiykarǵı milletlerden basqa túrli waqıtlarda kóship kelip, otırıqlı jasap qalǵan ruslar, tatarlar, evreyler, ukraynlar, bashqurtlar, koreecler, uyǵırlar, túrkler hám basqa milletler de bar.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 105, "uz": "Shunday buyuk insonlardan kimlarni bilasiz?", "qq": "Usınday ullı insanlardan kimlerdi bilesiz?", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 106, "uz": "Hozirgi paytda O‘rta Osiyo aholisi 75 mln kishidan ortiq.", "qq": "Házirgi waqıtta Orta Aziya xalqı 75 mln adamnan aslam.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 107, "uz": "O‘rta Osiyo cho‘l va chalacho‘l zonalarida joylashganligidan aholi azaldan vodiylarda, suv manbalari — daryo bo‘ylarida, vohalarda bir-biriga moslashib, yelkadosh bo‘lib yashashga o‘rgangan.", "qq": "Orta Aziya shól hám yarımshól zonalarında jaylasqanlıqtan xalqı burınnan alaplarda, suw derekleri — dáryalar boylarında, oazislerde bir-birine maslasıp, birlesip jasawǵa úyrengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 108, "uz": "O‘rta Osiyo tabiati, hayotning o‘zi bu yerdagi xalqlarni shu ruhda tarbiyalagan.", "qq": "Orta Aziya tábiyatı, turmıstıń ózi bul jerdegi xalıqlardı usınday ruxta tárbiyalaǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 109, "uz": "O‘rta osiyolik ulug‘ alloma-mutafakkirlar — Abdullo Rudakiy, Alisher Navoiy, Maxtumquli, Abay, To‘xtag‘ul xalqlarni mehr-oqibatli, do‘st, birodar bo‘lib yashashga da’vat qilishgan.", "qq": "Orta Aziyalı ullı alım-oyshıllar—Alisher Nawayı, Rudakiy, Maqtumqulı, Abay, Toqtaǵul xalıqlardı mehir-aqıbetli, dos, awızbirshilikli bolıp jasawǵa shaqırǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 110, "uz": "Bunday da’vat hozirgi vaqtda yanada muhim ahamiyat kasb etadi.", "qq": "Bunday shaqırıq házirgi waqıtta oǵada áhmiyetli.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 111, "uz": "Siyosiy xarita deb jahondagi yoki uning qaysidir qismidagi davlatlarning ma’lum bir tarixiy davrdagi holati aks etgan xaritaga aytiladi.", "qq": "Siyasiy karta dep dúnya júzindegi yamasa onıń bir bólimindegi mámleketlerdiń belgili bir tariyxıy dáwirdegi jaǵdayın belgileytuǵın kartaǵa aytıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 112, "uz": "Siyosiy xaritalar inqiloblar, urushlar va davlatlarning o‘zaro kelishuvlari asosida o‘zgarib, qayta tarkib topib turadi.", "qq": "Siyasiy kartalar revolyuciyalar, urıslar hám mámleketlerdiń óz ara kelisiwleri tiykarında ózgerip, qaytadan dúzilip turadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 113, "uz": "O‘rta Osiyo siyosiy xaritasining keyingi ikki asr davomidagi tarkib topishida bir necha bosqich ajratiladi: birinchi bosqich O‘rta Osiyoning Rossiya imperiyasi tomonidan bosib olinishi arafasidagi davrni o‘z ichiga oladi.", "qq": "Orta Aziya siyasiy kartasınıń keyingi eki ásir dawamındaǵı dúziliwin birneshe basqıshlarǵa bóliwge boladı: birinshi basqısh Or ta Aziyanıń Rossiya imperiyası tárepinen basıp alınıwı aldındaǵı dáwirdi óz ishine aladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 114, "uz": "Bu bosqichda O‘rta Osiyoda uchta yirik davlat — Qo‘qon xonligi, Xiva xonligi va Buxoro amirligi mavjud bo‘lgan.", "qq": "Bul basqıshta Orta Aziyada úsh iri mámleket—Qoqan xanlıǵı, Xiywa xanlıǵı hám Buxara ámirligi bolǵan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 115, "uz": "Ikkinchi bosqich mustamlakachilik davrini o‘z ichiga oladi.", "qq": "Ekinshi basqısh koloniyalıq dáwirdi óz ishine aladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 116, "uz": "Bu bosqichda O‘rta Osiyoda Rossiya imperiyasining Turkiston general-gubernatorligi hamda Rossiyaning yarimmustamlakalariga aylantirilgan Xiva xonligi va Buxoro amirligi joylashgan edi.", "qq": "Bul basqıshta Orta Aziya Rossiya imperiyasınıń Túrkstan general-gubernatorlıǵı hám de Rossiyanıń yarım koloniyalarına aylandırılǵan Xiywa xanlıǵı hám Buxara ámirligi jaylasqan edi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 117, "uz": "Uchinchi bosqich juda qisqa davrni (1917—1920/22) o‘z ichiga oladi.", "qq": "Úshinshi basqısh júdá qısqa dáwirdi (1917—1920/22) óz ishine aladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 118, "uz": "Bu bosqichda O‘rta Osiyoda uchta mustaqil davlat paydo bo‘ldi: Turkiston (Qo‘qon) muxtoriyati, Buxoro va Xorazm respublikalari.", "qq": "Bul basqıshta Orta Aziyada úsh ǵárezsiz mámleket payda boldı: Túrkstan (Qoqan) avtonomiyası, Buxara hám Xorezm respublikaları.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 119, "uz": "To‘rtinchi bosqich 1924—1991- yillarni o‘z ichiga oladi.", "qq": "Tórtinshi basqısh 1924—1991-jıllardı óz ishine qamtıydı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 120, "uz": "Bu davrda O‘rta Osiyo hududida 5 ta ittifoqdosh respublika tashkil qilindi: O‘zbekiston, Qozog‘iston, Qirg‘iziston, Tojikiston, Turkmaniston.", "qq": "Bul dáwirde Orta Aziya aymaǵında 5 awqamlas respublika dúzildi: Ózbekistan, Qazaqstan, Qırǵızstan, Tájikstan, Túrkmenstan.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 121, "uz": "O‘lkaning janubi Afg‘oniston va Eron davlatlari tarkibiga kiradi.", "qq": "Úlkeniń qublası Awǵanstan hám Iran mámleketleriniń quramına kiredi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 122, "uz": "Beshinchi bosqich 1991- yildan boshlanadi.", "qq": "Besinshi basqısh 1991-jıldan baslanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 123, "uz": "Bu davrda sobiq Ittifoqning parchalanishi oqibatida O‘rta Osiyo hududidagi ittifoqdosh respublikalar o‘rnida mustaqil davlatlar — O‘zbekiston, Qozog‘iston, Òojikiston, Òurkmaniston va Qirg‘iziston tashkil topdi.", "qq": "Bul dáwirde burınǵı Awqamnıń bólshekleniwi aqıbetinde Orta Aziya aymaǵındaǵı awqamlas respublikalar ornında ǵárezsiz mámleketler — Ózbekistan, Qazaqstan, Tájikstan, Túrkmenstan hám Qırǵızstan Respublikaları dúzildi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 124, "uz": "Geografiyani globus va dunyoning tabiiy xaritasisiz tasavvur qilish qiyin.", "qq": "Geografiyanı globus hám dúnyanıń tábiyiy kartasısız kóz aldıǵa keltiriw qıyın.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 125, "uz": "Globus Yerning modeli ekanini bilasiz.", "qq": "Globus jerdiń modeli ekenin bilesiz.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 126, "uz": "Globusda Yer yuzasi — quruqliklar, okeanlar, dengizlar, orollar sayyoramizda aslida qanday shaklda bo‘lsa, deyarli shunday shaklda, lekin juda kichraytirib tasvirlangan.", "qq": "Globusta Jer beti —qurǵaqlıqlar, okeanlar, teńizler, atawlar planetamızda tiykarınan qanday formada bolsa, derlik sonday formada, biraq júdá kishireytilip súwretlengen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 127, "uz": "Tabiatdagi obyektlar juda kichraytirib tasvirlanganda ko‘p narsalarni ko‘rsatish mumkin emas.", "qq": "Tábiyattaǵı obyektler júdá kishireytip súwretlengende kóp nárselerdi kórsetiw múmkin emes.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 128, "uz": "Shu sababli Yer yuzini, undagi geografik obyektlarni tasvirlash uchun geografik xaritalardan foydalaniladi.", "qq": "Sonlıqtan, Jer betin, ondaǵı geografiyalıq obyektlerdi súwretlew ushın geografiyalıq kartalardan paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 129, "uz": "Geografik xaritalar Yer yuzidagi geografik obyektlarni tasvirlashning asosiy usuli hisoblanadi.", "qq": "Geografiyalıq kartalar Jer betindegi geografiyalıq obyektlerdi súwretlewdiń tiykarǵı usılı bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 130, "uz": "Biroq geografik xaritalarda Yerning qavariq yuzasi tekis yuzada tasvirlanadi.", "qq": "Biraq geografiyalıq kartalarda jerdiń oylı-biyikli beti tegis túrinde súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 131, "uz": "Buning oqibatida geografik xaritada Yer qavariq yuzasining ayrim qismlarini cho‘zib, ayrim qismlarini qisqartirib tasvirlashga to‘g‘ri keladi.", "qq": "Usınıń nátiyjesinde geografiyalıq kartada Jer betiniń ayırım bóleklerin úlkeytińkirep, al ayırım bóleklerin qısqartıp súwretlewge tuwrı keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 132, "uz": "Qavariq Yer yuzasini tekis yuzada tasvirlash uchun xarita andazalaridan foydalaniladi.", "qq": "Oylı-biyikli Jer betin tegis bette súwretlew ushın karta úlgilerinen paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 133, "uz": "Xarita andazalari sayyoramizning qavariq yuzasini tekis yuzada tasvirlashning matematik usullaridir.", "qq": "Karta úlgileri planetamızdıń oylı-biyikli betin tegis bette súwretlewdiń matematikalıq usılları bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 134, "uz": "Yerning qavariq yuzasi tekis yuzaga tushirilayotganda tasvirda uzilishlar ro‘y beradi.", "qq": "Jerdiń oylı-biyikli beti tegis betke túsirilip atırǵanda súwrette úzilisler júz beredi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 135, "uz": "Uzilishlarni to‘ldirish uchun, odatda, xaritadagi tasvirlarni cho‘zishga to‘g‘ri keladi.", "qq": "Úzilislerdi toltırıw ushın ádette kartadaǵı súwretlerdi sozıwǵa tuwra keledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 136, "uz": "Buning oqibatida burchaklar, chiziqlar uzunligi, maydonlar, obyektlarning shaklida xatoliklarga yo‘l qo‘yiladi.", "qq": "Usınıń sebebinen múyeshler, sızıqlar uzınlıǵı, maydanları, obyektlerdiń formasında qáteliklerge jol qoyıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 137, "uz": "Yerning qavariq yuzasini tekis sathga — xaritaga tushirish chog‘ida ana shunday xatoliklardan birontasini kamaytirishga yoki yo‘qotishga harakat qilinadi.", "qq": "Jerdiń oylı-biyikli betin tegis jazıqlıqqa kartaǵa túsiriw waqtında mine usınday qáteliklerden birewin kemeytiwge yamasa saplastırıwǵa háreket etiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 138, "uz": "Shu maqsadda turli xil xarita andazalaridan foydalaniladi.", "qq": "Sol maqsette hár túrli karta úlgilerinen paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 139, "uz": "Xarita andazalari, asosan, uch xil bo‘ladi.", "qq": "Karta úlgileri tiykarınan úsh túrli boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 140, "uz": "Bunday andazalarda tuzilgan xaritalardagi burchaklar globusdagi, ya’ni joydagi burchaklarga teng bo‘ladi.", "qq": "Bunday úlgilerde dúzilgen kartalardaǵı múyeshler globustaǵı, yaǵnıy orındaǵı múyeshlerge teń boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 141, "uz": "Teng burchakli andazalar asosida tuzilgan xaritalarda yo‘nalishlarni aniqlash qulay, biroq maydonlar va masofalarni tasvirlashda xatolarga yo‘l qo‘yiladi.", "qq": "Teń múyeshli úlgiler tiykarında dúzilgen kartalarda baǵdarlardı anıqlaw qolay, biraq maydanlar hám aralıqlardı súwretlewde qátege jol qoyıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 142, "uz": "Teng maydonli yoki teng hajmli andazalardan foydalanilganda materiklar, davlatlar, dengizlar, orollar va boshqalarning maydonlari xatosiz tasvirlanadi.", "qq": "Teń maydanlı yamasa teń kólemli úlgilerden paydalanılǵanda materikler, mámleketler, teńizler, atawlar hám basqalardıń maydanları qátesiz súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 143, "uz": "Lekin burchaklar, shakllarni tasvirlashda ancha xatoliklarga yo‘l qo‘yiladi.", "qq": "Biraq múyeshler, formalardı súwretlewde ádewir qáteliklerge jol qoyıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 144, "uz": "Teng maydonli xaritalardan geografik obyektlar maydoni o‘lchanadi.", "qq": "Teń maydanlı kartalardan geografiyalıq obyektler maydanları ólshenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 145, "uz": "Ixtiyoriy andazalar asosida tuzilgan xaritalarda burchaklar ham, maydonlar ham xatoliklar bilan tasvirlanadi, lekin xatolik kamroq bo‘ladi.", "qq": "Erkin úlgiler tiykarında dúzilgen kartalarda múyeshler de, maydanlar da qátelikler menen súwretlenedi, biraq qátelik kemirek boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 146, "uz": "Ixtiyoriy andazalar orasida teng masofali andazalar boshqalaridan ko‘ra ko‘proq ishlatiladi.", "qq": "Erkin úlgiler arasında teń aralıqlı úlgiler basqalarına qaraǵanda kóbirek qollanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 147, "uz": "Bunday xaritalarda uzunlik masshtabi bir meridian (odatda, o‘rtadagi) yoki bir paralleldagina saqlanadi.", "qq": "Bunday kartalarda uzınlıq masshtabı bir meridian (ádette ortadaǵı) yamasa bir parallelde ǵana saqlanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 148, "uz": "Qavariq Yer yuzasining meridianlar va parallellar to‘rini tekis yuzaga (qog‘ozga) tushirishda yordamchi geometrik sirtlardan, xususan, silindr, konus, tekislik va boshqalardan foydalaniladi.", "qq": "Oylı-biyikli Jer betiniń meridianlar hám paralleller torın tegis betke (qaǵazǵa) túsiriwde járdemshi geometriyalıq betlerinen, ásirese cilindr, konus, tegislik hám basqalardan paydalanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 149, "uz": "Xarita andazalari foydalanilgan yordamchi geometrik sirtlarning turiga qarab konussimon, silindrsimon, azimutli andazalarga bo‘linadi.", "qq": "Karta úlgileri paydalanılǵan járdemshi geometriyalıq betlerdiń túrine qarap konus tárizli, cilindr tárizli, azimutlı úlgilerge bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 150, "uz": "Silindrsimon andazalarda tuzilgan xaritalarda meridianlar bilan parallellar bir-biri bilan 90° li burchak ostida kesishadigan to‘g‘ri chiziqlardan iborat to‘r hosil qiladi.", "qq": "Cilindr tárizli úlgilerde dúzilgen kartalarda meridianlar menen paralleller bir-biri menen 90o C lı múyesh jasap kesisetuǵın tuwrı sızıqlardan ibarat bolǵan tor payda etedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 151, "uz": "Bunday andazalar yordamida, ko‘pincha, dunyo xaritalari tuziladi.", "qq": "Bunday úlgiler járdeminde kóbinese dúnya júzilik kartalar islenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 152, "uz": "Materiklar, ayrim davlatlar, asosan, konussimon andaza yordamida tasvirlanadi.", "qq": "Materikler, ayırım mámleketler, tiykarınan, konus tárizli úlgi járdeminde kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 153, "uz": "O‘rta Osiyo va O‘zbekiston xaritalari konussimon andazadan foydalanib tuzilgan.", "qq": "Orta Aziya hám Ózbekistan kartaları konus tárizli úlgiden paydalanıp dúzilgen.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 154, "uz": "Geografik xaritalarda turli-tuman voqea va hodisalar tasvirlangani uchun ular juda xilma-xil bo‘ladi.", "qq": "Geografiyalıq kartalarda hár qıylı waqıya hám qubılıslar súwretlengenlikten olar júdá hár túrli boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 155, "uz": "Xaritalarni turlarga bo‘lishdan oldin ular to‘g‘risidagi umumiy tushunchalarni ko‘rib chiqamiz.", "qq": "Kartalardı túrlerge bólmesten burın olar haqqında ulıwma túsiniklerdi kórip shıǵamız.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 156, "uz": "Geografik xaritalarni yaxshi tushunish, ular bilan ishlashni bilish uchun joy plani, xarita, aerosurat, kosmosurat tushunchalari mazmunini yaxshi bilib olish kerak.", "qq": "Geografiyalıq kartalardı jaqsı túsiniw, paydalana biliw ushın orın jobası, karta, aerosúwret, kosmosúwret túsinikleriniń mazmunın jaqsı biliw kerek.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 157, "uz": "Joy plani — joyning yirik masshtabda (1:5000 va undan yirikroq) tuzilgan chizmasidir.", "qq": "Orın jobası—maydannıń úlken masshtabta (1:5000 hám onnanda úlkenirek) dúzilgen sızılması esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 158, "uz": "Planda maydoni uncha katta bo‘lmagan kichik-kichik joylar tasvirlanadi.", "qq": "Jobada maydanı onsha úlken bolmaǵan kishi orınlar kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 159, "uz": "Xarita — Yerning va boshqa sayyoralar yuzasining kichraytirilib va umumlashtirilib, shartli belgilar bilan tekis yuzaga tushirilgan tasviri.", "qq": "Karta—Jerdiń hám basqa planetalar betiniń kishireytilip hám ulıwmalastırılıp, shártli belgiler menen tegis betke túsirilgen kórinisi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 160, "uz": "Xaritalarda tabiiy va iqtisodiy-ijtimoiy voqea va hodisalar tasvirlanadi.", "qq": "Kartalarda tábiyiy hám ekonomikalıq-sociallıq waqıya hám qubılıslar súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 161, "uz": "Aerosurat — Yer yuzasi bir qismining samolyot va boshqa uchuvchi asboblar yordamida olingan tasviri.", "qq": "Aerosúwret — Jer beti bir bóliminiń samolyot hám basqa ushıwshı úskeneler járdeminde alınǵan kórinisi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 162, "uz": "Kosmosurat — Yerning va boshqa sayyoralarning kosmik kemalar yordamida olingan tasviri.", "qq": "Kosmosúwret — Jerdiń hám basqa planetalardıń kosmos kemeleri járdeminde alınǵan kórinisi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 163, "uz": "Ular fan va xalq xo‘jaligining turli sohalarida keng qo‘llaniladi.", "qq": "Olar ilim hám xalıq xojalıǵınıń túrli tarawlarında keń qollanıladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 164, "uz": "Har bir plan, xarita, aerosurat, kosmosurat ma’lum bir masshtabga ega bo‘ladi.", "qq": "Hárbir joba, kar ta, aerosúwret, kosmosúwret belgili bir masshtabqa iye boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 165, "uz": "Masshtabning nima ekanligini 5- sinf geografiyasidan eslang.", "qq": "Masshtab degenimiz ne ekenligin 5-klass geografiyasınan esińizge túsiriń.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 166, "uz": "Xaritalarning shartli belgilari.", "qq": "Kartalardıń shártli belgileri.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 167, "uz": "Voqea va hodisalar hamma xaritalarda ham ma’lum shartli belgilar bilan tasvirlanadi.", "qq": "Waqıya hám qubılıslar barlıq kartalarda da belgili bir shártli belgiler menen súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 168, "uz": "Shartli belgilar xaritalarni boshqa geografik ma’lumot manbalaridan, ya’ni aerosurat, kosmosurat, jadval va hokazolardan ajratib turadigan muhim xususiyatlardan biridir.", "qq": "Shártli belgiler kartalardı basqa geografiyalıq maǵlıwmatlar dereklerinen, yaǵnıy aerosúwret, kosmosúwret, keste hám taǵı basqalardan ajıratıp turatuǵın áhmiyetli ózgesheliklerdiń biri bolıp esaplanadı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 169, "uz": "Shartli belgilarga qarab, voqea va hodisalarning joylanishini, miqdorini, sifatini bilib olish mumkin.", "qq": "Shártli belgilerge qarap waqıya hám qubılıslardıń jaylasıwın, muǵdarın, sapasın bilip alıwǵa boladı.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 170, "uz": "Shartli belgilar bir necha turga bo‘linadi.", "qq": "Shártli belgiler birneshe túrge bólinedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 171, "uz": "Masshtabli shartli belgilar yordamida voqea va hodisalarning haqiqiy o‘lchamlari aks ettiriladi.", "qq": "Masshtablı shártli belgiler járdeminde waqıya hám qubılıslardıń haqıyqıy ólshemleri kórsetiledi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 172, "uz": "Ular yordamida qum cho‘llari egallagan maydonni, muz qoplagan yerlar maydonini bilish mumkin.", "qq": "Olar járdeminde, qum shólleri iyelegen maydandı, muz qaplaǵan jerlerdiń maydanın biliw múmkin.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 173, "uz": "Masshtabsiz shartli belgilar bilan xaritalarning masshtabida ko‘rsatib bo‘lmaydigan voqea va hodisalar tasvirlanadi.", "qq": "Masshtabsız shártli belgiler menen kartalardıń masshtabında kórsetip bolmaytuǵın waqıya hám qubılıslar súwretlenedi.", "sheet": "geografiya_darslik", "sheet_uz": "Geografiya darslik", "sheet_qq": "Geografiya darslik", "source": "Geografiya darsligi", "genre": "Darslik"}, {"id": 174, "uz": "Masalan, turli xil shakllar, chizmalar, harfli belgilar, aholi yashaydigan joylar, GESlar, foydali qazilma konlari belgilari masshtabsiz bo‘ladi.", "qq": "Mıs
