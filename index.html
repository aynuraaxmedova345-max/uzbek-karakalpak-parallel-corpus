tibor qaratildi.", "qq": "Ushırasıw dawamında zamanagóy yuridikalıq bilimlendiriwdi rawajlandırıw, studentlerdi xalıqaralıq tájiriybege tartıw, sonday-aq, bilimlendiriw hám ámeliyat integraciyasın kúsheytiw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 472, "uz": "So‘nggi vaqtlarda Qoraqalpoq davlat universiteti bilan chet elning bir qator universitetlari o‘rtasida ko‘p tomonlama hamkorlik bo‘yicha kelishuv va shartnomalar tuzilgan bo‘lib, universitetning xalqaro aloqalari yaxshi yo‘lga qo‘yilmoqda.", "qq": "Sońǵı waqıtları Qaraqalpaq mámleketlik unievrsiteti menen sırt eldiń bir qatar universitetleri ortasında kóp tárepleme birge islesiw boyınsha kelisim hám shártnamaları dúzilgen bolıp, universitettiń xalıqaralıq baylanısları jaqsı jolǵa qoyılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 473, "uz": "Yaqinda Qozog‘istondagi X.Do‘stmuhamedov nomidagi Atirau universiteti bilan ham ana shunday hamkorlik shartnomasi tuzilgan edi.", "qq": "Jaqında Qazaqstandaǵı X.Dosmuxamedov atındaǵı Atıraw universiteti menen de mine usınday birge islesiw shártnaması dúzilgen edi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 474, "uz": "Shunga asosan Qoraqalpoq filologiyasi va jurnalistika fakultetining Jurnalistika ta’lim yo‘nalishi 3-kurs talabasi Atagullaev Najimaddin Abilla o‘g‘li 2025/2026-o‘quv yilining bahorgi semestrini Atirau universitetida akademik mobillik o‘quv dasturi asosida o‘qishga yuborildi.", "qq": "Usıǵan tiykar Qaraqalpaq filologiyası hám jurnalistika fakultetiniń Jurnalistika tálim baǵdarınıń 3-kurs studenti Atagullaev Najimaddin Abılla ulı 2025/2026-oqıw jılınıń báhárgi semestrin Atıraw universitetinde akademik mobillik oqıw baǵdarlaması tiykarında oqıwǵa jiberildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 475, "uz": "Ayni paytda u jurnalistika mutaxassisligining ilmiy-nazariy bilimlari bilan bir qatorda amaliy mashg‘ulotlarni ham yuqori darajada bajarib, ustozlari berayotgan bilimlarni oqlab kelmoqda.", "qq": "Házirgi waqıtta ol jurnalistika qánigeliginiń ilimiy-teoriyalıq bilimleri menen bir qatarda ámeliy sabaqlardı da joqarı dárejede orınlap, ustazlarınıń berip atırǵan bilimlerin aqlap kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 476, "uz": "Shu bilan birga, Najimaddin Atirau universitetida o‘tkazilayotgan tadbirlarda faollik ko‘rsatish bilan bir qatorda, o‘sha mamlakatning mahalliy tilida olib boriladigan ommaviy axborot vositalarida amaliyot olib bormoqda.", "qq": "Sonıń menen birge, Najimaddin Atıraw universitetinde ótkerilip atırılǵan ilajlarda belsendilik kórsetiw menen bir qatarda, sol eldiń jergilikli tilinde alıp barılatuǵın ǵalaba xabar qurallarında ámeliyat alıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 477, "uz": "Qoraqalpog‘istonda qishloq xo‘jaligida suv resurslaridan samarali foydalanish borasida bir qator amaliy ishlar amalga oshirilishi belgilangan.", "qq": "Qaraqalpaqstanda awıl xojalıǵında suw resurslarınan maqsetli paydalanıw baǵdarında bir qatar ámeliy jumısları ámelge asırılıwı belgilengen.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 478, "uz": "Xususan, 81 milliard so‘m mablag‘ evaziga 44 kilometr yirik kanallar betonlashtirilishi ko‘zda tutilmoqda.", "qq": "Atap aytqanda, 81 milliard sum qarjı esabınan 44 kilometr iri kanallar betonlastırılıwı názerde tutılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 479, "uz": "Bundan tashqari, oqar suv yetkazib berishni yaxshilash borasida 2026-2027 yillarda har biri kamida 1 million dollar bo‘lgan jami 5 dona zemsnaryadlar olib kelinishi belgilanmoqda.", "qq": "Bunnan tısqarı, aǵın suw jetkerip beriliwin jaqsılaw baǵdarında 2026-2027-jıllarda hár biri keminde 1 million dollar bolǵan jámi 5 dana zemsnaryadlar alıp keliniwi belgilenbekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 480, "uz": "Shuni alohida ta’kidlash kerakki, bugungi kunda irrigatsiya obyektlarida jami 15 dona zemsnaryadlar ish olib borayotgan bo‘lib, yangi texnikalar olib kelinishi bilan ularning soni 20 donaga yetkaziladi.", "qq": "Sonı ayrıqsha aytıw kerek, búgingi kúnde irrigaciya obyektlerinde jámi 15 dana zemsnaryadlar jumıs alıp barıp atırǵan bolıp, jańa texnikalar alıp keliniwi menen olardıń sanı 20 danaǵa jetkeriledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 481, "uz": "Bu, o‘z navbatida, irrigatsiya obyektlarining suv o‘tkazish qobiliyatini yanada yaxshilashga xizmat qiladi.", "qq": "Bul óz náwbetinde, irrigaciya obyektleriniń suw ótkeriwsheńlik qábiletin jánede jaqsılawǵa xızmet etedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 482, "uz": "O‘zbekiston Respublikasi Oliy ta’lim, fan va innovatsiyalar vazirligining 2026-yil 16-yanvardagi 11-sonli qarori ijrosini ta’minlash maqsadida bugun, 16-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida \"Muhandislik va qurilish: innovatsiya, texnika va texnologiya, boshqa sohalar bilan integratsiyasi\" mavzusida respublika ilmiy-nazariy konferensiyasi bo‘lib o‘tdi.", "qq": "Ózbekstan Respublikası Joqarı bilimlendiriw, ilim hám innovaciyalar ministrliginiń ı hám ámeliy áhmiyeti hár tárepleme kórip shıǵıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 502, "uz": "Ta’kidlanganidek, mazkur hujjat universitetda ish beruvchi va xodimlar o‘rtasidagi mehnat munosabatlarini tartibga soluvchi muhim huquqiy asos hisoblanadi.", "qq": "Atap ótilgenindey, bul hújjet universitette jumıs beriwshi hám xızmetkerler arasındaǵı miynet qatnasıqların tártipke salıwshı áhmiyetli huqıqıy tiykar bolıp esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 503, "uz": "Shuningdek, unda xodimlarning ijtimoiy-iqtisodiy manfaatlarini himoya qilish, mehnat sharoitlarini yaxshilash, bandlikni ta’minlash va ijtimoiy kafolatlarni mustahkamlashga qaratilgan bir qator muhim bandlar o‘z ifodasini topgan.", "qq": "Sonday-aq, onda xızmetkerlerdiń sociallıq-ekonomikalıq máplerin qorǵaw, miynet sharayatların jaqsılaw, bántlikti támiyinlew hám sociallıq kepilliklerdi bekkemlewge qaratılǵan bir qatar áhmiyetli bántler óz kórinisin tapqan.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 504, "uz": "Jamoa shartnomasi xodimlar tomonidan o‘z vakillari orqali hamda ish beruvchi tomonidan o‘zaro kelishuv asosida tuziladigan huquqiy hujjat sifatida tashkilotda ijtimoiy hamkorlikni rivojlantirishda muhim o‘rin tutadi.", "qq": "Jámáát shártnaması xızmetkerler tárepinen óz wákilleri arqalı hám de jumıs beriwshi tárepinen óz-ara kelisim tiykarında dúziletuǵın huqıqıy hújjet sıpatında shólkemde sociallıq birge islesiwdi rawajlandırıwda áhmiyetli orın iyeleydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 505, "uz": "Muhokama jarayonida ishtirokchilar tomonidan hujjatning bandlarini yanada takomillashtirish, xodimlar manfa ymaqlıq sektorı baslıǵı T.Baekeev te qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 509, "uz": "Mehmonlar dastlab universitet rektori B.Jollibekov bilan uchrashib, o‘zaro hamkorlik istiqbollari bo‘yicha samimiy va mazmunli suhbatlashdi.", "qq": "Miymanlar dáslep universitet rektorı B.Jollıbekov penen ushırasıp, óz-ara birge islesiw perspektivaları boyınsha qızǵın hám mazmunlı sáwbetlesti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 510, "uz": "Uchrashuv davomida zamonaviy yuridik ta’limni rivojlantirish, talabalarni xalqaro tajribaga jalb etish, shuningdek, ta’lim va amaliyot integratsiyasini kuchaytirish masalalariga alohida e’tibor qaratildi.", "qq": "Ushırasıw dawamında zamanagóy yuridikalıq bilimlendiriwdi rawajlandırıw, studentlerdi xalıqaralıq tájiriybege tartıw, sonday-aq, bilimlendiriw hám ámeliyat integraciyasın kúsheytiw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 511, "uz": "So‘nggi vaqtlarda Qoraqalpoq davlat universiteti bilan chet elning bir qator universitetlari o‘rtasida ko‘p tomonlama hamkorlik bo‘yicha kelishuv va shartnomalar tuzilgan bo‘lib, universitetning xalqaro aloqalari yaxshi yo‘lga qo‘yilmoqda.", "qq": "Sońǵı waqıtları Qaraqalpaq mámleketlik unievrsiteti menen sırt eldiń bir qatar universitetleri ortasında kóp tárepleme birge islesiw boyınsha kelisim hám shártnamaları dúzilgen bolıp, universitettiń xalıqaralıq baylanısları jaqsı jolǵa qoyılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 512, "uz": "Yaqinda Qozog‘istondagi X.Do‘stmuhamedov nomidagi Atirau universiteti bilan ham ana shunday hamkorlik shartnomasi tuzilgan edi.", "qq": "Jaqında Qazaqstandaǵı X.Dosmuxamedov atındaǵı Atıraw universiteti menen de mine usınday birge islesiw shártnaması dúzilgen edi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 513, "uz": "Shunga asosan Qoraqalpoq filologiyasi va jurnalistika fakultetining Jurnalistika ta’lim yo‘nalishi 3-kurs talabasi Atagullaev Najimaddin Abilla o‘g‘li 2025/2026-o‘quv yilining bahorgi semestrini Atirau universitetida akademik mobillik o‘quv dasturi asosida o‘qishga yuborildi.", "qq": "Usıǵan tiykar Qaraqalpaq filologiyası hám jurnalistika fakultetiniń Jurnalistika tálim baǵdarınıń 3-kurs studenti Atagullaev Najimaddin Abılla ulı 2025/2026-oqıw jılınıń báhárgi semestrin Atıraw universitetinde akademik mobillik oqıw baǵdarlaması tiykarında oqıwǵa jiberildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 514, "uz": "Ayni paytda u jurnalistika mutaxassisligining ilmiy-nazariy bilimlari bilan bir qatorda amaliy mashg‘ulotlarni ham yuqori darajada bajarib, ustozlari berayotgan bilimlarni oqlab kelmoqda.", "qq": "Házirgi waqıtta ol jurnalistika qánigeliginiń ilimiy-teoriyalıq bilimleri menen bir qatarda ámeliy sabaqlardı da joqarı dárejede orınlap, ustazlarınıń berip atırǵan bilimlerin aqlap kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 515, "uz": "Shu bilan birga, Najimaddin Atirau universitetida o‘tkazilayotgan tadbirlarda faollik ko‘rsatish bilan bir qatorda, o‘sha mamlakatning mahalliy tilida olib boriladigan ommaviy axborot vositalarida amaliyot olib bormoqda.", "qq": "Sonıń menen birge, Najimaddin Atıraw universitetinde ótkerilip atırılǵan ilajlarda belsendilik kórsetiw menen bir qatarda, sol eldiń jergilikli tilinde alıp barılatuǵın ǵalaba xabar qurallarında ámeliyat alıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 516, "uz": "Bugun Berdaq nomidagi Qoraqalpoq davlat universitetida jinoyatchilik va huquqbuzarliklarning oldini olish, yoshlar o‘rtasida huquqiy madaniyatni oshirish va sog‘lom ijtimoiy muhitni shakllantirish yo‘nalishida amalga oshirilayotgan ishlar bilan yaqindan tanishtirish maqsadida keng ko‘lamli media-tur tashkil etildi.", "qq": "Búgin Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde jınayatshılıq hám huqıqbuzarlıqtıń aldın alıw, jaslar arasında huqıqıy mádeniyattı arttırıw hám salamat sociallıq ortalıqtı qáliplestiriw baǵdarında ámelge asırılıp atırǵan jumıslar menen jaqınnan tanıstırıw maqsetinde keń kólemli media-tur shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 517, "uz": "Tadbirda ommaviy axborot vositalari vakillari, universitet profilaktika inspektorlari, \"Qalqon\" jamoatchilik guruhi a’zolari faol ishtirok etdi.", "qq": "Ilajda ǵalaba xabar qurallarınıń wákilleri, universitet profilaktika inspektorları, \"Qalqan\" jámiyetshilik toparı aǵzaları belsene qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 518, "uz": "Media-tur davomida ishtirokchilarga universitetda jinoyatchilikning oldini olish bo‘yicha yo‘lga qo‘yilgan tizimli ishlar, profilaktik tadbirlar va oldindagi muhim vazifalar haqida batafsil ma’lumotlar berildi.", "qq": "Media-tur dawamında qatnasıwshılarǵa universitette jınayatshılıqtıń aldın alıw boyınsha jolǵa qoyılǵan sistemalı jumıslar, profilaktikalıq ilajlar hám aldaǵı áhmiyetli wazıypalar haqqında tolıq maǵlıwmatlar berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 519, "uz": "Tadbir avvalida mutaxassislar tomonidan bugungi kunda yoshlar o‘rtasida uchrashi mumkin bo‘lgan huquqbuzarliklarning sabablari, ularning oldini olish mexanizmlari, shuningdek, profilaktik ishlar samaradorligini oshirish bo‘yicha olib borilayotgan amaliy chora-tadbirlar haqida so‘z yuritildi.", "qq": "Ilaj aldınan qánigeler tárepinen búgingi kúnde jaslar arasında ushırasıwı múmkin bolǵan huqıqbuzarlıqlardıń sebepleri, olardıń aldın alıw mexanizmleri, sonday-aq, profilaktikalıq jumıslardıń nátiyjeliligin arttırıw boyınsha alıp barılıp atırǵan ámeliy ilajlar haqqında sóz etildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 520, "uz": "Ayniqsa, yoshlar ongida qonunlarga hurmat, fuqarolik mas’uliyati va huquqiy savodxonlikni shakllantirish masalalariga alohida e’tibor qaratildi.", "qq": "Ásirese, jaslardıń sanasında nızamlarǵa húrmet, puqaralıq juwapkershilik hám huqıqıy sawatlılıqtı qáliplestiriw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 521, "uz": "Media-tur doirasida universitetda tashkil etilgan \"Qalqon\" jamoatchilik guruhi a’zolari, psixologik xizmat xonalari va talaba-yoshlar bilan individual ishlash tizimi ishtirokchilarga tanishtirildi.", "qq": "Media-tur sheńberinde universitette shólkemlestirilgen \"Qalqan\" jámiyetshilik toparı aǵzaları, psixologiyalıq xızmet xanaları hám student-jaslar menen individual islesiw sisteması qatnasıwshılarǵa tanıstırıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 522, "uz": "O‘zbekiston Respublikasi Oliy ta’lim, fan va innovatsiyalar vazirligining 2026-yil 16-yanvardagi 11-sonli qarori ijrosini ta’minlash maqsadida bugun, 16-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida \"Muhandislik va qurilish: innovatsiya, texnika va texnologiya, boshqa sohalar bilan integratsiyasi\" mavzusida respublika ilmiy-nazariy konferensiyasi bo‘lib o‘tdi.", "qq": "Ózbekstan Respublikası Joqarı bilimlendiriw, ilim hám innovaciyalar ministrliginiń 2026-jıl 16-yanvardaǵı 11-sanlı qararınıń orınlanıwın támiyinlew maqsetinde búgin, 16-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde \"Injenerlik hám qurılıs: innovaciya, texnika hám texnologiya, basqa tarawlar menen integraciyası\" atamasında respublikalıq ilimiy-teoriyalıq konferenciyası bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 523, "uz": "Mazkur konferensiya muhandislik va qurilish sohalarida ilmiy izlanishlarni qo‘llab-quvvatlash, zamonaviy texnika va texnologiyalarni amaliyotga joriy etish, shuningdek, turli sohalar o‘rtasidagi integratsiyani kuchaytirish masalalariga bag‘ishlandi.", "qq": "Bul konferenciya injenerlik hám qurılıs tarawlarında ilimiy izleniwlerdi qollap-quwatlaw, zamanagóy texnika hám texnologiyalardı ámeliyatqa engiziw, sonday-aq, túrli tarawlar arasındaǵı integraciyanı kúsheytiw máselelerine baǵıshlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 524, "uz": "Tadbirda respublikamiz oliy o‘quv yurtlari, ilmiy-tadqiqot institutlarining olimlari, professor-o‘qituvchilari, mutaxassislar va talaba-yoshlar ishtirok etdi.", "qq": "Ilajda respublikamızdıń joqarı oqıw orınları, ilimiy-izertlew institutlarınıń ilimpazları, professor-oqıtıwshıları, qánigeler hám student-jaslar qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 525, "uz": "Konferensiyani universitetning ilmiy ishlar va innovatsiyalar bo‘yicha prorektori I.Turdimambetov ochib berdi.", "qq": "Konferenciyanı universitettiń ilimiy isler hám innovaciyalar boyınsha prorektorı I.Turdımambetov ashıp berdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 526, "uz": "U o‘z so‘zida bugungi kunda muhandislik va qurilish sohalarini rivojlantirishda ilm-fan yutuqlarini ishlab chiqarish bilan uyg‘unlashtirish, innovatsion texnologiyalarni keng joriy etish muhim ahamiyat kasb etishini ta’kidladi.", "qq": "Ol óz sózinde búgingi kúnde injenerlik hám qurılıs tarawların rawajlandırıwda ilim jetiskenliklerin óndiris penen úylestiriw, innovaciyalıq texnologiyalardı keńnen engiziw úlken áhmiyetke iye ekenin atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 527, "uz": "Joriy yilning 16-mart kuni Qoraqalpoq davlat universiteti o‘quv ishlari bo‘yicha proektor O.Duysenbayev va Fizika fakulteti professor-o‘qituvchilari bilan Mirzo Ulug‘bek nomidagi O‘zbekiston Milliy universiteti huzuridagi \"Yarimo‘tkazgichlar fizikasi va mikroelektronika\" ilmiy-tadqiqot instituti direktori, fizika-matematika fanlari doktori, professor Sharifa Utamuradova bilan o‘zaro hamkorlikni yanada takomillashtirish bo‘yicha muhim uchrashuv bo‘lib o‘tdi.", "qq": "Usı jıldıń 16-mart kúni Qaraqalpaq mámleketlik universiteti oqıw isleri boyınsha proektor O.Dúysenbaev hám Fizika fakulteti professor-oqıtıwshılar  menen Mırza Ulıǵbek atındaǵı Ózbekstan Milliy universiteti janındaǵı «Yarımótkizgishler fizikası hám mikroelektronika» ilimiy-izertlew institutı direktorı fizika-matematika ilimleri doktorı, professor Sharifa Utamuradova menen óz-ara birge islesiwdi elede jetilistiriw boyınsha áhmiyetli ushırasıw bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 528, "uz": "Uchrashuv davomida universitet va ilmiy-tadqiqot instituti o‘rtasida ilmiy va akademik hamkorlikni rivojlantirish masalalari ham muhokama qilindi.", "qq": "Ushırasıw barısında universitet hám ilimiy tekseriw institut arasında ilimiy hám akademiyalıq birge islesiwdi rawajlandırıw máseleleri de dodalandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 529, "uz": "Xususan, yarimo‘tkazgichlar fizikasi va quyosh energetikasi yo‘nalishlarida qo‘shma ilmiy loyihalarni amalga oshirish, ilmiy tadqiqotlar olib borish, seminar va konferensiyalar tashkil etish, shuningdek, mutaxassislar o‘rtasida tajriba almashishni yo‘lga qo‘yish bo‘yicha takliflar bildirildi.", "qq": "Atap aytqanda, yarımótkizgishler fizikası hám quyash energetikası baǵdarlarında qospa ilimiy joybarlardı ámelge asırıw, ilimiy izertlewler alıp barıw, seminar hám konferenciyalar shólkemlestiriw, sonday-aq, qánigeler arasında tájiriybe almasıwdı jolǵa qoyıw boyınsha usınıslar bildirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 530, "uz": "Shuningdek, professor Sh.Utamuradova Fizika fakulteti magistrant yoshlari bilan uchrashuv o‘tkazdi.", "qq": "Sonday-aq professor Sh.Utamuradova Fizika fakulteti magistrant jasları menen ushırasıw ótkerdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 531, "uz": "Uchrashuv davomida \"Yarimo‘tkazgichlar fizikasi va mikroelektronika\" ilmiy-tadqiqot institutida bugungi kunda olib borilayotgan ilmiy tadqiqot ishlari va institut miqyosidagi ilmiy laboratoriyalar bilan keng prezentatsiya ko‘rinishida tanishtirib o‘tdi.", "qq": "Ushırasıw dawamında «Yarımótkizgishler fizikası hám mikroelektronika» ilimiy-izertlew institutında búgingi kúni alıp barılıp atırǵan ilimiy izertlew jumıslar hám institut kólemindegi ilimiy laboratoriyalar menen keńnen prezentaciya kórnisinde tanıstırıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 532, "uz": "Bugun, 18-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida Innovatsion rivojlanish agentligi Qoraqalpog‘iston bo‘limi mutaxassislari E.Abdiganiyev, T.Polatbayev va “Akademik harakatchanlik”, tanlovi g‘olibi Sh.Saburovlar ishtirokida agentlik tomonidan e’lon qilingan “Akademik harakatchanlik”, \"Bo‘lajak olim\" va \"Olima ayollar\" tanlovlari bo‘yicha professor-o‘qituvchilar, doktorantlar va magistrantlar uchun seminar-trening tashkil etildi.", "qq": "Búgin, 18-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde Innovaciyalıq rawajlanıw agentligi Qaraqalpaqstan bólimi qánigeleri E.Abdiganiev, T.Polatbaev hám “Akademiyalıq háreketsheńlik” tańlawi jeńimpazi Sh.Saburovlar qatnasıwında agentlik tárepinen járiyalanǵan “Akademiyalıq háreketsheńlik”, “Bolajaq alım” hám “Ilimpaz hayallar” tańlawları boyınsha professor-oqıtıwshılar, doktorantlar hám magistrantlar ushın seminar-trening shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 533, "uz": "Seminar-treningni universitetning Ilmiy ishlar va innovatsiyalar bo‘yicha prorektori I.Turdimambetov olib bordi.", "qq": "Seminar-treningdi universitet Ilimiy isler hám innovaciyalar boyınsha prorektor I.Turdımambetov basqarıp bardı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 534, "uz": "Seminar-treningda professor-o‘qituvchilar, doktorantlar va magistrantlarning innovatsion fikrlashini rivojlantirish, “Akademik harakatchanlik”, “Bo‘lajak olim” va “Olima ayollar” tanlovlarida ishtirok etish tartiblari, ilmiy va startap loyihalarni shakllantirish masalalari, tanlovlarga loyiha hujjatlarini topshirish bosqichlari bo‘yicha amaliy bilim va ko‘nikmalarini oshirishga qaratilgan ma’lumotlar berildi.", "qq": "Seminar-treningde professor-oqıtıwshılar, doktorantlar hám magistrantlardıń innovaciyalıq pikirlewin rawajlandırıw, “Akademiyalıq háreketsheńlik”, “Bolajaq alım” hám “Ilimpaz hayallar” tańlawlarına qatnasıw tártipleri, ilimiy hám startap joybarların qáliplestiriw máseleleri, tańlawlarǵa joybar hújjetlerin tapsırıw basqıshları boyınsha ámeliy bilim hám kónlikpelerin arttırıwǵa qaratılǵan maǵlıwmatlar berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 535, "uz": "Seminar-trening davomida ishtirokchilar ilmiy va startap loyihalarini yaratish bosqichlaridagi muhim masalalar, o‘z g‘oyalarini taqdim etish, tajribali mentorlar bilan fikr almashish hamda o‘z loyihalarini amalga oshirish bo‘yicha o‘zlarini qiziqtirgan savollarga tegishli javoblarni oldilar.", "qq": "Seminar-trening dawamında qatnasıwshılar ilimiy hám startap joybarların jaratıw basqıshlarındaǵı áhmiyetli máseleler, óz ideyaların usınıw, tájiriybeli mentorlar menen pikir almasıw hám óz joybarların ámelge asırıw boyınsha sorawlarına tiyisli juwapların aldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 536, "uz": "Berdaq nomidagi Qoraqalpoq davlat universiteti San’at fakultetida 1-kurs talabalari ishtirokida \"Zamonaviy ayolning ko‘p qirraliligi va ko‘p vazifalari\" mavzusida seminar-trening tashkil etildi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Kórkem óner fakultetinde 1-kurs studentleri qatnasıwında \"Zamanagóy hayaldıń kóp qırlılıǵı hám kóp wazıypaları\" atamasında seminar-trening shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 537, "uz": "Tadbirning asosiy maqsadi - bugungi zamonaviy ayolning jamiyatdagi o‘rni, roli va qadr-qimmatini chuqurroq anglashga ko‘maklashishdan iborat bo‘ldi.", "qq": "Ilajdıń tiykarǵı maqseti - búgingi zamanagóy hayaldıń jámiyettegi ornı, roli hám qádir-qımbatın tereńirek ańlawǵa járdemlesiwden ibarat boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 538, "uz": "Seminar-trening pedagogika va psixologiya kafedrasi mudiri, dotsent A.Matchanov tashabbusi bilan o‘tkazildi.", "qq": "Seminar-trening pedagogika hám psixologiya kafedrası baslıǵı, docent A.Matchanov baslaması menen ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 539, "uz": "Unda kafedra professor-o‘qituvchilari N.Pirniyazova va G.Orazbayeva zamonaviy innovatsion yondashuvlar va maxsus amaliy mashg‘ulotlar orqali talabalarga muhim tushunchalarni yetkazdi.", "qq": "Onda kafedra professor-oqıtıwshıları N.Pirniyazova hám G.Orazbaeva zamanagóy innovaciyalıq qatnaslar hám arnawlı ámeliy shınıǵıwlar arqalı studentlerge áhmiyetli túsiniklerdi jetkerdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 540, "uz": "Mashg‘ulotlar davomida zamonaviy ayolning ko‘p qirrali shaxs sifatida turli rollarni muvaffaqiyatli uyg‘unlashtira olishi ta’kidlandi.", "qq": "Shınıǵıwlar dawamında zamanagóy hayal-qızdıń kóp qırlı shaxs sıpatında túrli rollerdi tabıslı úylestire alatuǵını atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 541, "uz": "Ya’ni, u nafaqat mehribon ona va sadoqatli umr yo‘ldoshi, balki o‘z ustida ishlaydigan professional, tashabbuskor tadbirkor, faol jamoat arbobi, sportchi va ijodkor inson sifatida namoyon bo‘lishi mumkinligi tushuntirildi.", "qq": "Yaǵnıy, ol tek ǵana mehriban ana hám sadıq ómirlik joldas emes, al óz ústinde isleytuǵın professional, intalı isbilermen, belsendi jámiyetlik ǵayratker, sportshı hám dóretiwshi insan sıpatında kóriniwi múmkin ekenligi túsindirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 542, "uz": "Mazkur seminar-trening talabalarda zamonaviy xotin-qizlarning ko‘p qirraliligini shakllantirish, ularning shaxsiy va kasbiy rivojlanishi uchun zarur bo‘lgan ko‘nikma va malakalarni rivojlantirish muhimligini yana bir bor ko‘rsatdi.", "qq": "Bul seminar-trening studentlerde zamanagóy hayal-qızlardıń kóp qırlılıǵın qáliplestiriw, olardıń jeke hám kásiplik rawajlanıwı ushın zárúr bolǵan kónlikpe hám uqıplılıqlardı rawajlandırıw áhmiyetli ekenligin jáne bir márte kórsetti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 543, "uz": "Talaba-yoshlar o‘rtasida diniy ekstremizmning oldini olish, millatlararo totuvlik va diniy bag‘rikenglikni targ‘ib qilish, shuningdek, qoraqalpoq milliy sport turlarini targ‘ib qilish maqsadida \"Qo‘l kurashi,\" \"Arqon tortish,\" \"Tosh ko‘tarish,\" \"Langi\" turlari bo‘yicha Jismoniy madaniyat fakulteti birinchiligi o‘tkazildi.", "qq": "Student-jaslar arasında diniy ekstremizmniń aldın alıw, milletlerara tatıwlıq hám diniy bawrıkeńlikti úgit-násiyatlaw, sonday-aq, qaraqalpaq milliy sport túrlerin úgit-násiyatlaw maqsetinde «Qol gúresi», «Arqan  tartıs», «Tas kóteriw», «Láńgi» túrleri boyınsha Dene mádeniyatı fakulteti birinshiligi ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 544, "uz": "Musobaqada fakultetdan jami 200 dan ortiq talaba-yoshlar (o‘g‘il bolalar va qizlar) ishtirok etdi. Musobaqa qizg‘in bahslarga boy bo‘lib, yoshlarning \"Qo‘l kurashi,\" \"Arqon tortish,\" \"Tosh ko‘tarish,\" \"Langi\" milliy sport turlariga bo‘lgan qiziqishi, ularning sport mahoratlari sinovdan o‘tkazildi.", "qq": "Jarısqa fakultetten jámi 200 den aslam student-jaslar (er balalar hám qızlar) qatnastı. Jarıs qızǵın bellesiwlerge bay bolıp, jaslardıń «Qol gúresi», «Arqan  tartıs», «Tas kóteriw», «Láńgi» milliy sport túrlerine bolǵan qızıǵıwshılıǵı, olardıń sport sheberlikleri sınaldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 545, "uz": "Musobaqaga tajribali sportchilar, jismoniy tarbiya nazariyasi va metodikasi kafedrasi professor-o‘qituvchilari hakamlik qildi.", "qq": "Jarısqa tájiriybeli sportshılar, dene mádeniyatı teoriyası hám metodikası kafedrası professor-oqıtıwshıları tóreshilik etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 546, "uz": "Musobaqa shartlari bo‘yicha hakamlar tomonidan adolatli baholanib, o‘g‘il bolalar o‘rtasidagi g‘oliblar va qizlar o‘rtasidagi g‘oliblar aniqlanib, birinchilikni qo‘lga kiritishga muvaffaq bo‘ldi.", "qq": "Jarıs shártleri boyınsha tóreshiler tárepinen ádil bahalanıp, er balalar arasındaǵı jeńimpazlar hám qızlar arasındaǵı jeńimpazlar anıqlanıp, birinshilikti jeńip alıwǵa miyasar boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 547, "uz": "Berdaq nomidagi Qoraqalpoq davlat universitetida mehnat jamoasi va kasaba uyushmasi qo‘mitasi o‘rtasida 2026/2028 yillarga mo‘ljallangan Jamoa shartnomasini muhokama qilishga bag‘ishlangan yig‘ilish bo‘lib o‘tdi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde miynet jámááti hám kásiplik awqamı komiteti arasında 2026/2028-jıllarǵa mólsherlengen Jámáát shártnamasın dodalawǵa baǵıshlanǵan májilis bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 548, "uz": "Unda Kasaba uyushmasi qo‘mitasi raisi A.Alliyarov va Kasaba uyushmasi qo‘mitasi a’zolari, shuningdek, universitet jamoasi vakillari faol ishtirok etdi.", "qq": "Onda Kásiplik awqamı komitetiniń baslıǵı A.Alliyarov hám Kásiplik awqamı komiteti aǵzaları, sonday-aq, universite hám de jumıs beriwshi tárepinen óz-ara kelisim tiykarında dúziletuǵın huqıqıy hújjet sıpatında shólkemde sociallıq birge islesiwdi rawajlandırıwda áhmiyetli orın iyeleydi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 553, "uz": "Muhokama jarayonida ishtirokchilar tomonidan hujjatning bandlarini yanada takomillashtirish, xodimlar manfaatlarini to‘liq qamrab olish bo‘yicha fikr-mulohazalar bildirildi.", "qq": "Dodalaw procesinde qatnasıwshılar tárepinen hújjettiń bántlerin bunnan bılay da jetilistiriw, xızmetkerlerdiń máplerin tolıq qamtıp alıw boyınsha pikir-usınıslar bildirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 554, "uz": "Berdaq nomidagi Qoraqalpoq davlat universitetida xalqaro hamkorlikni kengaytirish, yuridik ta’lim sifatini oshirish va talabalarning amaliy ko‘nikmalarini mustahkamlashga qaratilgan muhim uchrashuv bo‘lib o‘tdi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde xalıqaralıq birge islesiwdi keńeytiw, yuridikalıq bilimlendiriwdiń sapasın arttırıw hám studentlerdiń ámeliy kónlikpelerin bekkemlewge qaratılǵan áhmiyetli ushırasıw bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 555, "uz": "Shu asosda bugun universitetga Qozog‘iston Respublikasining \"ALC Attorneys\" yuridik konsalting tashkiloti raisi Farid Aliyev va uning sherigi Dana Janadil tashrif buyurdi.", "qq": "Usı tiykarda búgin universitetke Qazaqstan Respublikasınıń \"ALC Attorneys\" yuridikalıq konsalting shólkeminiń baslıǵı Farid Aliev hám onıń sherigi Dana Janadil keldi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 556, "uz": "Ushbu uchrashuvda Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesi Prezidiumi Raqa qaratilgan tadbir bo‘ldi.", "qq": "Búgin 21-mart kúni paytaxtımız Nókis qalası \"Doslıq\" kanalı boyında ótkerilgen ulıwma xalıqlıq teatrlastırılǵan bayram tamashaları barlıq miymanlardı qutlı báhár bayramı menen qutlıqlaw, olar ushın ózgeshe tásirler qaldırıwǵa qaratılǵan ilaj boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 583, "uz": "Bayram dasturi turli ko‘rgazmalar, san’at va konsert dasturlarini o‘z ichiga oldi.", "qq": "Bayram baǵdarlaması hár qıylı kórgizbeler, kórkem óner hám koncert baǵdarlamaların óz ishine aldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 584, "uz": "Ushbu bayram tadbirida Berdaq nomidagi Qoraqalpoq davlat universiteti rektori B.Jollibekov boshchiligida universitet jamoasi ham faol ishtirok etib, \"Do‘stlik\" kanali bo‘yida o‘zlarining milliy an’analari va madaniyatini aks ettirgan \"qora uylar\" barpo etdi.", "qq": "Usı bayram ilajında Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti rektorı B.Jollıbekov basshılıǵında universitet jámááti de belsene qatnasıp, \"Doslıq\" kanalı boyında óziniń milliy dástúrleri hám mádeniyatın sáwlelendirgen \"qara úyler\" tikti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 585, "uz": "Bu \"qora uylar\" nafaqat badiiy bezak, balki xalqimizning qadimiy turmush tarzi va qadriyatlarini o‘zida aks ettirdi.", "qq": "Bul \"qara úyler\" tek ǵana kórkem bezew emes, al xalqımızdıń áyyemgi turmıs tárizin hám qádiriyatların ózinde sáwlelendirdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 586, "uz": "Tiklangan \"qora uylar\" atrofida kelgan mehmonlarga o‘zbek, qoraqalpoq, qozoq, turkman va boshqa xalqlarning ko‘rgazmalari va hunarmandchilik buyumlari namoyish aslarımız bekkem awızbirshilikte, doslıq hám tatıwlıqta Watanımızdıń gúllep-jasnawı jolında xızmet etip, birgelikte jasap kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 605, "uz": "Bugungi kunda bayram tantanasi respublikamiz bo‘ylab keng davom etmoqda.", "qq": "Búgingi kúnde bayram saltanatı respublikamız boylap keń túrde dawam etpekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 606, "uz": "Aytib o‘tish kerak, qadrdonlikni, hurmat-izzatni toshirib yuboradigan diydorlashuvlar Navro‘zning bag‘rikenglik va ezgulik timsoli ekanining yana bir yorqin misoli bo‘la oladi.", "qq": "Aytıp ótiw kerek, qádirdanlıqtı hám húrmet-izzetti arttıratuǵın diydarlasıwlar Nawrızdıń keńpeyillik hám jaqsılıq tımsalı ekeniniń jáne bir ayqın mısalı bola aladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 607, "uz": "Navro‘zning dilbar kuyi yangrab, milliy liboslari bilan atrofga chiroy bergan yoshlar, oq fotihasi bilan doimo ularga to‘g‘ri yo‘lni ko‘rsatib turadigan nuroniylar, qadrli yurtdoshlarimiz mustahkam og‘izbirchilik bilan bayramni munosib nishonlamoqda.", "qq": "Nawrızdıń janǵa jaǵımlı naması shalınıp, milliy kiyimleri menen átirapqa sán bergen jaslar, aq pátiyası menen olarǵa tuwrı joldı kórsetetuǵın nuranıylar hám qádirli watanlaslarımız bekkem awızbirshilik penen bayramdı múnásip belgilemekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 608, "uz": "Joriy yilning 19-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida \"Payshanba - yoshlar kuni\" munosabati bilan \"Rektor va yoshlar\" uchrashuvi tashkil etildi.", "qq": "Usı jıldıń 19-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde «Piyshembi – jaslar kúni» múnásibeti menen \"Rektor hám jaslar\" ushırasıwı shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 609, "uz": "Ushbu uchrashuv universitetda tahsil olayotgan talaba-yoshlar bilan ochiq muloqot o‘rnatish, ularning fikr-mulohazalarini tinglash va yoshlarga oid dolzarb masalalarni muhokama qilishga qaratildi.", "qq": "Bul ushırasıw universitette bilim alıp atırǵan student-jaslar menen ashıqtan-ashıq sóylesiw ornatıw, olardıń pikir-usınısların tıńlaw hám jaslarǵa baylanıslı áhmiyetli máselelerdi dodalawǵa qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 610, "uz": "Tadbir davomida universitet rektori B.Jollibekov so‘zga chiqib, bugungi kunda mamlakatimizda yoshlar siyosatiga berilayotgan yuksak e’tibor, ta’lim tizimida amalga oshirilayotgan keng ko‘lamli islohotlarga to‘xtalib o‘tdi.", "qq": "Ilaj dawamında universitet rektorı B.Jollıbekov shıǵıp sóylep, búgingi kúnde mámleketimizde jaslar siyasatına berilip atırǵan joqarı itibar, bilimlendiriw sistemasında ámelge asırılıp atırǵan keń kólemli reformalarǵa toqtap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 611, "uz": "Shuningdek, talaba-yoshlarning zamonaviy bilim va ko‘nikmalarga ega bo‘lishi, xorijiy tillarni o‘rganishi, ilmiy faoliyat bilan shug‘ullanishi va o‘z ustida muntazam ishlashi zarurligini alohida ta’kidladi.", "qq": "Sonday-aq, student-jaslardıń zamanagóy bilim hám kónlikpelerge iye bolıwı, shet tillerin úyreniwi, ilimiy jumıs penen shuǵıllanıwı hám óz ústinde turaqlı islewi zárúrligin ayrıqsha atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 612, "uz": "Uchrashuv ochiq muloqot tarzida davom etib, talabalar o‘zlar  "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 620, "uz": "Shuningdek, xorijiy mutaxassis ishtirokidagi ushbu darslar kafedra professor-o‘qituvchilari uchun ham o‘zaro tajriba almashish va yangi pedagogik texnologiyalarni o‘zlashtirish maydoniga aylandi.", "qq": "Sonday-aq, sırt el qánigesiniń qatnasıwındaǵı bul sabaqlar kafedra professor-oqıtıwshıları ushın da óz-ara tájiriybe almasıw hám jańa pedagogikalıq texnologiyalardı ózlestiriw maydanına aylandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 621, "uz": "Qoraqalpoq davlat universiteti mustaqil izlanuvchisi Tajetdinov Muxamatdin Maxsutovichning 03.00.06-zoologiya mutaxassisligidan \"Ustyurt tekisligining Qoraqalpog‘iston bo‘limi Coleoptera turkumi dominant tur hasharotlarining bioekologik xususiyatlari\" mavzusidagi biologiya fanlari bo‘yicha falsafa doktori (PhD) dissertatsiya ishi himoyasi Qoraqalpoq davlat universiteti huzuridagi ilmiy darajalar beruvchi PhD.03/2025.27.12.B.04.09.M raqamli Ilmiy kengashning 2026-yil 27-mart kuni soat 10:00 dagi majlisida Qoraqalpoq davlat universiteti Axborot resurs markazining 3-qavatidagi konferensiya zalida bo‘lib o‘tadi.", "qq": "Qaraqalpaq mámleketlik universiteti mustaqil izleniwshisi Tajetdinov Muxamatdin Maxsutovichtıń 03.00.06-zoologiya qánigeliginen “Ustyurt tekisligining Qoraqalpog‘iston bo‘limi Coleoptera turkumi dominant tur hasharotlarining bioekologik xususiyatlari” atamasındaǵı biologiya ilimleri boyınsha filosofiya doktorı (PhD) dissertatsiya jumısın jaqlawı Qaraqalpaq mámleketlik universiteti janındaǵı ilimiy dárejeler beriwshi PhD.03/2025.27.12.B.04.09.M sanlı Ilimiy keńestiń 2026-jıl 27-mart kúni saat 10:00 daǵı májilisinde Qaraqalpaq mámleketlik universiteti Málimleme resurs orayınıń 3 qabatı konferentsiya xanasında bolıp ótedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 622, "uz": "Joriy yilning 19-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida doktorant, tayanch doktorant va stajyor-tadqiqotchilar uchun ilmiy-tadqiqot ishlarini samarali olib borish, ilmiy izlanishlar sifatini oshirish va yosh olimlarning ilmiy salohiyatini rivojlantirishga qaratilgan maxsus o‘quv kurslari tashkil etildi.", "qq": "Usı jıldıń 19-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde doktorant, tayanısh doktorant hám stajyor-izertlewshiler ushın ilimiy-izertlew jumısların nátiyjeli alıp barıw, ilimiy izleniwlerdiń sapasın arttırıw hám jas ilimpazlardıń ilimiy potencialın rawajlandırıwǵa qaratılǵan arnawlı oqıw kursları shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 623, "uz": "Ushbu o‘quv kurslarida universitetning ilmiy ishlar va innovatsiyalar bo‘yicha prorektori I.Turdimambetov, ilmiy tadqiqotlar, innovatsiyalar va ilmiy-pedagogik kadrlar tayyorlash bo‘limi boshlig‘i K.Nizamatdinov, doktorantura bo‘limi boshlig‘i J.Biyimbetov va iqtidorli talabalarning ilmiy-tadqiqot ishlarini tashkil etish bo‘limi boshlig‘i S.Pirniyazov ishtirok etib, yosh tadqiqotchilar bilan ilmiy faoliyatni tashkil etish masalalari bo‘yicha fikr almashdi.", "qq": "Bul oqıw kurslarında universitettiń ilimiy isler hám innovaciyalar boyınsha prorektorı I.Turdımambetov, ilimiy izertlewler, innovaciyalar hám ilimiy-pedagog kadrlar tayarlaw bólimi baslıǵı K.Nizamatdinov, doktorantura bóliminiń baslıǵı J.Biyimbetov hám ziyrek studentlerdiń ilimiy-izertlew jumısların shólkemlestiriw bólimi baslıǵı S.Pirniyazov qatnasıp, jas izertlewshiler menen ilimiy jumıstı shólkemlestiriw máseleleri boyınsha pikir alıstı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 624, "uz": "Tadbir davomida mamlakatimizda ilm-fan va innovatsion faoliyatni rivojlantirishga qara katimizda amalga oshirilayotgan huquqiy islohotlar, yoshlarning huquq va manfaatlarini himoya qilish borasida olib borilayotgan ishlar haqida batafsil ma’lumot berdi.", "qq": "Ushırasıw dawamında Ádillik ministri E.Tursunov shıǵıp sóylep, mámleketimizde ámelge asırılıp atırǵan huqıqıy reformalar, jaslardıń huqıqları menen máplerin qorǵaw baǵdarında alıp barılıp atırǵan jumıslar haqqında tolıq maǵlıwmat berdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 632, "uz": "Shuningdek, u talabalarga o‘z huquqlarini bilish, ulardan to‘g‘ri foydalanish va huquqbuzarliklarning oldini olishda faol fuqarolik pozitsiyasini egallash zarurligini tushuntirdi.", "qq": "Sonday-aq, ol studentlerge óz huqıqların biliw, olardan durıs paydalanıw hám huqıqbuzarlıqlardıń aldın alıwda belsendi puqaralıq poziciyasın iyelew zárúr ekenligin túsindirdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 633, "uz": "Xitoy Xalq Respublikasining Sinoway Forest kompaniyasi va Qoraqalpoq davlat universiteti o‘rtasida tuzilgan hamkorlik shartnomasi asosida Qoraqalpog‘iston Respublikasi hududidagi cho‘l zonalarini ko‘kalamzorlashtirish, ekologik muhitni yaxshilash va tabiiy resurslardan oqilona foydalanishga qaratilgan ilmiy tadqiqot ishlari olib borilmoqda.", "qq": "Qıtay Xalıq Respublikasınıń Sinoway Forest kompaniyası hám Qaraqalpaq mámleketlik universiteti arasında dúziligen birge islesiw shártnaması tiykarında Qaraqalpaqstan Respublikası aymaǵındaǵı shól zonaların kóklemzarlastırıw, ekologiyalıq ortalıqtı jaqsılaw hám tábiyiy resurslardan aqılǵa uǵras paydalanıwǵa qaratılǵan ilimiy izertlew jumısları alıp barılmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 634, "uz": "Xususan, Nukus shahri Beshtepa MFY hududida cho‘l zonasiga chidamli o‘simliklardan saksovul, qorabaroq va baliqko‘zning biogumus, torp va tuproq aralashmasi bilan tayyorlangan 18 mingdan ortiq urug‘i ekildi.", "qq": "Atap aytqanda, Nókis qalası Bestóbe MPJ aymaǵında shól zonasına shıdamlı ósimliklerden seksewil, qarabarqaq hám balıq kózdiń biogumus, torp hám topıraq aralaspası menen tayarlanǵan 18 mıńnan aslam tuqımı egildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 635, "uz": "Ekish ishlari joriy yilning yanvar oyidan boshlanib, mart oyida o‘z yakuniga yetkazildi.", "qq": "gis jumısları usı jıldıń yanvar ayınan baslanıp, mart ayında óz juwmaǵına jetkizildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 636, "uz": "Ekish ishlarida Biologiya fakulteti professor-o‘qituvchilari, tayanch doktorantlar, magistrantlar va talaba yoshlar faol ishtirok etdi.", "qq": "Egis jumıslarına Biologiya fakulteti professor oqıtıwshıları, tayanısh doktorantlar, magistrantlar hám student jaslar belsene qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 637, "uz": "Bunday tadqiqot ishlarining olib borilishi kelgusida Orolbo‘yi hududining boshqa cho‘l zonalarida o‘simlik qatlamlarini tashkil etish va ekologik muammolarni bartaraf etishga yordam beradigan ilmiy asos sifatida xizmat qiladi.", "qq": "Bunday izertlewler jumıslarınıń alıp barılıwı keleshekte Aral boyı aymaǵınıń basqa da shól zonalarında ósimlik qatlamların shólkemlestiriw hám ekologiyalıq mashqalalardı saplastırıwǵa járdem beretuǵın ilimiy tiykar sıpatında xızmet etedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 638, "uz": "\"Yoshlar kuni\" munosabati bilan Berdaq nomidagi Qoraqalpoq davlat universiteti Chet tillari fakulteti Tarjima nazariyasi va amaliyoti kafedrasi talabalari uchun tibbiy madaniyatni shakllantirish mavzusida uchrashuv tashkil etildi.", "qq": "\"Jaslar kúni\" múnásibeti menen Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Shet tilleri fakulteti Awdarma teoriyası hám ámeliyatı kafedrası studentleri ushın medicinalıq mádeniyattı qáliplestiriw atamasında ushırasıw shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 639, "uz": "Unda Sog‘liqni saqlash vazirligi Respublika o‘smirlar dispanserining shifokorlari - terapevt J.Sulaymonova, infeksionist J.Embergenova va filologiya fakultetining mediklari D.Jiyenbayeva va G.Urazimbetovalar ishtirok etdi.", "qq": "Onda Densawlıqtı saqlaw ministrligi Respublikalıq jas óspirimler dispanseriniń shıpakerleri - terapevt J.Sulaymanova, infekcionist J.Embergenova hám filologiya fakultetiniń medikleri D.Jiyenbaeva hám G.Urazımbetovalar qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 640, "uz": "Uchrashuv davomida mutaxassislar tomonidan \"Gripp va yuqori nafas yo‘llari kasalliklari,\" shuningdek, \"Sog‘lom turmush tarzi va to‘g‘ri ovqatlanish\" mavzularida batafsil ma’lumot berildi.", "qq": "Ushırasıw dawamında qánigeler tárepinen \"Gripp hám joqarı dem alıw jolları kesellikleri,\" sonday-aq, \"Salamat turmıs tárizi hám durıs awqatlanıw\" temalarında hár tárepleme maǵlıwmat berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 641, "uz": "Talabalarga mavsumiy kasalliklarning oldini olish, shaxsiy gigiyenaga rioya qilish va immunitetni mustahkamlashning ahamiyati tushuntirildi.", "qq": "Studentlerge máwsimlik keselliklerdiń aldın alıw, jeke gigienaǵa ámel etiw hám immunitetti bekkemlewdiń áhmiyeti túsindirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 642, "uz": "Tadbirning asosiy maqsadi yoshlar o‘rtasida tibbiy madaniyatni shakllantirish, sog‘lom turmush tarzini keng targ‘ib qilishdan iborat bo‘ldi.", "qq": "Ilajdıń tiykarǵı maqseti jaslar arasında medicinalıq mádeniyattı qáliplestiriw, salamat turmıs tárizin keńnen úgit-násiyatlawdan ibarat boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 643, "uz": "Shu bois, uchrashuvda to‘g‘ri ovqatlanish, jismoniy faollikni oshirish va muntazam tibbiy ko‘rikdan o‘tishning muhim jihatlari alohida ta’kidlandi.", "qq": "Sonlıqtan, ushırasıwda durıs awqatlanıw, fizikalıq belsendilikti arttırıw hám turaqlı medicinalıq tekseriwden ótiwdiń áhmiyetli tárepleri ayrıqsha atap ótildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 644, "uz": "Yoshlar kuni munosabati bilan Berdaq nomidagi Qoraqalpoq davlat universiteti Matematika fakultetida talaba-yoshlar o‘rtasida \"Zakovat\" intellektual o‘yini tashkil etildi.", "qq": "Jaslar kúni múnásibeti menen Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Matematika fakultetinde student-jaslar arasında \"Zakovat\" intellektuallıq oyını shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 645, "uz": "Ushbu tadbir yoshlarning bilim salohiyatini oshirish, ularning mantiqiy fikrlash qobiliyatini rivojlantirish va bo‘sh vaqtlarini mazmunli o‘tkazishga xizmat qildi.", "qq": "Bul ilaj jaslardıń bilim potencialın arttırıw, olardıń logikalıq pikirlew qábiletin rawajlandırıw hám bos waqıtların mazmunlı ótkeriwge xızmet etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 646, "uz": "Tadbirni fakultet dekani J.Seypullaev kirish so‘zi bilan ochib, ishtirokchi jamoalarga omad tiladi.", "qq": "Ilajdı fakultet dekanı J.Seypullaev kiris sóz benen ashıp, qatnasıwshı komandalarǵa áwmet tiledi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 647, "uz": "U o‘z nutqida bugungi kunda yoshlarning intellektual salohiyatini oshirish, ularni har tomonlama qo‘llab-quvvatlash dolzarb ahamiyatga ega ekanini alohida ta’kidladi.", "qq": "Ol óziniń shıǵıp sóylegen sózinde búgingi kúnde jaslardıń intellektuallıq potencialın arttırıw, olardı hár tárepleme qollap-quwatlaw úlken áhmiyetke iye ekenin ayrıqsha atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 648, "uz": "Qiziqarli va murosasiz kechgan bellashuvlar davomida jamoalar turli sohalarga oid savollarga javob berib, o‘z bilim va tafakkurlarini sinovdan o‘tkazdi.Ushbu intellektual o‘yin talaba-yoshlar o‘rtasida katta qiziqish uyg‘otib, ularning bilimga bo‘lgan intilishlarini yanada oshirishga xizmat qildi.", "qq": "Qızıqlı hám mawasasız ótken bellesiwler dawamında komandalar túrli tarawlarǵa baylanıslı sorawlarǵa juwap berip, óz bilim hám oy-pikirlerin sınaqtan ótkerdi. Bul intellektuallıq oyın student-jaslar arasında úlken qızıǵıwshılıq oyatıp, olardıń bilimge bolǵan umtılısların jáne de arttırıwǵa xızmet etti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 649, "uz": "Berdaq nomidagi Qoraqalpoq davlat universiteti Sanoat texnologiyasi fakultetida BMT tomonidan 2030 yilgacha bo‘lgan davrda barqaror rivojlanish sohasida belgilangan 17 ta maqsaddan kelib chiqib \"Innovatsion sanoat texnologiyalari orqali iqtisodiy barqarorlikni ta’minlash\" mavzusida ochiq muloqot o‘tkazildi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Sanaat texnologiyası fakultetinde BMSh tárepinen 2030-jılǵa shekemgi dáwirde turaqlı rawajlanıw tarawında belgilengen 17 maqsetinen kelip shıǵıp \"Innovaciyalıq sanaat texnologiyaları arqalı ekonomikalıq turaqlılıqtı támiyinlew\" temasında ashıq sáwbetlesiw ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 650, "uz": "Tadbirni fakultet dekani R.Qurbaniyazov ochib berdi.", "qq": "Ilajdı fakultet dekanı R.Qurbaniyazov ashıp berdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 651, "uz": "U o‘z so‘zida innovatsion sanoat texnologiyalari iqtisodiy barqarorlikni ta’minlashda strategik ahamiyatga ega ekanligini, ular ishlab chiqarish samaradorligini oshirish, resurslardan oqilona foydalanish, yangi ish o‘rinlari yaratish va eksport salohiyatini kuchaytirish orqali iqtisodiyotni yangi bosqichga olib chiqishini aytib o‘tdi.", "qq": "Ol óz sózinde innovaciyalıq sanaat texnologiyaları ekonomikalıq turaqlılıqtı támiyinlewde strategiyalıq áhmiyetke iye ekenligin, olar óndiris nátiyjeliligin arttırıw, resurslardan aqılǵa uǵras paydalanıw, jańa jumıs orınların jaratıw hám eksport potencialın kúsheytiw arqalı ekonomikanı jańa basqıshqa alıp shıǵatuǵınlıǵın aytıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 652, "uz": "Shuning uchun har bir davlat innovatsion rivojlanishni ustuvor yo‘nalish sifatida belgilab, bu sohada tizimli islohotlarni amalga oshirishi zarurligini ta’kidladi.", "qq": "Sonıń ushın hár bir mámleket innovaciyalıq rawajlanıwdı tiykarǵı baǵdar sıpatında belgilep, bul tarawda sistemalı reformalardı ámelge asırıwı zárúr ekenligin atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 653, "uz": "Tadbirning asosiy maqsadi - bu borada erishilayotgan natijalarni yoritish, ilg‘or tajribalarni targ‘ib qilish va huquqiy madaniyatni oshirishga qaratilgan tashabbuslarning mazmun-mohiyatini keng jamoatchilikka yetkazishdan iboratdir.", "qq": "Ilajdıń tiykarǵı maqseti - bul baǵdarda erisilip atırǵan nátiyjelerdi sáwlelendiriw, aldınǵı tájiriybelerdi úgit-násiyatlaw hám huqıqıy mádeniyattı arttırıwǵa qaratılǵan baslamalardıń mazmun-mánisin keń jámiyetshilikke jetkeriwden ibarat bolıp tabıladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 654, "uz": "Avval xabar berganimizdek, Berdaq nomidagi Qoraqalpoq davlat universitetida xalqaro hamkorlikni kengaytirish, yuridik ta’lim sifatini oshirish va talabalarning amaliy ko‘nikmalarini mustahkamlashga qaratilgan muhim uchrashuv o‘tkazilib, unda Qozog‘iston Respublikasining \"ALC Attorneys\" yuridik konsalting tashkiloti raisi Farid Aliyev va uning sherigi Dana Janadil mehmon bo‘ldi.", "qq": "Aldın xabar bergenimizdey, Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde xalıqaralıq birge islesiwdi keńeytiw, yuridikalıq bilimlendiriwdiń sapasın arttırıw hám studentlerdiń ámeliy kónlikpelerin bekkemlewge qaratılǵan áhmiyetli ushırasıw ótkerilip, onda Qazaqstan Respublikasınıń \"ALC Attorneys\" yuridikalıq konsalting shólkeminiń baslıǵı Farid Aliev hám onıń sherigi Dana Janadil miymanda boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 655, "uz": "Mehmonlar universitetning o‘quv ishlari bo‘yicha proektori O.Duysenbayev bilan birgalikda Yuridika fakultetida professor-o‘qituvchilar bilan uchrashib, suhbatlashdi.", "qq": "Miymanlar universitettiń oqıw isleri boyınsha proektorı O.Dúysenbaev penen birgelikte Yuridika fakultetinde professor-oqıtıwshılar menen ushırasıp, sáwbetlesti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 656, "uz": "Uchrashuvda zamonaviy yuridik ta’limni rivojlantirish, talabalarni xalqaro tajribaga jalb etish, shuningdek, ta’lim va amaliyot integratsiyasini kuchaytirish masalalariga alohida e’tibor qaratildi.", "qq": "Ushırasıwda zamanagóy yuridikalıq bilimlendiriwdi rawajlandırıw, studentlerdi xalıqaralıq tájiriybege tartıw, sonday-aq, bilimlendiriw hám ámeliyat integraciyasın kúsheytiw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 657, "uz": "Xususan, yuridik fakulteti talabalari va magistrantlari uchun xalqaro tajriba almashish dasturlarini yo‘lga qo‘yish, xorijlik tajribali yuristlarni universitetga jalb etib, ular tomonidan ma’ruza va seminarlar tashkil etish bo‘yicha fikr almashildi.", "qq": "Atap aytqanda yuridika fakulteti studentleri hám magistrantları ushın xalıqaralıq tájiriybe almasıw baǵdarlamaların jolǵa qoyıw, sırt elli tájiriybeli yuristlerdi universitetke tartıp, olar tárepinen lekciya hám seminarlar shólkemlestiriw boyınsha pikir alıstı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 658, "uz": "Bu tashabbuslar talabalarning nazariy bilimlarini amaliy ko‘nikmalar bilan uyg‘unlashtirish, ularni global huquqiy muhitga moslashuvchan va raqobatbardosh mutaxassislar sifatida tayyorlashda muhim ahamiyat kasb etadi.", "qq": "Bul baslamalar studentlerdiń teoriyalıq bilimlerin ámeliy kónlikpeler menen úylestiriw, olardı global huqıqıy ortalıqqa beyimlesiwsheń hám básekige shıdamlı qánigeler sıpatında tayarlawda ayrıqsha áhmiyetke iye.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 659, "uz": "Joriy yilning 18-mart kuni Berdaq nomidagi Qoraqalpoq davlat universiteti Xotin-qizlar maslahat kengashi tomonidan har yili o‘tkazilishi an’anaga aylangan \"Yangi O‘zbekistonning yangi davr qizlari\" shiori ostida \"Davr qizlari\" tanlovi bo‘lib o‘tdi.", "qq": "Usı jıldıń 18-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti Hayal-qızlar másláhát keńesi tárepinen shólkemlestirilgen hár jılı ótkeriliwi dástúrge aylanǵan \"Jańa Ózbekstannıń jańa dáwir qızları\" uranı astında \"Dáwir qızları\" tańlawı bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 660, "uz": "Tanlovda 15 ta fakultetning talaba qizlari ishtirok etib, ularning bilimi, odob-axloqi, ziyrakligi va chaqqonligi, sahnada o‘zini tutish madaniyati, qobiliyati sinovdan o‘tkazildi.", "qq": "Tańlawǵa 15 fakultettiń student qızları qatnasıp, olardıń bilimi, ádep-ikramlıǵı, ziyrekligi hám shaqqanlıǵı, saxnada ózin tutıw mádeniyatı, qábileti sınnan ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 661, "uz": "Tanlov to‘rt shartdan iborat bo‘lib, unda barcha jamoalar o‘z ta’lim yo‘nalishlaridan kelib chiqqan holda fakultetning xotin-qizlar hayotidagi yangiliklar, olima ustoz va talaba-qizlari haqida tomoshabinlarga faxr bilan she’r satrlari orqali keltirib, musiqiy chiqishlari va hazil-mutoyibalarini taqdim etdi.", "qq": "Tańlaw tórt shártten ibarat bolıp bunda barlıq komandalar ózleriniń tálim baǵdarlarınan kelip shıqqan halda fakultetiniń hayal-qızlar turmısındaǵı jańalıqlar, ilimpaz ustaz hám student-qızları haqqında tamashagóylerge maqtanısh etip qosıq qatarları arqalı keltirip, muzıkalı shıǵıwları hám házil-dálkeklerin usındı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 662, "uz": "E’tiborlisi, har bir jamoaning chiqishlarida o‘ziga xoslik, mamlakatimizda olib borilayotgan islohotlardan mamnunlik, millatlararo totuvlik, tinchlik va shukronalik tuyg‘ulari aks etgani barchaga o‘zgacha kayfiyat bag‘ishladi.", "qq": "Itibarlısı hár-bir komandanıń shıǵıwlarında ózine tánlik, elimizde alıp barılıp atırǵan reformalardan razılıq, milletleraralıq tatıwlıq, tınıshlıq hám shúkirshilik sezimleri sáwlelengenligi bárshege ózgeshe keypiyat baǵıshladı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 663, "uz": "Bugungi kunda mamlakatimizda yoshlar bandligini ta’minlash eng dolzarb masala hisoblanadi.", "qq": "Búgingi kúni elimizde jaslardın bántligin támiyinlew eń áhmiyetli másele esaplanadı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 664, "uz": "Biologiya fakulteti kafedralarining 2026-yilgi Yo‘l xaritasida \"Ish beruvchilar bilan doimiy hamkorlik\" masalasi o‘rin olgan bo‘lib, bu masala bo‘yicha quyidagi ishlar qilindi.", "qq": "Biologiya fakulteti kafedralarınıń 2026-jılǵı Jol kartasında «Jumıs beriwshiler menen turaqlı birge islesiw» máselesi orın alǵan bolıp bul másele boyınsha tómendegi jumıslar islendi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 665, "uz": "2026-yilning 18-mart kuni Biologiya fakultetining majlislar zalida Respublikamizning ish beruvchi yirik korxonalaridan mutaxassislar kelib bitiruvchilar bilan uchrashuv kechasi o‘tkazildi.", "qq": "2026-jıldıń 18-mart kúni Biologiya fakultetiniń májilisler zalında Respublikamızdıń jumıs beriwshi iri kárxanalarınan qánigeler kelip pitkeriwshiler menen ushırasıw keshesi ótkerildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 666, "uz": "Uchrashuvni fakultet dekani, biologiya fanlari doktori, professor Muratbay Jumanov olib bordi.", "qq": "Ushırasıwdı fakultet dekanı, biologiya ilimleri doktorı, professor Muratbay Jumanov alıp bardı.", "sheet": "xabarlar", "sh a ixtisosligi bo‘yicha “Qoraqalpog‘iston Respublikasida jinoyatchilikning geografik jihatlari” mavzusidagi geografiya fanlari bo‘yicha falsafa doktori (PhD) dissertatsiya himoyasi ilmiy darajasini Qoraqalpoq davlat universiteti  huzuridagi PhD.03/2025.27.12.Gr.04.11 raqamli Ilmiy kengash Ilmiy kengashning 2026-yil 24-mart kuni soat 10:00da majlisi Qoraqalpoq davlat universiteti Axborot resurs markazining 3 qavatidagi konferentsiya xonasida o‘tkaziladi.", "qq": "Qaraqalpaq mámleketlik universiteti erkin izleniwshisi Urazimbetova Yulduzxan Xaydarovnaningnıń 11.00.02–Ekonomikalıq hám sociallıq geografiya qánigeliginen “Qoraqalpog‘iston Respublikasida jinoyatchilikning geografik jihatlari” temasındaǵı geografiya ilimleri boyınsha filosofiya doktorı (PhD) dissertaciya jumısın jaqlawı Qaraqalpaq mámleketlik universiteti janındaǵı ilimiy dárejeler beriwshi PhD.03/2025.27.12.Gr.04.11 sanlı Ilimiy keńestiń 2026-jıl 14-mart kúni saat 10:00degi májilisinde Qaraqalpaq mámleketlik universiteti Málimleme resurs orayınıń 3 qabatı konferenciya xanasında bolıp ótedi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 670, "uz": "\"Yoshlar kuni\" munosabati bilan Berdaq nomidagi Qoraqalpoq davlat universiteti rektori B.Jollibekov universitetning Chimboy fakulteti talaba-yoshlari bilan uchrashuv o‘tkazdi.", "qq": "\"Jaslar kúni\" múnásibeti menen Berdaq atındaǵı Qaraqalpaq mámleketlik universiteti rektorı B.Jollıbekov universitettiń Shımbay fakulteti student-jasları menen ushırasıw ótkerdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 671, "uz": "Unda yoshlarning ta’lim jarayonidagi faolligi, ularning fikr va tashabbuslari alohida e’tiborga olindi.", "qq": "Onda jaslardıń bilimlendiriw procesindegi belsendiligi, olardıń pikir hám baslamaları ayrıqsha itibarǵa alındı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 672, "uz": "Dastlab rektor B.Jollibekov so‘zga chiqib, oliy ta’lim tizimida amalga oshirilayotgan keng ko‘lamli islohotlar, ta’lim sifatini oshirish, ilmiy faoliyatni rivojlantirish va talabalar uchun yaratilayotgan zamonaviy sharoitlar haqida batafsil to‘xtalib o‘tdi.", "qq": "Dáslep rektor B.Jollıbekov shıǵıp sóylep, joqarı bilimlendiriw sistemasında ámelge asırılıp atırǵan keń kólemli reformalar, bilimlendiriwdiń sapasın arttırıw, ilimiy jumıstı rawajlandırıw hám studentler ushın jaratılıp atırǵan zamanagóy sharayatlar haqqında hár tárepleme toqtap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 673, "uz": "Shuningdek, u yoshlarning bilim olishga bo‘lgan intilishi va izlanishi jamiyatimiz taraqqiyotining muhim omillaridan biri ekanini alohida ta’kidladi.", "qq": "Sonday-aq, ol jaslardıń bilim alıwǵa bolǵan umtılısı hám izleniwi jáiyetimizdiń rawajlanıwınıń áhmiyetli faktorlarınan biri ekenin ayrıqsha atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 674, "uz": "Uchrashuv davomida rektor talaba-yoshlarning fikr-mulohazalari diqqat bilan tinglandi.", "qq": "Ushırasıw dawamında rektor student-jaslardıń pikir-usınısları dıqqat penen tıńlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 675, "uz": "Ochiq muloqot tarzida o‘tgan suhbat yoshlar uchun o‘z fikrlarini erkin ifoda etish, dolzarb masalalarni muhokama qilish va kelgusi rejalar bo‘yicha takliflar bildirish imkonini yaratdi.", "qq": "Ashıqtan-ashıq sóylesiw tárizinde ótken sáwbet jaslar ushın óz pikirlerin erkin bildiriw, áhmiyetli máselelerdi dodalaw hám keleshektegi rejeler boyınsha usınıslar bildiriw imkaniyatın jarattı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 676, "uz": "Ushbu uchrashuv yoshlar bilan muloqotni mustahkamlash, ularning intilishlarini qo‘llab-quvvatlash va universitet hayotida faol ishtirokini ta’minlash yo‘lida muhim qadam bo‘ldi.", "qq": "Bul ushırasıw jaslar menen pikirlesiwdi bekkemlew, olardıń umtılısların qollap-quwatlaw hám universitet turmısında belsene qatnasıwın támiyinlew jolında áhmiyetli qádem boldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 677, "uz": "Berdaq nomidagi Qoraqalpoq davlat universitetida xalqaro hamkorlikni kengaytirish, yuridik ta’lim sifatini oshirish va talabalarning amaliy ko‘nikmalarini mustahkamlashga qaratilgan muhim uchrashuv bo‘lib o‘tdi.", "qq": "Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde xalıqaralıq birge islesiwdi keńeytiw, yuridikalıq bilimlendiriwdiń sapasın arttırıw hám studentlerdiń ámeliy kónlikpelerin bekkemlewge qaratılǵan áhmiyetli ushırasıw bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 678, "uz": "Shu asosda bugun universitetga Qozog‘iston Respublikasining \"ALC Attorneys\" yuridik konsalting tashkiloti raisi Farid Aliyev va uning sherigi Dana Janadil tashrif buyurdi.", "qq": "Usı tiykarda búgin universitetke Qazaqstan Respublikasınıń \"ALC Attorneys\" yuridikalıq konsalting shólkeminiń baslıǵı Farid Aliev hám onıń sherigi Dana Janadil keldi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 679, "uz": "Ushbu uchrashuvda Qoraqalpog‘iston Respublikasi Jo‘qorg‘i Kengesi Prezidiumi Raqamlashtirish va sun’iy intellekt texnologiyalari sektori boshlig‘i Q.Seytnazarov, shuningdek, Raqamli texnologiyalar vazirligining Qoraqalpog‘iston hududiy sektori boshlig‘i T.Baekeev ham ishtirok etd abarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 683, "uz": "Yaqinda Qozog‘istondagi X.Do‘stmuhamedov nomidagi Atirau universiteti bilan ham ana shunday hamkorlik shartnomasi tuzilgan edi.", "qq": "Jaqında Qazaqstandaǵı X.Dosmuxamedov atındaǵı Atıraw universiteti menen de mine usınday birge islesiw shártnaması dúzilgen edi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 684, "uz": "Shunga asosan Qoraqalpoq filologiyasi va jurnalistika fakultetining Jurnalistika ta’lim yo‘nalishi 3-kurs talabasi Atagullaev Najimaddin Abilla o‘g‘li 2025/2026-o‘quv yilining bahorgi semestrini Atirau universitetida akademik mobillik o‘quv dasturi asosida o‘qishga yuborildi.", "qq": "Usıǵan tiykar Qaraqalpaq filologiyası hám jurnalistika fakultetiniń Jurnalistika tálim baǵdarınıń 3-kurs studenti Atagullaev Najimaddin Abılla ulı 2025/2026-oqıw jılınıń báhárgi semestrin Atıraw universitetinde akademik mobillik oqıw baǵdarlaması tiykarında oqıwǵa jiberildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 685, "uz": "Ayni paytda u jurnalistika mutaxassisligining ilmiy-nazariy bilimlari bilan bir qatorda amaliy mashg‘ulotlarni ham yuqori darajada bajarib, ustozlari berayotgan bilimlarni oqlab kelmoqda.", "qq": "Házirgi waqıtta ol jurnalistika qánigeliginiń ilimiy-teoriyalıq bilimleri menen bir qatarda ámeliy sabaqlardı da joqarı dárejede orınlap, ustazlarınıń berip atırǵan bilimlerin aqlap kelmekte.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 686, "uz": "Shu bilan birga, Najimaddin Atirau universitetida o‘tkazilayotgan tadbirlarda faollik ko‘rsatish bilan bir qatorda, o‘sha mamlakatning mahalliy tilida olib boriladigan ommaviy axborot vositalarida amaliyot olib bormoqda.", "qq": "Sonıń menen birge, Najimaddin Atıraw universitetinde ótkerilip atırılǵan ilajlarda belsendilik kórsetiw menen bir qatarda, sol eldiń jergilikli tilinde alıp barılatuǵın ǵalaba xabar qurallarında ámeliyat alıp barmaqta.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 687, "uz": "Bugun Berdaq nomidagi Qoraqalpoq davlat universitetida jinoyatchilik va huquqbuzarliklarning oldini olish, yoshlar o‘rtasida huquqiy madaniyatni oshirish va sog‘lom ijtimoiy muhitni shakllantirish yo‘nalishida amalga oshirilayotgan ishlar bilan yaqindan tanishtirish maqsadida keng ko‘lamli media-tur tashkil etildi.", "qq": "Búgin Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde jınayatshılıq hám huqıqbuzarlıqtıń aldın alıw, jaslar arasında huqıqıy mádeniyattı arttırıw hám salamat sociallıq ortalıqtı qáliplestiriw baǵdarında ámelge asırılıp atırǵan jumıslar menen jaqınnan tanıstırıw maqsetinde keń kólemli media-tur shólkemlestirildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 688, "uz": "Tadbirda ommaviy axborot vositalari vakillari, universitet profilaktika inspektorlari, \"Qalqon\" jamoatchilik guruhi a’zolari faol ishtirok etdi.", "qq": "Ilajda ǵalaba xabar qurallarınıń wákilleri, universitet profilaktika inspektorları, \"Qalqan\" jámiyetshilik toparı aǵzaları belsene qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 689, "uz": "Media-tur davomida ishtirokchilarga universitetda jinoyatchilikning oldini olish bo‘yicha yo‘lga qo‘yilgan tizimli ishlar, profilaktik tadbirlar va oldindagi muhim vazifalar haqida batafsil ma’lumotlar berildi.", "qq": "Media-tur dawamında qatnasıwshılarǵa universitette jınayatshılıqtıń aldın alıw boyınsha jolǵa qoyılǵan sistemalı jumıslar, profilaktikalıq ilajlar hám aldaǵı áhmiyetli wazıypalar haqqında tolıq maǵlıwmatlar berildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 690, "uz": "Tadbir avvalida mutaxassislar tomonidan bugungi kunda yoshlar o‘rtasida uchrashi mumkin bo‘lgan huquqbuzarliklarning sabablari, ularning oldini olish mexanizmlari, shuningdek, profilaktik ishlar samaradorligini oshirish bo‘yicha olib borilayotgan amaliy chora-tadbirlar haqida so‘z yuritildi.", "qq": "Ilaj aldınan qánigeler tárepinen búgingi kúnde jaslar arasında ushırasıwı múmkin bolǵan huqıqbuzarlıqlardıń sebepleri, olardıń aldın alıw mexanizmleri, sonday-aq, profilaktikalıq jumıslardıń nátiyjeliligin arttırıw boyınsha alıp barılıp atırǵan ámeliy ilajlar haqqında sóz etildi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 691, "uz": "Ayniqsa, yoshlar ongida qonunlarga hurmat, fuqarolik mas’uliyati va huquqiy savodxonlikni shakllantirish masalalariga alohida e’tibor qaratildi.", "qq": "Ásirese, jaslardıń sanasında nızamlarǵa húrmet, puqaralıq juwapkershilik hám huqıqıy sawatlılıqtı qáliplestiriw máselelerine ayrıqsha itibar qaratıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 692, "uz": "Media-tur doirasida universitetda tashkil etilgan \"Qalqon\" jamoatchilik guruhi a’zolari, psixologik xizmat xonalari va talaba-yoshlar bilan individual ishlash tizimi ishtirokchilarga tanishtirildi.", "qq": "Media-tur sheńberinde universitette shólkemlestirilgen \"Qalqan\" jámiyetshilik toparı aǵzaları, psixologiyalıq xızmet xanaları hám student-jaslar menen individual islesiw sisteması qatnasıwshılarǵa tanıstırıldı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 693, "uz": "O‘zbekiston Respublikasi Oliy ta’lim, fan va innovatsiyalar vazirligining 2026-yil 16-yanvardagi 11-sonli qarori ijrosini ta’minlash maqsadida bugun, 16-mart kuni Berdaq nomidagi Qoraqalpoq davlat universitetida \"Muhandislik va qurilish: innovatsiya, texnika va texnologiya, boshqa sohalar bilan integratsiyasi\" mavzusida respublika ilmiy-nazariy konferensiyasi bo‘lib o‘tdi.", "qq": "Ózbekstan Respublikası Joqarı bilimlendiriw, ilim hám innovaciyalar ministrliginiń 2026-jıl 16-yanvardaǵı 11-sanlı qararınıń orınlanıwın támiyinlew maqsetinde búgin, 16-mart kúni Berdaq atındaǵı Qaraqalpaq mámleketlik universitetinde \"Injenerlik hám qurılıs: innovaciya, texnika hám texnologiya, basqa tarawlar menen integraciyası\" atamasında respublikalıq ilimiy-teoriyalıq konferenciyası bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 694, "uz": "Mazkur konferensiya muhandislik va qurilish sohalarida ilmiy izlanishlarni qo‘llab-quvvatlash, zamonaviy texnika va texnologiyalarni amaliyotga joriy etish, shuningdek, turli sohalar o‘rtasidagi integratsiyani kuchaytirish masalalariga bag‘ishlandi.", "qq": "Bul konferenciya injenerlik hám qurılıs tarawlarında ilimiy izleniwlerdi qollap-quwatlaw, zamanagóy texnika hám texnologiyalardı ámeliyatqa engiziw, sonday-aq, túrli tarawlar arasındaǵı integraciyanı kúsheytiw máselelerine baǵıshlandı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 695, "uz": "Tadbirda respublikamiz oliy o‘quv yurtlari, ilmiy-tadqiqot institutlarining olimlari, professor-o‘qituvchilari, mutaxassislar va talaba-yoshlar ishtirok etdi.", "qq": "Ilajda respublikamızdıń joqarı oqıw orınları, ilimiy-izertlew institutlarınıń ilimpazları, professor-oqıtıwshıları, qánigeler hám student-jaslar qatnastı.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 696, "uz": "Konferensiyani universitetning ilmiy ishlar va innovatsiyalar bo‘yicha prorektori I.Turdimambetov ochib berdi.", "qq": "Konferenciyanı universitettiń ilimiy isler hám innovaciyalar boyınsha prorektorı I.Turdımambetov ashıp berdi.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 697, "uz": "U o‘z so‘zida bugungi kunda muhandislik va qurilish sohalarini rivojlantirishda ilm-fan yutuqlarini ishlab chiqarish bilan uyg‘unlashtirish, innovatsion texnologiyalarni keng joriy etish muhim ahamiyat kasb etishini ta’kidladi.", "qq": "Ol óz sózinde búgingi kúnde injenerlik hám qurılıs tarawların rawajlandırıwda ilim jetiskenliklerin óndiris penen úylestiriw, innovaciyalıq texnologiyalardı keńnen engiziw úlken áhmiyetke iye ekenin atap ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 698, "uz": "Joriy yilning 16-mart kuni Qoraqalpoq davlat universiteti o‘quv ishlari bo‘yicha proektor O.Duysenbayev va Fizika fakulteti professor-o‘qituvchilari bilan Mirzo Ulug‘bek nomidagi O‘zbekiston Milliy universiteti huzuridagi \"Yarimo‘tkazgichlar fizikasi va mikroelektronika\" ilmiy-tadqiqot instituti direktori, fizika-matematika fanlari doktori, professor Sharifa Utamuradova bilan o‘zaro hamkorlikni yanada takomillashtirish bo‘yicha muhim uchrashuv bo‘lib o‘tdi.", "qq": "Usı jıldıń 16-mart kúni Qaraqalpaq mámleketlik universiteti oqıw isleri boyınsha proektor O.Dúysenbaev hám Fizika fakulteti professor-oqıtıwshılar  menen Mırza Ulıǵbek atındaǵı Ózbekstan Milliy universiteti janındaǵı «Yarımótkizgishler fizikası hám mikroelektronika» ilimiy-izertlew institutı direktorı fizika-matematika ilimleri doktorı, professor Sharifa Utamuradova menen óz-ara birge islesiwdi elede jetilistiriw boyınsha áhmiyetli ushırasıw bolıp ótti.", "sheet": "xabarlar", "sheet_uz": "Xabarlar", "sheet_qq": "Xabarlar", "source": "kk.news / @kanlikulnews", "genre": "Xabar"}, {"id": 699, "uz": "Uchr
