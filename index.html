function cols() {
  return lang === "uz"
    ? {leftKey:"uz", rightKey:"qq", leftLabel:UI.uz.left, rightLabel:UI.uz.right}
    : {leftKey:"qq", rightKey:"uz", leftLabel:UI.qq.left, rightLabel:UI.qq.right};
}

function allRows() {
  const sel = els.sheetSelect.value || "all";
  let rows = [];
  SHEETS.forEach(sheet => {
    if (sel === "all" || sel === sheet.name) {
      sheet.rows.forEach((r, i) => rows.push({...r, __sheet: sheet.name, __i: i + 1}));
    }
  });
  return rows;
}

function escapeRegExp(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function makeRegex(q, mode) {
  q = (q || "").trim().toLowerCase();
  if (!q) return null;

  if (mode === "exact") {
    return new RegExp("(^|[^A-Za-zÀ-ÿĀ-žʻʼ’0-9_])(" + escapeRegExp(q) + ")(?=$|[^A-Za-zÀ-ÿĀ-žʻʼ’0-9_])", "gi");
  }

  const forms = new Set([q]);
  ["ni","ning","ga","da","dan","lar","lari","larda","lardan","di","im","imni","imning","ge","qa","ke","de","den","ten","i","in","ini","ining","ida","idan"].forEach(s => forms.add(q + s));
  if (q === "men") ["meni","menga","menda","mendan","mening"].forEach(x => forms.add(x));
  const pattern = Array.from(forms).sort((a,b) => b.length - a.length).map(escapeRegExp).join("|");
  return new RegExp("(^|[^A-Za-zÀ-ÿĀ-žʻʼ’0-9_])(" + pattern + ")(?=$|[^A-Za-zÀ-ÿĀ-žʻʼ’0-9_])", "gi");
}

function matches(text, regex) {
  if (!regex) return false;
  regex.lastIndex = 0;
  return regex.test(String(text).toLowerCase());
}

function filteredRows() {
  const q = els.searchInput.value.trim();
  if (!q) return [];
  const regex = makeRegex(q, els.modeSelect.value);
  const field = els.fieldSelect.value;
  return allRows().filter(r => {
    if (field === "all") return matches(r.uz, regex) || matches(r.qq, regex);
    return matches(r[field], regex);
  });
}

function highlight(text, row) {
  const q = els.searchInput.value.trim();
  if (!q) return text;
  const regex = makeRegex(q, els.modeSelect.value);
  if (!regex) return text;
  regex.lastIndex = 0;
  return String(text).replace(regex, function(full, prefix, token) {
    const payload = encodeURIComponent(JSON.stringify({
      token: token,
      source: row.source,
      genre: row.genre,
      sheet: row.__sheet,
      id: row.id
    }));
    return prefix + '<span class="hit" data-payload="' + payload + '">' + token + '</span>';
  });
}

function buildSelects() {
  const t = UI[lang];
  const c = cols();

  const currentSheet = els.sheetSelect.value || "all";
  const currentField = els.fieldSelect.value || "all";

  els.sheetSelect.innerHTML = "";
  [["all", t.sheets.all], ...SHEETS.map(s => [s.name, t.sheets[s.name] || s.name])].forEach(item => {
    const o = document.createElement("option");
    o.value = item[0];
    o.textContent = item[1];
    if (item[0] === currentSheet) o.selected = true;
    els.sheetSelect.appendChild(o);
  });

  els.fieldSelect.innerHTML = "";
  [["all", t.all], [c.leftKey, c.leftLabel], [c.rightKey, c.rightLabel]].forEach(item => {
    const o = document.createElement("option");
    o.value = item[0];
    o.textContent = item[1];
    if (item[0] === currentField) o.selected = true;
    els.fieldSelect.appendChild(o);
  });
}

function applyLang() {
  const t = UI[lang];
  const c = cols();

  els.title.textContent = t.title;
  els.lblSearch.textContent = t.search;
  els.searchInput.placeholder = t.placeholder;
  els.lblMode.textContent = t.mode;
  els.modeSelect.options[0].text = t.exact;
  els.modeSelect.options[1].text = t.forms;
  els.lblSheet.textContent = t.sheet;
  els.lblField.textContent = t.field;
  els.lblLimit.textContent = t.limit;
  els.lblTotal.textContent = t.total;
  els.lblFound.textContent = t.found;
  els.lblPair.textContent = t.pair;
  els.leftHeader.textContent = c.leftLabel;
  els.rightHeader.textContent = c.rightLabel;
  els.pairName.textContent = c.leftLabel + " ↔ " + c.rightLabel;
  els.hintState.textContent = t.hint;
  els.emptyState.textContent = t.empty;

  els.btnUZ.classList.toggle("active", lang === "uz");
  els.btnQQ.classList.toggle("active", lang === "qq");

  buildSelects();
  render();
}

function render() {
  const q = els.searchInput.value.trim();
  const rowsAll = allRows();
  const rows = filteredRows();
  const limit = parseInt(els.limitSelect.value || "50", 10);

  els.totalCount.textContent = rowsAll.length;
  els.resultCount.textContent = q ? rows.length : 0;
  els.tableBody.innerHTML = "";

  if (!q) {
    els.hintState.style.display = "block";
    els.emptyState.style.display = "none";
    return;
  }

  els.hintState.style.display = "none";

  if (!rows.length) {
    els.emptyState.style.display = "block";
    return;
  }

  els.emptyState.style.display = "none";
  const c = cols();

  rows.slice(0, limit).forEach(row => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td class='idcol'>" + row.id + "</td><td>" + highlight(row[c.leftKey], row) + "</td><td>" + highlight(row[c.rightKey], row) + "</td>";
    els.tableBody.appendChild(tr);
  });
}

      "<h4>" + d.token + "</h4>" +
      "<div class='tagline'><b>Ekstralingvistik teg:</b></div>" +
      "<div class='tagline'><b>" + (lang === "uz" ? "Manba" : "Deregi") + ":</b> " + d.source + "</div>" +
      "<div class='tagline'><b>" + (lang === "uz" ? "Bo'lim" : "Bólim") + ":</b> " + sheetLabel + "</div>" +
      "<div class='tagline'><b>Janr:</b> " + d.genre + "</div>" +
      "<div class='tagline'><b>Gap ID:</b> " + d.id + "</div>";
    els.popover.style.display = "block";
    els.popover.style.left = Math.min(e.pageX + 12, window.innerWidth - 340) + "px";
    els.popover.style.top = (e.pageY + 12) + "px";
  } else if (!e.target.closest("#popover")) {
    els.popover.style.display = "none";
  }
});

applyLang();
